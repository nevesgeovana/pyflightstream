# The morphing control file. geometry morph applies the tables it holds in this order:
# [hub_rings], [repitch], [collapse_te], [wheel]; each verb (hub-rings, repitch, collapse-te)
# also reads its own table alone. blades and hub at the top serve every table; a table's own
# key wins.
blades = ["Blade1"]
hub = ["Spinner"]

# Rings of quads around each blade root on a quad-dominant hub (geometry hub-rings), for the
# ring route of repitch. Optional: without it, hub_method = "auto" or "remesh" in [repitch]
# remeshes the hub band around each turned root instead.
[hub_rings]
rings = 4
# band_width = 0.02  # total height in mesh units; default rings x median hub edge at the root
# width is a deprecated alias; equal duplicates are accepted, conflicting values are refused.

# Small rigid blade pitch change. Coordinates use the mesh frame and unit.
[repitch]
angle_deg = 1.0
blades = ["Blade1"]
hub = ["Spinner"]
keep = []
axis = { origin = [0.0, 0.0, 0.0], direction = [0.0, 0.0, 1.0] }
max_angle_deg = 5.0
# For a reference-defined radial axis, use axis = "auto" and reference = "rotor.toml".
# To find each pitch axis from the rotor axis, drop axis and state:
# rotor_axis = "x"        # or a vector [1.0, 0.0, 0.0]
# reference_point = 0.25  # a coordinate along rotor_axis, or a point [x, y, z]
# How the hub follows each blade: "rings" moves the complete quad rings around the root,
# "remesh" (OBJ only) remeshes the hub band around the turned root quad-dominant, and "auto"
# takes the rings where every root has two complete rings and the remesh otherwise.
# hub_method = "auto"
# band_width = 0.02       # remesh band in mesh units; default the root's move + 2 local cells

# Collapse the blunt trailing edge of named blades on an OBJ (geometry collapse-te).
# Run repitch first when both are wanted.
[collapse_te]
blades = ["Blade1"]
# base = ["Blade1Base"]  # the group holding the strip, when no boundaries file declares the rims

# Copy a finished sector about the rotor axis into the full wheel (geometry morph only).
# [wheel]
# axis = "z"                # the rotor axis; needed when [repitch] states no rotor_axis
# center = [0.0, 0.0, 0.0]  # rotor-axis point; default origin, independent of reference_point
# copies = 6                # default from the sector's angle
