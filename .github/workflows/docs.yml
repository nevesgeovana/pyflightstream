# Publish the ProperDocs site to GitHub Pages on every push to main.
# The reference, compatibility matrix, and architecture pages are
# generated at build time from the command database, so the published
# site can never drift from the code. Pages source must be set to
# "GitHub Actions" in the repository settings for the deploy job.
name: docs

on:
  push:
    branches: [main]

# Least privilege at workflow scope. `pages: write` and
# `id-token: write` used to be granted here, which handed them to the
# BUILD job as well, and the build job is the one that installs and runs
# third-party dependencies. Only the deploy job needs them, and it asks
# for them itself below.
permissions:
  contents: read

# One deploy at a time; do not cancel a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e .[dev,fsi,geom]
      - name: Build the docs (strict)
        run: properdocs build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
