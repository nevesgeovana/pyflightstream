# Tier 1 CI: everything here runs without FlightStream (no license in the
# cloud). Tier 2 (command validity probes) and Tier 3 (physics regression)
# run on a licensed local machine and commit their evidence under reports/.
name: ci

on:
  push:
  pull_request:

# REV010-019. Declared explicitly rather than left absent: an absent block
# is not "grants nothing", it falls back to the repository default token,
# which can be read-write on every scope. Nothing in this workflow writes
# anything back to the repository.
permissions:
  contents: read

jobs:
  test:
    # Windows is where this package is USED, because FlightStream runs on
    # Windows (NFR-05), and until 2026-08-02 nothing here had ever run on it:
    # a Windows-only path could break and every check stayed green. Both
    # declared Python bounds now run on both platforms, which is four legs.
    # The docs build and the guards stay on Linux alone below, because they
    # test the repository rather than the package's behaviour on a platform.
    runs-on: ${{ matrix.os }}
    strategy:
      # Each leg is evidence about a different platform, so a failure on one
      # must not cancel the others: knowing WHICH legs fail is the point.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history: tests/test_clean_room.py walks every commit
          # since its baseline, and a shallow clone does not contain it.
          # The test fails rather than skips when it cannot reach the
          # baseline, so a forgotten fetch-depth is loud (FR-08).
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e .[dev,fsi,geom]
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tier 1 tests
        run: pytest
      - name: Executable examples
        # Sybil runs the docstring doctests and the python code blocks
        # in the root README and docs/ (INB-006 item 1e, decision
        # Q-007), with warnings promoted to errors; the shim skiplist
        # is in the root conftest.py.
        run: pytest src/pyflightstream README.md docs -W error

  coverage:
    # One leg, not four. Coverage is a property of the test suite rather than
    # of a platform, and four measurements would be four numbers to reconcile
    # with one floor. The floor lives in pyproject
    # ([tool.coverage.report] fail_under) so the number has one home and moves
    # only with a commit that explains it (NFR-16).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # the clean-room walk, as in the test job
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e .[dev,fsi,geom]
      - name: Tier 1 with the coverage floor
        run: pytest --cov --cov-branch --cov-report=term-missing

  types:
    # One leg, like the coverage floor and for the same reason: the answer
    # is a property of the source, not of the platform. The exemption list
    # in [tool.mypy] is the debt this ratchet is shrinking; a new module or
    # a newly dirty clean one fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e .[dev,fsi,geom]
      - name: Type check the package
        run: mypy

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e .[dev,fsi,geom]
      - name: Docs build
        run: properdocs build --strict
      - name: Docs hook effect check
        # The scripts/docs_hooks.py exclusion must keep the literate-nav
        # input out of the rendered site; strict mode alone would not
        # fail on an extra unlisted page (dual-namespace note in the
        # hook).
        run: |
          if [ -e site/reference/SUMMARY ] || [ -e site/reference/SUMMARY.md ] || [ -e site/reference/SUMMARY/index.html ]; then
            echo "reference/SUMMARY leaked into the rendered site"
            exit 1
          fi

  guard:
    # Repository-wide guards for the hard invariants (CLAUDE.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: No pdf, notebook, or _private content tracked
        run: |
          bad=$(git ls-files | grep -Ei '\.pdf$|\.ipynb$|^_private/' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden tracked files found:"
            echo "$bad"
            exit 1
          fi
