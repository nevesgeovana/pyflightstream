# Release workflow: publishes pyflightstream to PyPI through trusted
# publishing (OIDC), so no API token is stored in the repository. It
# mirrors the ITACA release workflow. Requires the matching publisher
# configured on PyPI (project pyflightstream, owner nevesgeovana,
# repository pyflightstream, workflow release.yml, environment pypi)
# and a GitHub environment named pypi. Triggered by version tags only;
# the tag is cut after the release skill's gates are green (including
# the role-review and release attestations).
#
# REV010-016 changed the SHAPE of this workflow. It used to build, run
# `twine check`, and publish on the strength of the build job alone, so
# a tag could publish while ci.yml was failing, and the artifact that
# reached PyPI was never the artifact any test had exercised: ci.yml
# installs the source in editable mode and tests that instead. Build,
# test and publish are one evidence chain or they are not evidence.
#
# Now: build once, record the wheel's digest, install THAT wheel into
# clean jobs and run the release gates against it, and publish only
# after every one of them passes. The digest is re-checked immediately
# before publishing, so the bytes that were tested are the bytes that
# ship.
#
# Actions are pinned by commit digest (REV010-019). A tag is mutable and
# can be repointed at new code by its owner; a digest cannot. Update
# them deliberately, with `gh api repos/<owner>/<repo>/commits/<ref>`,
# and keep the human-readable ref in the trailing comment so the next
# reader can tell what is pinned.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege at workflow scope: only the publish job needs the OIDC
# token, and it asks for it itself. Granting id-token at workflow scope
# would hand it to the job that installs and runs third-party build
# tooling, which is the job with the largest untrusted surface.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      wheel-sha256: ${{ steps.digest.outputs.sha256 }}
      wheel-name: ${{ steps.digest.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          # Build tooling is constrained rather than "whatever is current"
          # (REV010-019): an unpinned build backend can change what the
          # artifact contains between two runs of the same commit, and
          # nothing in the repository diff would record it.
          python -m pip install --upgrade "pip==26.1.2" "build==1.5.0" "twine==6.2.0"
          python -m build
          twine check dist/*
      - name: Verify tag matches the package version
        run: |
          # pyflightstream single-sources the version in pyproject.toml
          # (there is no version.py; __version__ derives from the
          # installed metadata).
          VERSION=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match pyproject.toml version $VERSION" >&2
            exit 1
          fi
      - name: Record the wheel digest
        id: digest
        run: |
          # The identity of what is about to be tested and published. Both
          # later jobs re-derive it and refuse if it moved.
          WHEEL=$(ls dist/*.whl)
          echo "name=$(basename "$WHEEL")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$WHEEL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # Printed to the run log for the record. Deliberately NOT added to
          # the uploaded artifact: the publish action uploads everything in
          # dist/, so a stray text file there would be offered to PyPI, and
          # uploading it beside dist/ instead would change the download
          # layout and move the wheel path every later job depends on.
          sha256sum dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  # The release gates, run against the BUILT WHEEL rather than against an
  # editable install of the source tree. ci.yml still runs on the tag push
  # and tests the source; this job answers the different question of
  # whether the artifact works.
  test-artifact:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # The clean-room walk needs the full history, as in ci.yml.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - name: Confirm the wheel is the one that was built
        shell: bash
        run: |
          WHEEL="dist/${{ needs.build.outputs.wheel-name }}"
          ACTUAL=$(sha256sum "$WHEEL" | cut -d' ' -f1)
          if [ "$ACTUAL" != "${{ needs.build.outputs.wheel-sha256 }}" ]; then
            echo "wheel digest changed between build and test: $ACTUAL" >&2
            exit 1
          fi
      - name: Install the built wheel, not the source
        shell: bash
        run: |
          # No -e and no ".": the point is that the tests import the
          # artifact. With the src layout, an editable install would put
          # the working tree on the path and this whole job would be
          # testing the same thing ci.yml already tests.
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install "dist/${{ needs.build.outputs.wheel-name }}[dev,fsi,geom]"
      - name: Confirm the installed distribution is the built one
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import pathlib
          import pyflightstream
          location = pathlib.Path(pyflightstream.__file__).resolve()
          assert "site-packages" in location.parts, f"not the installed wheel: {location}"
          print("testing", md.version("pyflightstream"), "from", location)
          PY
      - name: Tier 1 tests against the wheel
        run: pytest
      - name: Executable examples against the wheel
        run: pytest README.md docs -W error

  gates:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e .[dev,fsi,geom]
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Coverage floor
        run: pytest --cov --cov-branch --cov-report=term-missing
      - name: Docs build
        run: properdocs build --strict

  publish:
    # Every gate, not just the build. A tag used to publish while ci.yml
    # was red because nothing here waited for it (REV010-016).
    needs: [build, test-artifact, gates]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyflightstream/
    permissions:
      # OIDC trusted publishing: the workflow exchanges a short-lived
      # identity token with PyPI instead of a stored secret.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - name: Publish the same bytes that were tested
        run: |
          WHEEL="dist/${{ needs.build.outputs.wheel-name }}"
          ACTUAL=$(sha256sum "$WHEEL" | cut -d' ' -f1)
          echo "publishing $WHEEL sha256=$ACTUAL"
          if [ "$ACTUAL" != "${{ needs.build.outputs.wheel-sha256 }}" ]; then
            echo "refusing to publish: the wheel is not the artifact the gates passed" >&2
            exit 1
          fi
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
