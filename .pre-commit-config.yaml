# Pre-commit hooks: fast guards that run before every local commit.
# The heavier house-style and database-schema guards run as tier 1 tests
# (tests/test_house_style.py, tests/test_command_db.py) and in CI.
#
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # The goldens are byte-exact fixtures: their bytes ARE the
      # assertion, including a trailing blank line where a block layout
      # emits one. A whitespace hook editing them does not tidy a file,
      # it rewrites the expected value to match whatever the code now
      # produces, which is the one thing a golden exists to prevent.
      # Measured on 2026-08-07: end-of-file-fixer stripped the blank
      # line ending motion_6dof_family_26.120.txt and turned a passing
      # comparison red, and had the emitter been the thing that changed
      # it would have turned a failing one green.
      #
      # THE SAME REASONING COVERS tests/fixtures/ AND WAS NOT EXTENDED
      # TO IT UNTIL 2026-08-20. A fixture there is not an expected value
      # this repository authored, it is a RECORD OF WHAT THE SOLVER
      # WROTE, captured on a licensed machine that a fresh clone does
      # not have. Editing one does not tidy a file, it edits evidence
      # that cannot be re-taken, and it does so silently: the hook fixes
      # the file, fails the commit, and a second `git commit` succeeds
      # over the rewritten bytes with nothing said.
      #
      # Measured the day it was extended, on the SEVEN captures of that
      # night: trailing-whitespace stripped exactly one line of fifty
      # spaces from the preamble of six of them. It cost nothing, because
      # no parser reads that line. It was still the wrong thing to have
      # happened, and the next capture could as easily carry a
      # space-delimited field where the loss is the value.
      #
      # BOTH FIGURES WERE WRONG IN THE FIRST VERSION of this comment, and
      # the second one mattered: it said forty spaces (it is fifty) and
      # five captures of which four were stripped. The two it left out
      # were committed BEFORE this exclusion landed, so they stayed
      # mutilated in the tree while the comment beside them described the
      # fix. A V and V pass found them by the right discriminator: the
      # capture report records their byte counts, and both files were
      # exactly fifty short. Both were re-captured on the licensed
      # machine and restored.
      - id: trailing-whitespace
        exclude: '^tests/(goldens|fixtures)/'
      - id: end-of-file-fixer
        exclude: '^tests/(goldens|fixtures)/'
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
      - id: ruff-format
      # A THIRD RUFF ENTRY STOOD HERE and is gone with the reason for it.
      # The clean-room commit-msg hook used to live inside a directory
      # `pyproject.toml` excluded from linting, and with `force-exclude`
      # that exclusion beat anything pre-commit passed in, so the one
      # repository-owned file in there needed its own entry with
      # `--no-force-exclude`. It now lives in `scripts/`, which nothing
      # excludes, so the plain `ruff` entry above lints it like any other
      # maintainer script.

  # Guard: licensed or binary documents never enter Git (invariant 1).
  - repo: local
    hooks:
      - id: forbid-pdf
        name: forbid pdf files
        entry: pdf files never enter Git (invariant 1)
        language: fail
        files: '\.pdf$'
      - id: forbid-notebooks
        name: forbid notebooks
        entry: examples are percent-format .py, notebooks never enter Git (invariant 7)
        language: fail
        files: '\.ipynb$'
      - id: forbid-private
        name: forbid _private content
        entry: _private/ is local only and never enters Git (invariants 1 and 5)
        language: fail
        files: '^_private/'
      # Geometry and mesh files (invariant 5, SRS NFR-08 and NFR-14). The
      # authority for the suffix list is IMPORT's file_type enum in
      # commands/mesh_import_export.yaml plus the saved-simulation .fsm and
      # the CAD interchange formats research geometry arrives in.
      #
      # This is the SECOND of two guards for the same class, not the only
      # one. tests/test_house_style.py holds the tier-1 walk NFR-14 asks
      # for, over every tracked path with the same suffix set and the same
      # allowlist; this hook exists because the breach is irreversible once
      # pushed, so it is worth refusing at the moment of the commit rather
      # than at the next test run. The two lists must move together, and the
      # tier-1 guard is the one with the mutation proof.
      - id: forbid-geometry
        name: forbid geometry and mesh files
        entry: >
          research geometry never enters Git (invariant 5, NFR-14); keep it in
          _private/ or generate synthetic geometry from pyflightstream.qa.geometry
        language: fail
        # (?i) is load-bearing: the tier-1 detector lowercases the suffix
        # before comparing, so without it blade.STL is refused by the suite
        # and waved through at commit time. Two answers to one defect class.
        files: '(?i)\.(stl|tri|p3d|inp|lawgs|vtk|ac|fac|obj|fsm|step|stp|iges|igs|sat|x_t|x_b|3dm|msh|cgns|ply|off|nas|bdf)$'
        exclude: '^(tests/fixtures/cube\.obj|tests/goldens/planar_probes\.vtk)$'

      # Guard: the FR-08 clean-room trailer must be a real git trailer, and
      # this fires while the message can still be edited. The tier-1 walk
      # (tests/test_clean_room.py) is the authority; it runs over every
      # commit since the baseline, so its findings cannot be cleared by a
      # follow-up commit the way a per-change check can, and a message that
      # slipped past has to be rewritten. Measured 2026-08-09 on an unpushed
      # release commit. The hook script carries the reasoning.
      - id: clean-room-trailer
        name: clean-room trailer is in the last paragraph
        entry: python scripts/check_clean_room_trailer.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
