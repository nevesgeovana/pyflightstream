# Pre-commit hooks: fast guards that run before every local commit.
# The heavier house-style and database-schema guards run as tier 1 tests
# (tests/test_house_style.py, tests/test_command_db.py) and in CI.
#
# The vendored shared-process-kit copies are byte-exact derivations of the
# coordination kit master and are guarded by the tier-1 drift test
# (tests/test_kit_drift.py), not by these hooks: a whitespace trim, an
# end-of-file newline, or a ruff reformat changes the body bytes and breaks
# the sha256 pin. They are excluded from every hook here; fixes are made in
# the kit and re-vendored. (ruff also force-excludes them via pyproject.)
#
# THE HOOKS DIRECTORY IS EXCLUDED WITH ONE NAMED EXCEPTION, since 2026-08-11,
# and the inversion is deliberate. This pattern used to name the two vendored
# hooks one at a time, so a vendored body arriving beside them was included by
# default. That happened: kit 0.2.18 brought `ci_state.py` and
# `ci_state_mutations.py`, ruff-format rewrote both at the very commit that
# was vendoring them, and the drift test went red on two hashes. Recoverable
# in one re-vendor, but the same enumeration also sat in `pyproject.toml` and
# in `.gitattributes`, which is three lists to remember instead of one.
# A new VENDORED hook is now excluded by default; a new REPOSITORY-OWNED hook
# has to be named in the lookahead to be checked. That is the safer direction
# to forget in: an unchecked repository file is a style miss, a reformatted
# vendored body is a broken pin and a red suite.
exclude: '^\.claude/(tools/|hooks/(?!check_clean_room_trailer\.py)|agents/incident-analyst\.md$)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # The goldens are byte-exact fixtures: their bytes ARE the
      # assertion, including a trailing blank line where a block layout
      # emits one. A whitespace hook editing them does not tidy a file,
      # it rewrites the expected value to match whatever the code now
      # produces, which is the one thing a golden exists to prevent.
      # Measured on 2026-08-07: end-of-file-fixer stripped the blank
      # line ending motion_6dof_family_26.120.txt and turned a passing
      # comparison red, and had the emitter been the thing that changed
      # it would have turned a failing one green.
      - id: trailing-whitespace
        exclude: '^tests/goldens/'
      - id: end-of-file-fixer
        exclude: '^tests/goldens/'
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
      - id: ruff-format
      # The one repository-owned hook under .claude/hooks/, linted by name.
      #
      # It cannot ride the plain `ruff` entry above. `pyproject.toml` excludes
      # `.claude/hooks/**` so a newly vendored body is safe by default, and
      # with `force-exclude = true` that wins over anything pre-commit passes
      # in, `extend-include` included (measured 2026-08-11: ruff answered "No
      # Python files found" for this exact path). `--no-force-exclude` is the
      # only form that overrides it, so the file that IS ours gets its own
      # entry rather than the directory getting a weaker rule.
      #
      # It is a THIRD ruff entry rather than a local `language: system` hook,
      # and that is the second attempt. The first ran `python -m ruff` under
      # pre-commit's system interpreter, which has no ruff installed; it
      # reported "Skipped, no files to check" on the commit that introduced it
      # and would have gone on doing so forever. Found by running it against
      # the file on purpose instead of trusting the green line.
      - id: ruff
        alias: ruff-repo-owned-hook
        name: ruff (repository-owned hook)
        args: ["--no-force-exclude"]
        files: '^\.claude/hooks/check_clean_room_trailer\.py$'

  # Guard: licensed or binary documents never enter Git (invariant 1).
  - repo: local
    hooks:
      - id: forbid-pdf
        name: forbid pdf files
        entry: pdf files never enter Git (invariant 1)
        language: fail
        files: '\.pdf$'
      - id: forbid-notebooks
        name: forbid notebooks
        entry: examples are percent-format .py, notebooks never enter Git (invariant 7)
        language: fail
        files: '\.ipynb$'
      - id: forbid-private
        name: forbid _private content
        entry: _private/ is local only and never enters Git (invariants 1 and 5)
        language: fail
        files: '^_private/'
      # Geometry and mesh files (invariant 5, SRS NFR-08 and NFR-14). The
      # authority for the suffix list is IMPORT's file_type enum in
      # commands/mesh_import_export.yaml plus the saved-simulation .fsm and
      # the CAD interchange formats research geometry arrives in.
      #
      # This is the SECOND of two guards for the same class, not the only
      # one. tests/test_house_style.py holds the tier-1 walk NFR-14 asks
      # for, over every tracked path with the same suffix set and the same
      # allowlist; this hook exists because the breach is irreversible once
      # pushed, so it is worth refusing at the moment of the commit rather
      # than at the next test run. The two lists must move together, and the
      # tier-1 guard is the one with the mutation proof.
      - id: forbid-geometry
        name: forbid geometry and mesh files
        entry: >
          research geometry never enters Git (invariant 5, NFR-14); keep it in
          _private/ or generate synthetic geometry from pyflightstream.qa.geometry
        language: fail
        # (?i) is load-bearing: the tier-1 detector lowercases the suffix
        # before comparing, so without it blade.STL is refused by the suite
        # and waved through at commit time. Two answers to one defect class.
        files: '(?i)\.(stl|tri|p3d|inp|lawgs|vtk|ac|fac|obj|fsm|step|stp|iges|igs|sat|x_t|x_b|3dm|msh|cgns|ply|off|nas|bdf)$'
        exclude: '^(tests/fixtures/cube\.obj|tests/goldens/planar_probes\.vtk)$'

      # Guard: the FR-08 clean-room trailer must be a real git trailer, and
      # this fires while the message can still be edited. The tier-1 walk
      # (tests/test_clean_room.py) is the authority; it runs over every
      # commit since the baseline, so its findings cannot be cleared by a
      # follow-up commit the way a per-change check can, and a message that
      # slipped past has to be rewritten. Measured 2026-08-09 on an unpushed
      # release commit. The hook script carries the reasoning.
      - id: clean-room-trailer
        name: clean-room trailer is in the last paragraph
        entry: python .claude/hooks/check_clean_room_trailer.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
