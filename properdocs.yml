  # Tutorials, How-to guides, Reference and Explanation, then Project, which
  # holds the SRS, the project records and the upgrade pages. Every page keeps
  # its file name and its anchors; only its place in the menu moved. The LaTeX
  # user guides are linked from the home page, not absorbed.
  - Tutorials:
      - Home: index.md
      - Getting started: getting-started.md
