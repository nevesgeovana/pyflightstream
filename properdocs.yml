# Docs configuration for ProperDocs (the maintained MkDocs fork; the
# repository migrated after a green drop-in test, 2026-07-23, license
# evidence reports/RPT-009). Kept at the repository root (the builder
# requires the config file outside docs_dir); the DLV-004 tree placed
# it under docs/, a deliberate small deviation recorded at M0.
site_name: pyflightstream
site_description: Version-aware, didactic Python driver for FlightStream
site_url: https://nevesgeovana.github.io/pyflightstream/
repo_url: https://github.com/nevesgeovana/pyflightstream

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top

# The generated reference/SUMMARY.md exists only to feed literate-nav;
# the hook keeps it out of the rendered site (exclude_docs cannot see
# gen-files virtual files).
hooks:
  - scripts/docs_hooks.py

plugins:
  - search
  # The command reference and the compatibility matrix are generated at
  # build time from the command database (single rendering source:
  # src/pyflightstream/reference.py, shared with pyflightstream.help()).
  # Nothing generated is committed.
  - gen-files:
      scripts:
        - scripts/gen_docs_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  # The fence reader the pages are written for (D07 of 0.27.0). The built-in
  # one reads neither a titled fence, ```toml title="inputs/pproc/p001.toml",
  # nor a fence inside a list item: the first rendered 286 lines of the
  # workflows page as one code block and cut the mesh page's complete example,
  # the second lost the code block of four list items on four pages. Both ship
  # with the material theme (pymdown-extensions, MIT, a dependency of
  # mkdocs-material, which RPT-033 cards), so nothing new is installed.
  # tests/tier1_offline/test_goal031_d07_pages.py renders every page with this
  # list and fails on a fence, a heading or a table row it would lose.
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css
nav:
  # Organized by task (0.32.0): Getting started, Workflows, Post-processing,
  # Reference, Migration. A page keeps its file name and its anchors; the old
  # workspace page is now the index of the Workflows group, and each run type
  # and topic it held has a page of its own. Each fact has one home.
  - Getting started:
      - Home: index.md
      - Getting started: getting-started.md
      - From the GUI to pyfs: gui-to-pyfs.md
      - Replaying a recorded run: tutorial-replay.md
  - Workflows:
      - The workspace and the workflow: workspace-and-workflows.md
      - Run types:
          - The run matrix, a campaign and its record: workflow-run-matrix.md
          - The steady workflow: workflow-steady.md
          - The unsteady workflow: workflow-unsteady.md
          - The unsteady rotor workflow: workflow-unsteady-rotor.md
          - The quasi-steady rotor: workflow-qsteady-rotor.md
      - Geometry:
          - Mesh inputs and GUI-only operations: mesh-inputs.md
          - CAD inputs: cad-inputs.md
          - Geometry units and starts: geometry-units-and-starts.md
          - Simulation geometry controls: simulation-geometry-controls.md
          - Surface translation: surface-translation.md
          - One row, one geometry, turned or moved: workflow-row-geometry-motion.md
      - Inputs and setup:
          - The input library and the solver presets: workflow-input-library.md
          - The reference artifact: workflow-reference-artifact.md
          - Flight conditions: flight-conditions.md
          - Custom field units and coverage: custom-field-units.md
          - Setup standards and guidance: setup-standards.md
          - Boundary conditions: boundary-conditions.md
          - Field operations: field-operations.md
          - One row, one actuator disc or one custom free stream: workflow-row-flow-inputs.md
          - The input glossary: inputs.md
      - Running:
          - Planning a campaign and what it costs: workflow-plan-and-cost.md
          - Builds, local runs and clusters: workflow-builds-and-hpc.md
          - What a run cost: solver-cost.md
          - Continuation and recovery: continuation-recovery.md
          - Storage and sync: storage-and-sync.md
          - Excel matrix synchronization: excel-matrices.md
      - FSI:
          - FSI in a workspace: fsi-workspace.md
          - FSI driver tutorial: fsi-tutorial.md
          - FSI Campbell diagram: examples/fsi_campbell_diagram.md
          - FSI blade properties from its sections: examples/fsi_solid_blade_properties.md
          - Workspace FSI calibration: examples/workspace_fsi_calibration.md
      - Examples:
          - CAD script with explicit units: examples/cad_import.md
          - Base-region setup: examples/base_region_setup.md
          - Steady polar: examples/steady_polar.md
          - Campaign from a run matrix: examples/campaign_matrix.md
          - Wing static deflection: examples/wing_static_deflection.md
          - Wing OBJ, trailing edge by file: examples/obj_wing_trailing_edge_file.md
          - A row with a roll rate: examples/roll_rate_row.md
          - Inspect continuation recovery: examples/continuation_frame_recovery.md
          - Prepare an SI custom field: examples/prepare_custom_field.md
          - Excel workbook synchronization: examples/excel_matrix_sync.md
  - Post-processing:
      - Post-processing definitions: post-processing-definitions.md
      - The post-processing artifact and its products: pproc-artifact.md
      - Extracting more from a finished point: workflow-additional-post.md
      - Sampled velocity fields: sampled-fields.md
      - Boundary-layer products: boundary-layer-products.md
      - Quasi-steady wheel corrections: qsteady-corrections.md
      - Unsteady plots and averages: unsteady-postprocessing.md
      - Examples:
          - Extracting more from a finished point: examples/additional_post.md
          - Native nodal surface strength: examples/surface_with_native_strength.md
          - Sampled-field products: examples/sampled_field_export.md
          - Boundary-layer sections: examples/boundary_layer_sections.md
  - Reference:
      - Command reference: reference/
      - SRS:
          - srs/index.md
          - Introduction: srs/introduction.md
          - Philosophy: srs/philosophy.md
          - Scope: srs/scope.md
          - Data and evidence model: srs/data-model.md
          - Architecture: srs/architecture-srs.md
          - Functional requirements: srs/functional-requirements.md
          - Non-functional requirements: srs/nonfunctional-requirements.md
          - Standards alignment: srs/standards.md
          - Roadmap: srs/roadmap.md
      - Which build do I have: builds.md
      - Compatibility matrix: compatibility.md
      - House conventions: conventions.md
      - The test tiers and the licensed workspace: tiers.md
      - Acceptance mapping: requirement-mapping.md
      - Numeric settings codebook: settings-codebook.md
      - Architecture: architecture.md
      - Sister library (ITACA): sister-itaca.md
  - Migration:
      # One section, newest first, so a release adds a line here.
      - Release notes: release-notes.md
      - Migrating to 0.31.0: migrating-to-0.31.0.md
      - Migrating to 0.30.0: migrating-to-0.30.0.md
      - Migrating to 0.29.0: migrating-to-0.29.0.md
      - Migrating to 0.28.0: migrating-to-0.28.0.md
      - Migrating to 0.27.0: migrating-to-0.27.0.md
      - Migrating to 0.26.0: migrating-to-0.26.0.md
      - Migrating to 0.25.0: migrating-to-0.25.0.md
      - Migrating to 0.24.0: migrating-to-0.24.0.md
      - Migrating to 0.23.0: migrating-to-0.23.0.md
      - Migrating to 0.22.0: migrating-to-0.22.0.md
      - Migrating to 0.21.0: migrating-to-0.21.0.md
