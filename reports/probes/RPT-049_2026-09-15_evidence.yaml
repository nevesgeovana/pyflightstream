rotor_mark_scripts_note: 'isrotor_<build>_* are the seven-script table of RPT-049, rerun on 26.100 and
  26.000 the same morning with the outcome the report states; names_<build>_* compare SET_MOTION_IS_ROTOR
  with a name no build has, and 26.100 printed ''Unrecognized command in script'' for both, as it does
  for any unknown name, while 26.000 ran the first and refused the second the same way. On 26.000 the
  one-argument form drew only the error line, without the unrecognized-command line: 26.000 knows the
  name and refuses the arguments. open_26100_* show 26.100 unable to open the blade 26.120 saved and able
  to open its own.'
