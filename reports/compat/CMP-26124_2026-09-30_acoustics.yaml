source: >
  Transcription of the licensed probes A0 and A1 of the 0.32.0 round 1 (work package E2,
  GEO-066 2.6), run detached on 2026-09-30 by the release's own probe harness and not by
  pyfs-qa probe. One unsteady march of 24 steps of a single blade turning at 290 rev/min,
  far-field layers 5, then the whole acoustic chain; A0 and A1 differ in the
  ACOUSTIC_SOURCES token only (DISABLE, ENABLE), which is the one-thing comparison every
  judgment below reads. Each command was followed by a PRINT sentinel and a log export, and
  every sentinel after every command was printed in both probes. Scripts: A1 sha256
  ab459c75ee8cb7ad5eb4fe3e07ad4e5df75fc76f2824d07d7de145a01f0294bb, A0 its twin with the one
  token changed; exported signals: A1 sha256
  f160e0e3aa4462f28375cf7e0992a26f7654d6bf2dbdc9464e79ccba6a5e22dd, A0 sha256
  0ccdab020c55733a0e8469cd8fec5364e1ed6f8ac38a8fe32c2f9879a04ac29e. The mesh and the
  exported files are local scratch and not committed; no solver was invoked while writing
  this transcription.
