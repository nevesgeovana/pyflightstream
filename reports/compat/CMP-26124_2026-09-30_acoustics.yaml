commands:
  ACOUSTIC_SOURCES:
    outcome: verified
    detail: >-
      Measured 2026-09-30 on FlightStream 26.124 (round-1 probes A1 against A0, which differ
      in this token only): with ENABLE before INITIALIZE_SOLVER the exported signals carry
      nonzero pressures at every observer (151 of the file's 204 numbers nonzero); with
      DISABLE every pressure column is zero (55 nonzero, the times and positions only).
    signals:
      sentinel_before: true
      sentinel_after: true
      effect: true
      log_errors: []
    return_code: 0
    measurement:
