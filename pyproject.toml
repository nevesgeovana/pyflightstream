[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyflightstream"
version = "0.8.0.dev0"
description = "Version-aware, didactic Python driver for the FlightStream panel-method solver"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Geovana Neves"}]
requires-python = ">=3.11"
# PyPA well-known metadata (audit 2026-07-23). The SPDX license
# expression form is deferred with the VCS-versioning item: it needs a
# setuptools floor bump, and the build toolchain does not move in a
# release week (PLN-024).
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
# xarray confirmed as a runtime dependency by the author's far-field
# extraction instruction of 2026-07-21 (PLN-006 closed): the farfield
# ledgers live on labeled (station, r, psi) arrays.
dependencies = [
    "numpy",
    "pandas",
    "pydantic",
    "pyyaml",
    "xarray",
]

[project.optional-dependencies]
# matplotlib is PSF/BSD-style, MIT-compatible (NFR-02); it backs the
# plotting examples only, no core code imports it.
plot = ["matplotlib"]
# Geometry gate of the probe planner: containment culling and
# distance-to-surface queries (license evidence reports/RPT-003).
geom = ["trimesh", "rtree", "scipy"]
# FSI structural coupling (M6, DLV-007). PyNiteFEA is MIT; license
# evidence: reports/RPT-002_pynitefea-license_2026-07-21.md (NFR-02).
fsi = ["PyNiteFEA>=3.0"]
# Reading a vendor manual pdf, for pyflightstream.utils.manual. A
# MAINTAINER extra: no run path imports it, and the manual it reads is
# licensed material that never enters Git. pypdf is BSD-3-Clause,
# MIT-compatible (NFR-02).
manual = ["pypdf"]
dev = [
    # Licence evidence for every distribution in this block:
    # reports/RPT-033_development-tool-licences_2026-08-19.md, one card
    # section per distribution, read from installed metadata (NFR-02).
    "pytest",
    # PEP 440 version parsing for tests/test_version_identity.py
    # (REV010-015). Declared rather than relied on as pytest's transitive
    # dependency: the architect pass found tier 1 importing it with
    # nothing in this file naming it, so a pytest release that dropped
    # the edge would turn a guard into a collection error. Apache-2.0 and
    # BSD-2-Clause dual, MIT-compatible.
    "packaging",
    # The coverage floor of NFR-16, enforced by the CI `coverage` job.
    # Not in pytest's addopts: instrumentation costs about a third of the
    # suite's runtime and a developer running one test file does not need
    # a whole-package number. The job passes --cov explicitly.
    "pytest-cov",
    # The NFR-27 type-check ratchet; config in [tool.mypy] below.
    "mypy",
    # Executable examples in CI: docstring doctests and markdown code
    # blocks (INB-006 item 1e, decision Q-007). Config in conftest.py.
    "sybil",
    # Pinned to the pre-commit hook version (.pre-commit-config.yaml,
    # ruff-pre-commit v0.15.22) so CI, the local hook, and developer
    # machines format identically. Ruff changes formatting between
    # releases by design, so an unpinned dev install drifts from the
    # hook; bump both together (PLN-024).
    "ruff==0.15.22",
    "pre-commit",
    # Docs build tool (license evidence: reports/RPT-009). The material
    # theme and the nav plugins keep their mkdocs package names and
    # still pull the mkdocs library during the ecosystem transition.
    "properdocs",
    "mkdocs-material",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]

[project.scripts]
pyfs-qa = "pyflightstream.qa.cli:main"
pyfs-fsi = "pyflightstream.fsi.cli:main"
pyfs-workspace = "pyflightstream.workspace.cli:main"
pyfs-matrix = "pyflightstream.run.cli:main"
# Maintainer tool, needs the [manual] extra. Compares a vendor manual
# against the command database; writes only with --write.
pyfs-manual = "pyflightstream.utils.cli:main"

[project.urls]
Repository = "https://github.com/nevesgeovana/pyflightstream"
Documentation = "https://nevesgeovana.github.io/pyflightstream/"
Changelog = "https://github.com/nevesgeovana/pyflightstream/blob/main/CHANGELOG.md"
Issues = "https://github.com/nevesgeovana/pyflightstream/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pyflightstream.commands" = ["*.yaml"]
"pyflightstream.qa" = ["references/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_flightstream: requires a local FlightStream installation and license",
    "validity: tier 2 per-command probe tests",
    "physics: tier 3 physics regression matrix (slow)",
    # NFR-13 traceability: requirement("FR-48") on a test declares that
    # the test FALSIFIES that requirement. tests/test_traceability.py
    # holds every marker to a live identifier and ratchets the covered
    # set, so the marker cannot name a requirement that was withdrawn.
    "requirement(identifier): the SRS requirement this test falsifies",
]
addopts = "-m 'not needs_flightstream'"

# NFR-16, the test-coverage floor. The requirement states the rule and
# deliberately does NOT state the number: it lives here, where the tool that
# enforces it reads it, so raising the floor is one edit rather than two
# statements drifting apart.
[tool.coverage.run]
source = ["pyflightstream"]
branch = true

[tool.coverage.report]
# First measurement, whole tier 1 suite, 2026-08-02 (session PFS-B1, review
# finding PYFS-024): 6774 statements with 515 missing and 2058 branches with
# 213 partial, a branch-mode total of 90.69 percent, under the exclusions
# below. Without them it is 6780 statements and 91 percent; the pair is
# recorded so a later reader can tell which number the floor sits under.
#
# The floor is set BELOW that, on purpose and twice over. It is a ratchet
# against regression rather than a target to be gamed, so the measurement is
# the fact and this is the promise; and the measurement above was taken on
# Windows while the floor is enforced on Linux, where the Windows-only
# branches count as uncovered. Four points absorbs both. Raise it when the
# suite earns it, in a commit that says so.
fail_under = 87
show_missing = true
exclude_also = [
    # An annotation-only import block never executes at run time.
    "if TYPE_CHECKING:",
    # A defensive branch that exists to be impossible is not coverage debt.
    "raise AssertionError",
    "raise NotImplementedError",
    "@overload",
]


# --- mypy (NFR-27, from review finding PYFS-026) -------------------
# The package had never been type checked. The first run, on 2026-08-03,
# reported 223 errors in 21 of 53 modules, so a blanket adoption would have
# meant either 223 rushed annotations or a permanently red check, and both
# teach the reader to ignore it. This is a RATCHET instead: mypy runs over the
# whole package, the 21 modules that were not clean on that date are exempted
# BY NAME below, and every other module must stay clean. A new module, or a
# newly dirty clean one, fails the check; an exemption is removed as its
# module is typed, never added. The list is the debt, written down.
#
# RE-COUNTED at 0.8.0.dev0 (OPS-2006.11.01), because the sentence above is a
# fact about 2026-08-03 and was being read as a fact about today. With every
# override below turned off:
#     mypy recount 2026-08-19: 274 errors in 20 of 70 modules
# The package grew by ten modules and the debt by 52 errors, the exempted set
# did not move, and no module outside it is dirty. Every one of the 21 still
# reports at least one error, so not one of these overrides could be deleted
# on evidence. The per-module figures, the reproduction command and the
# dependency versions the count rests on are in reports/RPT-029. Read the two
# numbers differently: the 275 is a DATED measurement that moves with the code
# and with numpy's and xarray's own stubs, while the 63 is re-counted from the
# tracked tree by tests/test_traceability.py on every run, which is what the
# stale 53 had nothing doing for it.
#
# py.typed is deliberately NOT shipped. Shipping it tells every downstream
# type checker to trust these annotations, and a non-empty exemption list says
# they are not yet trustworthy. PEP 561 is promised nowhere in this
# repository, so nothing is broken by the absence; it ships when the exemption
# list is empty (PLN-20260803-1830).
[tool.mypy]
files = ["src/pyflightstream"]
# python_version is deliberately NOT pinned: pinning it to the 3.11 floor
# makes mypy reject numpy's own stubs, which use the 3.12 `type` statement,
# and the error is in a dependency rather than in this package. The check
# therefore runs under whichever interpreter invokes it, and CI runs it on
# one leg, like the coverage floor.
ignore_missing_imports = true
# Off for now and each is a rung of the ratchet: turning one on is a
# deliberate commit that fixes what it surfaces.
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "pyflightstream.cases"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.cases.matrix"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.commands"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.farfield"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.fsi.driver"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.fsi.nodes"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.post.writers"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.probes.geometry"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.probes.planar"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.qa.cli"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.qa.physics"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.qa.probes"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.qa.specs"
ignore_errors = true

# REMOVED 2026-08-19: `pyflightstream.results.tables` was exempt and is
# now clean. Deleting `_as_workspace` (OPS-2009.02.05, the DELETE branch)
# took the module's last type error with it, measured with every override
# off. This is the direction the header comment above promises, an
# exemption removed as its module is typed and never added, and it is the
# first one this project has been able to remove on evidence.

[[tool.mypy.overrides]]
module = "pyflightstream.run"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.script"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.script.entities"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.script.helpers"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.script.solver_setup"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.workspace.inputs"
ignore_errors = true

[[tool.mypy.overrides]]
module = "pyflightstream.workspace.naming"
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
# Markdown is out of ruff's scope: committed .md files (the root
# README.md, the docs pages, and the illustrative developer READMEs under
# src/ such as fsi/README.md) are prose plus code samples, not .py sources
# the formatter should reformat. Ruff gained experimental Markdown
# formatting in a later release, so an unpinned CI install reformats the
# python fences inside those files and fails `ruff format --check`;
# excluding *.md keeps the formatter's authority to .py files regardless of
# the installed ruff version. (Which markdown code blocks are executed is
# Sybil's job, configured in conftest.py, and is independent of ruff.)
#
# The vendored shared-process-kit copies (.claude/tools/ and everything under
# .claude/hooks/ except the one repository-owned script) are byte-exact
# derivations of the coordination kit master, guarded by the tier-1 drift test
# (tests/test_kit_drift.py), NOT by ruff: a reformat or a lint autofix changes
# the body bytes and breaks the sha256 pin. Their canonical home is the kit; a
# real fix is made there and re-vendored. force-exclude makes the exclusion
# hold even when pre-commit passes the files to ruff explicitly.
#
# THE HOOKS ARE EXCLUDED BY DIRECTORY WITH ONE NAMED EXCEPTION, since
# 2026-08-11, and the inversion is the point. This list used to name the two
# vendored hooks one per line, so a vendored body arriving beside them was
# linted by default. On 2026-08-11 that happened: the 0.2.18 gate brought
# `ci_state.py` and `ci_state_mutations.py`, ruff-format rewrote both at the
# pre-commit that was vendoring them, and `test_kit_drift.py` went red on two
# hashes. Recoverable in one re-vendor, but the same enumeration also sat in
# `.pre-commit-config.yaml` and in `.gitattributes`, so it was three lists to
# remember rather than one. Now a NEW VENDORED HOOK IS COVERED BY DEFAULT, and
# a new repository-owned hook has to be named here to be linted. That is the
# safer direction to forget in: an unlinted repository file is a style miss, a
# reformatted vendored body is a broken pin and a red suite.
# The repository-owned hook is NOT rescued by an `extend-include` entry: with
# `force-exclude = true` the exclusion wins, measured here on 2026-08-11 (ruff
# reported "No Python files found" for that exact path). It is linted by a
# named pre-commit hook that passes `--no-force-exclude`, which is the only
# form that overrides this. Said here rather than only in the hook, because
# reading this block alone would otherwise suggest the file is unchecked.
extend-exclude = [
    "*.md",
    ".claude/tools/**",
    ".claude/hooks/**",
]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "D"]
# N803/N806 exempted so aerodynamic symbols (CL, CDi, J, alpha_deg) keep
# their standard names (SAD Section 12).
ignore = ["N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
