# Unsteady Solver chapter (SRC-003 pp.347-348): per-time-step
# monitoring plots and their export. SET_SOLVER_UNSTEADY itself lives
# in solver_settings.yaml with the other solver mode selectors.

UNSTEADY_SOLVER_NEW_FORCE_PLOT:
  layout: keyword_block
  phase: setup
  args:
    - name: frame
      type: int
    - name: units
      type: enum
      values: [COEFFICIENTS, NEWTONS, KILO-NEWTONS, POUND-FORCE, KILOGRAM-FORCE]
    - name: parameter
      type: enum
      values: [CL, CDI, CDO, CD, FORCE_X, FORCE_Y, FORCE_Z, MOMENT_X, MOMENT_Y, MOMENT_Z]
    - name: name
      type: str
    - name: boundaries
      type: int
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-003 p.347"
  versions:
    "26.120": {status: documented}
  notes: >
    Samples one force or moment parameter per solver time step, in
    FRAME and UNITS, over the listed boundaries. BOUNDARIES -1 selects
    every boundary and takes no index line; a positive count is
    followed by the comma-separated boundary indices on the next line.
    Plots must exist before the solver runs to record its steps.

UNSTEADY_SOLVER_NEW_FLUID_PLOT:
  layout: keyword_block
  phase: setup
  args:
    - name: frame
      type: int
    - name: parameter
      type: enum
      values: [CP_FREE, CP_REF, MACH, VELOCITY, VX, VY, VZ, STATIC_PRESSURE_RATIO]
    - name: name
      type: str
    - name: vertex
      type: str
  manual_ref: "SRC-003 p.347"
  versions:
    "26.120": {status: documented}
    "26.121":
      status: documented
      note: >
        SRC-740 p.350 extends PARAMETER with the six boundary-layer
        values, so the 26.121 grammar differs from the 26.120 one in
        its enum alone; the args override below carries it.
      args:
        - name: frame
          type: int
        - name: parameter
          type: enum
          values: [CP_FREE, CP_REF, MACH, VELOCITY, VX, VY, VZ, STATIC_PRESSURE_RATIO,
                   BL_MOMENTUM_THICKNESS, BL_DISPLACEMENT_THICKNESS, BL_TOTAL_THICKNESS,
                   BL_SHAPE_FACTOR, BL_SKIN_FRICTION, BL_TRANSITION_MARKER]
        - name: name
          type: str
        - name: vertex
          type: str
  notes: >
    Samples one fluid property per solver time step at a fixed vertex.
    VERTEX takes the three coordinates preformatted on one line
    (X, then Y, then Z, in the reference units of FRAME); the typed triple validation
    lives in the caller, the same preformatted-token convention as the
    per-surface lines of INITIALIZE_SOLVER.

UNSTEADY_SOLVER_DELETE_ALL_PLOTS:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.347"
  versions:
    "26.120": {status: documented}
  notes: >
    Removes every unsteady solver plot, force and fluid alike, in one
    call; there is no documented per-plot delete. Found missing from
    this chapter while diffing the 26.121 manual against the database
    (PFS-8): it is documented in the 26.12 manual too, so its absence
    was a gap in the original ingestion rather than a version change.

UNSTEADY_SOLVER_EXPORT_PLOTS:
  layout: param_lines
  phase: export
  args:
    - name: filename
      type: path
  manual_ref: "SRC-003 p.347"
  versions:
    "26.120": {status: documented}
  notes: >
    Exports every unsteady solver plot (force and fluid) with one
    column per plot and one row per time step.

NEW_UNSTEADY_SOLVER_SURFACE_PROBE:
  layout: inline
  phase: setup
  args:
    - name: name
      type: str
    - name: parameter
      type: enum
      values: [CP_FREE, CP_REF, MACH, VELOCITY, VX, VY, VZ, STATIC_PRESSURE_RATIO,
               BL_MOMENTUM_THICKNESS, BL_DISPLACEMENT_THICKNESS, BL_TOTAL_THICKNESS,
               BL_SHAPE_FACTOR, BL_SKIN_FRICTION, BL_TRANSITION_MARKER]
    - name: csys
      type: int
    - name: x
      type: float
      unit: length units of the named coordinate system
    - name: y
      type: float
      unit: length units of the named coordinate system
    - name: z
      type: float
      unit: length units of the named coordinate system
  manual_ref: "SRC-740 p.350"
  versions:
    "26.121": {status: documented}
  notes: >
    Samples one surface property per solver time step at a fixed
    vertex, the surface counterpart of UNSTEADY_SOLVER_NEW_FLUID_PLOT.
    New in the 26.121 manual edition, and it is where the six
    boundary-layer parameters enter the unsteady vocabulary:
    displacement, momentum and total thickness, shape factor, skin
    friction and the transition marker. CSYS is 1-based, index 1 being
    the reference frame; the coordinates are inline here, unlike the
    fluid plot's preformatted VERTEX line.
