# Unsteady Solver chapter (SRC-003 pp.347-348): per-time-step
# monitoring plots and their export. SET_SOLVER_UNSTEADY itself lives
# in solver_settings.yaml with the other solver mode selectors.

UNSTEADY_SOLVER_NEW_FORCE_PLOT:
  layout: keyword_block
  phase: setup
  args:
    - name: frame
      type: int
      cites: frames
    - name: units
      type: enum
      values: [COEFFICIENTS, NEWTONS, KILO-NEWTONS, POUND-FORCE, KILOGRAM-FORCE]
    - name: parameter
      type: enum
      values: [CL, CDI, CDO, CD, FORCE_X, FORCE_Y, FORCE_Z, MOMENT_X, MOMENT_Y, MOMENT_Z]
    - name: name
      type: str
    - name: boundaries
      type: int
    - name: boundary_indices
      type: int_list
      cites: boundaries
      required: false
  manual_ref: "SRC-003 p.347"
  versions:
    "26.120": {status: documented}
  notes: >
    Samples one force or moment parameter per solver time step, in
    FRAME and UNITS, over the listed boundaries. BOUNDARIES -1 selects
    every boundary and takes no index line; a positive count is
    followed by the comma-separated boundary indices on the next line.
    Plots must exist before the solver runs to record its steps.

UNSTEADY_SOLVER_NEW_FLUID_PLOT:
  layout: keyword_block
  phase: setup
  args:
    - name: frame
      type: int
      cites: frames
    - name: parameter
      type: enum
      values: [CP_FREE, CP_REF, MACH, VELOCITY, VX, VY, VZ, STATIC_PRESSURE_RATIO]
    - name: name
      type: str
    - name: vertex
      type: str
  manual_ref: "SRC-003 p.347"
  versions:
    "26.120": {status: documented}
    "26.121":
      status: documented
      note: >
        SRC-740 p.350 extends PARAMETER with the six boundary-layer
        values, so the 26.121 grammar differs from the 26.120 one in
        its enum alone; the args override below carries it.
      args:
        - name: frame
          type: int
          cites: frames
        - name: parameter
          type: enum
          values: [CP_FREE, CP_REF, MACH, VELOCITY, VX, VY, VZ, STATIC_PRESSURE_RATIO,
                   BL_MOMENTUM_THICKNESS, BL_DISPLACEMENT_THICKNESS, BL_TOTAL_THICKNESS,
                   BL_SHAPE_FACTOR, BL_SKIN_FRICTION, BL_TRANSITION_MARKER]
        - name: name
          type: str
        - name: vertex
          type: str
  notes: >
    Samples one fluid property per solver time step at a fixed vertex.
    VERTEX takes the three coordinates preformatted on one line
    (X, then Y, then Z). The manual documents FRAME as the system the
    plot's VALUES are computed in and says nothing about which frame
    the vertex is read in (SRC-003 p.347), so this entry does not say
    either; the 26.121 surface probe states it and this command does
    not. The typed triple validation
    lives in the caller, the same preformatted-token convention as the
    per-surface lines of INITIALIZE_SOLVER.

UNSTEADY_SOLVER_DELETE_ALL_PLOTS:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.347"
  versions:
    "26.120": {status: documented}
  notes: >
    Removes every unsteady solver plot, force and fluid alike, in one
    call; there is no documented per-plot delete. Found missing from
    this chapter while diffing the 26.121 manual against the database
    (PFS-8): it is documented in the 26.12 manual too, so its absence
    was a gap in the original ingestion rather than a version change.

UNSTEADY_SOLVER_EXPORT_PLOTS:
  layout: param_lines
  phase: export
  args:
    - name: filename
      type: path
  manual_ref: "SRC-003 p.347"
  versions:
    "26.120": {status: documented}
  notes: >
    Exports every unsteady solver plot (force and fluid) with one
    column per plot and one row per time step.

NEW_UNSTEADY_SOLVER_SURFACE_PROBE:
  layout: inline
  phase: setup
  args:
    - name: name
      type: str
    - name: parameter
      type: enum
      values: [CP_FREE, CP_REF, MACH, VELOCITY, VX, VY, VZ, STATIC_PRESSURE_RATIO,
               BL_MOMENTUM_THICKNESS, BL_DISPLACEMENT_THICKNESS, BL_TOTAL_THICKNESS,
               BL_SHAPE_FACTOR, BL_SKIN_FRICTION, BL_TRANSITION_MARKER]
    - name: csys
      type: int
    - name: x
      type: float
      unit: length units of the named coordinate system
    - name: y
      type: float
      unit: length units of the named coordinate system
    - name: z
      type: float
      unit: length units of the named coordinate system
  manual_ref: "SRC-740 p.350"
  versions:
    "26.121": {status: documented}
  notes: >
    Samples one surface property per solver time step at a fixed
    vertex, the surface counterpart of UNSTEADY_SOLVER_NEW_FLUID_PLOT.
    New in the 26.121 manual edition, and it is where the six
    boundary-layer parameters enter the unsteady vocabulary:
    displacement, momentum and total thickness, shape factor, skin
    friction and the transition marker. CSYS is 1-based, index 1 being
    the reference frame; the coordinates are inline here, unlike the
    fluid plot's preformatted VERTEX line.

UNSTEADY_SOLVER_ANIMATION:
  layout: keyword_block
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
      on_command_line: true
    - name: folder
      type: path
      required: false
    - name: filetype
      type: enum
      values: [SOLVER_BITMAP, PLOTS_BITMAP, TECPLOT_DATA, PARAVIEW_VTK]
      required: false
    - name: frequency
      type: int
      required: false
    - name: volume_sections
      type: enum
      values: [ENABLE, DISABLE]
      required: false
    - name: volume_sections_format
      type: enum
      values: [VTK, DAT, VTK2D]
      required: false
      joins_previous: true
  manual_ref: "SRC-003 pp.347-348"
  versions:
    "26.100": {status: documented, note: "SRC-741 pp.343-344, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 pp.346-347, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 pp.351-352, same grammar as 26.120"}
  notes: >
    Writes an output file every so many time steps of an unsteady run,
    which is how an animation is produced.

    THE MODE SITS ON THE COMMAND LINE AND EVERYTHING ELSE IS A KEYWORD
    LINE, the second command in the database to need `on_command_line`
    after WRAPPER_EDIT_LOCAL_CONTROL. Every keyword is optional because
    the manual prints TWO samples: the enabling one carries four keyword
    lines and the disabling one is a single line with none.

    VOLUME_SECTIONS TAKES TWO VALUES ON ONE LINE, a toggle and a format,
    which is why the format joins the previous line rather than taking
    its own keyword. The manual states the pair in one parameter row.

    FREQUENCY IS IN SOLVER TIME STEPS AND NOT IN SECONDS: 1 writes every
    step, 2 every second step. Combined with PARAVIEW_VTK on a long run
    this is the fastest way in the package to fill a disk, and no
    edition says so.
