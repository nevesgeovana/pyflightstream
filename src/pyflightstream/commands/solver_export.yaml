EXPORT_BL_VELOCITY_PROFILE:
  layout: inline
  phase: export
  args:
    - name: frame
      type: int
      cites: frames
    - name: x
      type: float
    - name: y
      type: float
    - name: z
      type: float
    - name: filename
      type: path
      own_line: true
  manual_ref: "SRC-750 p.377"
  notes: >
    Exports the boundary-layer velocity profile through the wall at
    one point, given in the named coordinate system, with the file
    path on the line after the command. First documented by the
    26.122 edition.

    The page gives no units for X, Y and Z and no length unit
    appears in the call, so they are the coordinate system's own,
    which for the reference frame is the simulation length units.
    Recorded as unitless floats rather than given a unit the manual
    does not state.

    IT IS INTERACTIVE AND CANNOT BE USED IN AN UNATTENDED RUN, measured
    on 26.122 on 2026-08-17 and recorded in
    reports/RPT-027_boundary-layer-across-a-proximity-gap_2026-08-17.md.
    The command opens a modal window carrying a plot of velocity against
    height above the surface and a Done button, and script processing
    STOPS there until a person dismisses it. Under -hidden, with both
    streams redirected. A batch run reaching it waits forever, and the
    wait is indistinguishable from a hang unless somebody is at the
    machine.

    No status is written from that. It is a fact about the interface
    rather than a refusal by the solver, which is a different claim from
    the one `broken` makes, and a status rests on a committed probe
    report rather than on a hand run (invariant 3). What it does mean is
    that a measurement wanting the boundary layer needs another
    instrument, and RPT-027 used the integrated viscous drag instead.
  versions:
    "26.122":
      status: documented
      note: "SRC-750 p.377, the first edition to document it"
    "26.123": {status: documented, note: "SRC-751 p.377, unchanged from SRC-750 p.377"}

DELETE_BL_VELOCITY_PROFILE:
  layout: bare
  phase: export
  args: []
  manual_ref: "SRC-750 p.377"
  notes: >
    Discards the boundary-layer velocity profile. The page states it
    takes no parameters, so it clears whatever
    EXPORT_BL_VELOCITY_PROFILE last produced rather than addressing
    one profile of several. First documented by the 26.122 edition.
  versions:
    "26.122":
      status: documented
      note: "SRC-750 p.377, the first edition to document it"
    "26.123": {status: documented, note: "SRC-751 p.377, unchanged from SRC-750 p.377"}
