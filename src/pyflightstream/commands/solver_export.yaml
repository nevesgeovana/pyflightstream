SET_VTK_EXPORT_VARIABLES:
  layout: payload_lines
  phase: export
  args:
    - name: num_variables
      type: int
    - name: export_wake
      type: enum
      values: [ENABLE, DISABLE]
    - name: variables
      type: enum_list
      separator: newline
      required: false
      values: [X, Y, Z, CF, CP, CP_REFERENCE, CP_FREESTREAM, MACH,
               VX, VY, VZ, VTOT, PSTATIC, BLMOM, BLDISP, BLTHICK,
               SHAPEFACTOR, TRANS, SEP, BLLENGTH, AREA, VORTICITY]
  manual_ref: "SRC-003 p.352"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.313, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.326, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.325, same grammar as 26.120"}
    "26.121": {status: documented, note: "SRC-740 p.355, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.348, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.351, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.123": {status: documented, note: "SRC-751 p.358, unchanged from SRC-750 p.358"}
  notes: >
    NUM_VARIABLES takes -1 for all variables; otherwise one variable
    name follows per line. The CP argument is flagged for depreciation
    in favor of CP_REFERENCE and CP_FREESTREAM (SRC-003 p.352); the
    emitter warns when CP is requested.

