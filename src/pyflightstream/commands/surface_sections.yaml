# Chapter: Scripting reference, Post Processing, Surface Sections
# (FSM-26.120 pp.364-365).

CREATE_NEW_SURFACE_SECTION:
  layout: payload_lines
  phase: analysis
  args:
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: offset
      type: float
    - name: plot_direction
      type: enum
      values: ["1", "2"]
    - name: symmetry
      type: enum
      values: [ENABLE, DISABLE]
    - name: surfaces
      cites: null
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
      separator: space
      required: false
  manual_ref: "FSM-26.120 p.364"
  versions:
    "25.000": {status: documented, note: "FSM-25.000 p.323, same grammar as 26.120"}
    "25.100": {status: documented, note: "FSM-25.100 p.336, same grammar as 26.120"}
    "26.000": {status: documented, note: "FSM-26.000 p.335, same grammar as 26.120"}
    "26.101": {status: documented, note: "FSM-26.101 p.363, same grammar as 26.120"}
    "26.100": {status: documented, note: "FSM-26.100 p.358, same grammar as 26.120"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "FSM-26.123 p.370, unchanged from FSM-26.122 p.370"}
    "26.124": {status: verified, report: "reports/compat/CMP-26124_2026-09-14_full-sim.yaml", note: "FSM-26.124 p.370, the FSM-26.123 file, carried from 26.123"}
    "26.125": {status: verified, report: "reports/compat/CMP-26125_2026-10-05_probe-campaign.yaml", note: "FSM-26.125 p.376, unchanged from FSM-26.124 p.370"}
  notes: >
    SURFACES takes -1 for all boundaries; otherwise the space-separated
    surface indices follow on the next line.

NEW_SURFACE_SECTION_DISTRIBUTION:
  layout: keyword_block
  phase: init
  args:
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: num_sections
      cites: null
      type: int
    - name: plot_direction
      type: enum
      values: ["1", "2"]
    - name: include_symmetry
      type: enum
      values: [ENABLE, DISABLE]
      required: false
    - name: surfaces
      cites: null
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
      separator: space
      required: false
  manual_ref: "FSM-26.120 p.364"
  versions:
    "25.000":
      status: documented
      note: "FSM-25.000 p.323, this edition's own grammar; see the note below"
      args:
        - name: frame
          cites: frames
          type: int
        - name: plane
          type: enum
          values: ["XY", "XZ", "YZ"]
        - name: num_sections
          cites: null
          type: int
        - name: plot_direction
          type: enum
          values: ["1", "2"]
        - name: surfaces
          cites: null
          type: int
        - name: surface_indices
          cites: boundaries
          type: int_list
          required: false
    "25.100":
      status: documented
      note: "FSM-25.100 p.336, this edition's own grammar; see the note below"
      args:
        - name: frame
          cites: frames
          type: int
        - name: plane
          type: enum
          values: ["XY", "XZ", "YZ"]
        - name: num_sections
          cites: null
          type: int
        - name: plot_direction
          type: enum
          values: ["1", "2"]
        - name: surfaces
          cites: null
          type: int
        - name: surface_indices
          cites: boundaries
          type: int_list
          required: false
    "26.000":
      status: documented
      note: "FSM-26.000 p.335, this edition's own grammar; see the note below"
      args:
        - name: frame
          cites: frames
          type: int
        - name: plane
          type: enum
          values: ["XY", "XZ", "YZ"]
        - name: num_sections
          cites: null
          type: int
        - name: plot_direction
          type: enum
          values: ["1", "2"]
        - name: surfaces
          cites: null
          type: int
        - name: surface_indices
          cites: boundaries
          type: int_list
          required: false
    "26.100":
      status: documented
      note: >-
        FSM-26.100 p.358. SIX keywords, not seven: this edition's parameter
        table and sample both pass straight from PLOT_DIRECTION to
        SURFACES, with no INCLUDE_SYMMETRY anywhere in the entry.
      args:
        - {name: frame, type: int, cites: frames}
        - {name: plane, type: enum, values: [XY, XZ, YZ]}
        - {name: num_sections, type: int, cites: null}
        - {name: plot_direction, type: enum, values: ["1", "2"]}
        - {name: surfaces, type: int, cites: null}
        - {name: surface_indices, type: int_list, cites: boundaries,
           separator: space, required: false}
    "26.101":
      status: documented
      note: >-
        FSM-26.101 p.363, the same six keywords as 26.100 and no
        INCLUDE_SYMMETRY.
      args:
        - {name: frame, type: int, cites: frames}
        - {name: plane, type: enum, values: [XY, XZ, YZ]}
        - {name: num_sections, type: int, cites: null}
        - {name: plot_direction, type: enum, values: ["1", "2"]}
        - {name: surfaces, type: int, cites: null}
        - {name: surface_indices, type: int_list, cites: boundaries,
           separator: space, required: false}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "FSM-26.123 p.370, unchanged from FSM-26.122 p.370"}
    "26.124": {status: verified, report: "reports/compat/CMP-26124_2026-09-14_full-sim.yaml", note: "FSM-26.124 p.370, the FSM-26.123 file, carried from 26.123"}
    "26.125": {status: verified, report: "reports/compat/CMP-26125_2026-10-05_probe-campaign.yaml", note: "FSM-26.125 p.376, unchanged from FSM-26.124 p.370"}
  notes: >
    Creates NUM_SECTIONS sections at once; the surface indices follow
    the SURFACES line.

    The February and May editions specify six keywords; the default
    grammar has seven. INCLUDE_SYMMETRY is evidenced on 26.120 by a
    working script and CMP-26120_2026-07-23_pln012, although FSM-26.120
    p.364 omits it; FSM-26.121 documents it. The licensed probe verifies
    the command and its effect with optional INCLUDE_SYMMETRY in phase
    init. The manual-only grammar in the post-solve probe aborts.
    Phase init also rests on the 2026-07-21 case-reproduction evidence:
    cut planes freeze at creation against the geometry's current pose,
    so distributions over moving boundaries must precede motion.

