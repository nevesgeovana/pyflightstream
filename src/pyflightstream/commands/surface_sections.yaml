EXPORT_SURFACE_SECTIONS:
  layout: mixed_inline
  phase: export
  args:
    - name: index
      cites: null
      type: int
    - name: filename
      type: path
      own_line: true
  manual_ref: "FSM-26.120 p.365"
  versions:
    "26.121": {status: documented, note: "FSM-26.121 p.368, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.123": {status: documented, note: "FSM-26.123 p.371, unchanged from FSM-26.122 p.371"}
    "26.124": {status: documented, note: "FSM-26.124 p.371, the FSM-26.123 file, carried from 26.123; not run on 26.124"}
    "26.125": {status: documented, note: "FSM-26.125 p.377; the previous probe consumed its END sentinel as the filename, so it does not verify this grammar. See RPT-036b finding 1."}
  notes: >
    Exports one surface section by index (index greater than 0), with a
    filename on the following line. FSM-26.120 p.365 names the command;
    GEO-106-PYFLIGHTSTREAM-INTERNAL-REPORTS/reports/RPT-036b_the-owed-export-capture_2026-08-20.md, finding 1,
    records the following line being consumed as its filename. The corrected
    script has not been verified by a new licensed run. Added at 26.12; the
    26.1 manual documents only the all-sections export, so a 26.1
    script exports everything through EXPORT_ALL_SURFACE_SECTIONS and
    filters afterwards (FSM-26.101 p.364).

