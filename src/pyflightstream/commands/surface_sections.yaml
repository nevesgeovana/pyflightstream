# Chapter: Scripting reference, Post Processing, Surface Sections
# (SRC-003 pp.364-365).

CREATE_NEW_SURFACE_SECTION:
  layout: payload_lines
  phase: analysis
  args:
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: offset
      type: float
    - name: plot_direction
      type: enum
      values: ["1", "2"]
    - name: symmetry
      type: enum
      values: [ENABLE, DISABLE]
    - name: surfaces
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
      separator: space
      required: false
  manual_ref: "SRC-003 p.364"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.323, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.336, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.335, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.363, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.358, same grammar as 26.120"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
  notes: >
    SURFACES takes -1 for all boundaries; otherwise the space-separated
    surface indices follow on the next line.

NEW_SURFACE_SECTION_DISTRIBUTION:
  layout: keyword_block
  phase: init
  args:
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: num_sections
      type: int
    - name: plot_direction
      type: enum
      values: ["1", "2"]
    - name: include_symmetry
      type: enum
      values: [ENABLE, DISABLE]
      required: false
    - name: surfaces
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
      separator: space
      required: false
  manual_ref: "SRC-003 p.364"
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.323, this edition's own grammar; see the note below"
      args:
        - name: frame
          type: int
        - name: plane
          type: enum
          values: ["XY", "XZ", "YZ"]
        - name: num_sections
          type: int
        - name: plot_direction
          type: enum
          values: ["1", "2"]
        - name: surfaces
          type: int
        - name: surface_indices
          type: int_list
          required: false
    "25.100":
      status: documented
      note: "SRC-748 p.336, this edition's own grammar; see the note below"
      args:
        - name: frame
          type: int
        - name: plane
          type: enum
          values: ["XY", "XZ", "YZ"]
        - name: num_sections
          type: int
        - name: plot_direction
          type: enum
          values: ["1", "2"]
        - name: surfaces
          type: int
        - name: surface_indices
          type: int_list
          required: false
    "26.000":
      status: documented
      note: "SRC-747 p.335, this edition's own grammar; see the note below"
      args:
        - name: frame
          type: int
        - name: plane
          type: enum
          values: ["XY", "XZ", "YZ"]
        - name: num_sections
          type: int
        - name: plot_direction
          type: enum
          values: ["1", "2"]
        - name: surfaces
          type: int
        - name: surface_indices
          type: int_list
          required: false
    "26.100":
      status: documented
      note: >-
        SRC-741 p.358. SIX keywords, not seven: this edition's parameter
        table and sample both pass straight from PLOT_DIRECTION to
        SURFACES, with no INCLUDE_SYMMETRY anywhere in the entry.
      args:
        - {name: frame, type: int, cites: frames}
        - {name: plane, type: enum, values: [XY, XZ, YZ]}
        - {name: num_sections, type: int}
        - {name: plot_direction, type: enum, values: ["1", "2"]}
        - {name: surfaces, type: int}
        - {name: surface_indices, type: int_list, cites: boundaries,
           separator: space, required: false}
    "26.101":
      status: documented
      note: >-
        SRC-725 p.363, the same six keywords as 26.100 and no
        INCLUDE_SYMMETRY.
      args:
        - {name: frame, type: int, cites: frames}
        - {name: plane, type: enum, values: [XY, XZ, YZ]}
        - {name: num_sections, type: int}
        - {name: plot_direction, type: enum, values: ["1", "2"]}
        - {name: surfaces, type: int}
        - {name: surface_indices, type: int_list, cites: boundaries,
           separator: space, required: false}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
  notes: >
    Creates NUM_SECTIONS sections at once; the surface indices follow
    the SURFACES line.

    THE TWO OLDER EDITIONS TAKE SIX KEYWORDS AND THIS ENTRY'S DEFAULT
    GRAMMAR HAS SEVEN. INCLUDE_SYMMETRY reached this database from a
    working 26.120 SCRIPT rather than from any manual, and the first
    edition to document it is 26.121. So the February and May rows
    declare their own six-keyword grammar; copying the default one would
    have told a caller on those builds that a keyword no evidence places
    there is available (read on the pages, 2026-08-08). The manual grammar (SRC-003 p.364) aborted the
    original Tier 2 probe on 26.120, while a working 26.120 script
    additionally carries an INCLUDE_SYMMETRY keyword the manual does
    not list. The 2026-07-23 licensed re-probe
    (CMP-26120_2026-07-23_pln012) decided it: with the corrected phase
    (init) and the extended grammar (optional INCLUDE_SYMMETRY), the
    command runs and its effect is observed, so it is now verified.
    Phase init on empirical evidence (2026-07-21 case-reproduction
    run): the cut planes freeze at creation against the current
    geometry pose, so distributions over moving boundaries must be
    created before the motion runs; the working reproduction script
    creates them pre-solve, and the original aborting probe ran the
    command post-solve, which was the abort cause the re-probe fixed.

