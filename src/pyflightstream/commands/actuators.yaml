  manual_ref: "SRC-003 pp.323-324"
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.281, this edition's own grammar; see the note below"
      args:
        - name: actuator_index
          type: int
        - name: units_type
          type: enum
          values: ["NEWTONS", "KILO-NEWTONS", "POUND-FORCE", "KILOGRAM-FORCE"]
        - name: file_name
          type: path
          own_line: true
