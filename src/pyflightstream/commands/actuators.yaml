# Chapter: Scripting reference, Actuators (SRC-003 pp.323-324).
# Actuator discs are the linearized propeller slipstream surrogate
# (SRC-003 pp.185-187); they are defined before solver initialization.

CREATE_NEW_ACTUATOR:
  layout: inline
  phase: setup
  args:
    - name: type
      type: enum
      values: [PROPELLER]
    - name: subtype
      type: enum
      values: [CUSTOM, ELLIPTICAL]
      required: false
    - name: name
      type: str
  manual_ref: "SRC-003 p.323"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.280, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.297, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.296, same grammar as 26.120"}
    "26.100": {status: verified, report: "reports/compat/CMP-26100_2026-08-08_enableactuator.yaml"}
    "26.101": {status: documented, note: "SRC-725 p.322, same grammar as 26.120"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "SRC-751 p.327, unchanged from SRC-750 p.327"}
  notes: >
    SUBTYPE selects the thrust profile model and applies only to the
    PROPELLER type. CUSTOM imports a radial force distribution;
    ELLIPTICAL is specified by net thrust and RPM (SRC-003 p.185).

