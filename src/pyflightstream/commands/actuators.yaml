ENABLE_ACTUATOR:
  layout: inline
  phase: setup
  args:
    - name: actuator_index
      type: int
      cites: actuators
  manual_ref: "SRC-003 p.324"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.281, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.298, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.297, same grammar as 26.120"}
    "26.121": {status: documented, note: "SRC-740 p.327, same grammar as 26.120"}
    "26.100":
      status: documented
      note: >-
        SRC-741 p.319 prints the heading with NO placeholder and a
        parameter table reading N/A, while its own sample passes an
        index. The one-argument form is recorded and was MEASURED on
        this build: reports/compat/CMP-26100_2026-08-08_enableactuator
        records the solver accepting it without abort or logged error.
    "26.101": {status: documented, note: "SRC-725 p.323, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.123": {status: documented, note: "SRC-751 p.328, unchanged from SRC-750 p.328"}
  notes: >
    FEBRUARY 2026 IS THE ONE EDITION WHOSE HEADING AND SAMPLE DISAGREE
    ABOUT WHETHER THIS COMMAND TAKES AN ARGUMENT. SRC-741 p.319 prints
    the bare name and a parameter table of N/A, and the sample beneath
    it passes an actuator index. Every later edition documents
    ACTUATOR_INDEX in the heading and the table.

    The one-argument form is recorded for that build too, and this is
    not a reading of the page: a probe on 2026-08-08 emitted it against
    the February solver and the script ran past it with no abort and no
    logged error. The status stays documented rather than verified
    because the enable flag is stored in binary form and no instrument
    observes it, so what is measured is that the ARGUMENT is accepted,
    not that the actuator was enabled.

    Recording zero arguments would have refused the only runnable line
    the edition prints, which is the defect class this database keeps
    finding, and would have made a call that works on three builds
    refused on the fourth on the strength of a table reading N/A. The
    neighbouring DISABLE_ACTUATOR carries the same N/A on the same
    page, so it is the page's habit rather than a statement about this
    command.

