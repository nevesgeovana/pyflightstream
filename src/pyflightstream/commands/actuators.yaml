DISABLE_ACTUATOR:
  layout: inline
  phase: setup
  args:
    - name: actuator_index
      type: int
      cites: actuators
  manual_ref: "SRC-741 p.319"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.282, same grammar as 26.100"}
    "25.100": {status: documented, note: "SRC-748 p.298, same grammar as 26.100"}
    "26.000": {status: documented, note: "SRC-747 p.297, same grammar as 26.100"}
    "26.100": {status: documented}
  notes: >
    Disables an actuator disc without deleting it, the counterpart of
    ENABLE_ACTUATOR.

    DOCUMENTED BY THE FEBRUARY 2026 EDITION ALONE. No later edition
    prints it anywhere, which is why the entry carries one version row
    and cites SRC-741 rather than the flagship. It is the mirror image
    of SET_WAKE_DECAY_CONSTANT, which exists in the newest edition only.

    Its page prints the heading with NO placeholder and a parameter
    table reading N/A, while the sample two lines below passes an
    actuator index. That is the same contradiction the neighbouring
    ENABLE_ACTUATOR carries on the same page, and it is read the same
    way: the one-argument form is recorded, because recording zero would
    refuse the only runnable line the edition prints. Unlike
    ENABLE_ACTUATOR this one has NOT been measured against the solver,
    so the reading rests on the page and on its neighbour's probe.

SET_ACTUATOR_WAKE_TYPE:
  layout: inline
  phase: setup
  args:
    - name: actuator_index
      type: int
      cites: actuators
    - name: type
      type: enum
      values: [RIGID, RELAXED]
  manual_ref: "SRC-750 p.328"
  notes: >
    Chooses whether a propeller actuator's wake holds its prescribed
    shape or relaxes onto the local flow. First documented by the
    26.122 edition.

    The page states the actuator must be of the propeller type.
    Nothing here can check that: the actuator type is set by another
    command and the database records grammar, so passing the index
    of an actuator of another type is a refusal the solver makes and
    this emitter does not.
  versions:
    "26.122":
      status: documented
      note: "SRC-750 p.328, the first edition to document it"
    "26.123": {status: documented, note: "SRC-751 p.328, unchanged from SRC-750 p.328"}
