# Chapter: Mesh Import / Export (SRC-003 pp.307-308).

IMPORT:
  layout: keyword_block
  phase: geometry
  args:
    - name: units
      type: enum
      values: [INCH, MILLIMETER, OTHER, FEET, MILE, METER, KILOMETER, MILS, MICRON, CENTIMETER, MICROINCH]
    - name: file_type
      type: enum
      values: [STL, TRI, P3D, INP, STRUCTURED_QUAD, UNSTRUCTURED_QUAD, LAWGS, VTK, AC, FAC, OBJ]
    - name: file
      type: path
    - name: clear
      type: bool
      required: false
  manual_ref: "SRC-003 p.307"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.261, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.281, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.280, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.302, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.306, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.310, same grammar as 26.120"}
  notes: >
    Imports a surface mesh into the simulation as a KEY VALUE block:
    length units of the mesh file, one of eleven mesh formats, and the
    file path. The optional bare CLEAR keyword deletes every existing
    geometry boundary before the import (SRC-003 p.307).

CCS_IMPORT:
  layout: keyword_block
  phase: geometry
  args:
    - name: close_component_ends
      type: enum
      values: [ENABLE, DISABLE]
    - name: update_properties
      type: enum
      values: [ENABLE, DISABLE]
    - name: clear_existing
      type: enum
      values: [ENABLE, DISABLE]
    - name: file
      type: path
  manual_ref: "SRC-003 p.307"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.262, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.281, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.280, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.302, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.306, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.310, same grammar as 26.120"}
  notes: >
    Imports a Component Cross-Section (CCS) geometry file. The toggles
    control hole-filling at component ends, whether the simulation
    properties stored in the file are applied, and whether existing
    geometry boundaries are deleted first (SRC-003 p.307).

EXPORT_SURFACE_MESH:
  layout: inline
  phase: geometry
  args:
    - name: file_type
      type: enum
      values: [STL, TRI, OBJ]
    - name: surface
      type: int
      cites: boundaries
      all_sentinel: -1
    - name: file
      type: path
      own_line: true
  manual_ref: "SRC-003 pp.307-308"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.262, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.281, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.280, same grammar as 26.120"}
    "26.121": {status: documented, note: "SRC-740 p.310, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.302, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 pp.306-307, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Exports one geometry surface (first surface is index 1) or all
    surfaces (-1) to STL, TRI, or OBJ; the destination path follows on
    the next line (SRC-003 pp.307-308).

DELETE_SURFACES:
  layout: inline
  phase: geometry
  args:
    - name: index
      type: int
      cites: boundaries
      all_sentinel: -1
  manual_ref: "SRC-740 pp.315-316"
  versions:
    "26.121": {status: documented}
  notes: >
    Deletes a mesh surface by 1-based index. The parameter table states
    no all-form; the sample passing -1 for every surface is on the
    FOLLOWING page (SRC-740 p.316), which is why the sentinel cites that
    page and not the heading's. New in the 26.121 manual edition, where
    it replaces the SURFACE_DELETE keyword block and SURFACE_CLEARALL
    of SRC-003 pp.312-313. Both of those are registered here since
    2026-08-07, in mesh_operations.yaml, each carrying version rows for
    the three editions that document it and none after; no removal is
    recorded against either, because a removal in this database is a
    manual STATING one and no edition states it.
    ARITY NOT DETERMINABLE FROM THE PAGE, and deliberately registered
    narrow: the parameter table declares one INDEX, while one sample
    passes three bare integers under a multiple-surface heading. Those
    two readings delete different surfaces, so the single-index form is
    registered and the multi-index form awaits a probe (RPT-014).
