SET_VORTICITY_LIFT_MODEL:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.350"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.312, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.324, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.323, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.346, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.349, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.353, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.356, unchanged from SRC-750 p.356"}
    "26.124": {status: documented, note: "SRC-752 p.356, the SRC-751 file, carried from 26.123; not run on 26.124"}
  notes: >
    Computes lift from the vorticity field rather than by integrating
    surface pressure.

    IT IS THE LIFT COUNTERPART OF A DECISION THIS PACKAGE ALREADY
    MODELS FOR DRAG. SET_VORTICITY_DRAG_BOUNDARIES selects the
    boundaries whose induced drag is computed from vorticity, and
    solver_settings records that choice in its snapshot. This is the
    same physical choice applied to lift, and it is NOT in the snapshot:
    it lives in the solver_analysis chapter, which is not a settings
    family, so no flag covers it. Recorded here so the asymmetry is
    visible rather than discovered.

    Compare KUTTA_JOUKOWSKI_LIFT_FORCES, which is a third route to the
    same quantity. No edition says what happens if both are enabled.
