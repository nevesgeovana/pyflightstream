# Chapter: Scripting reference, Solver Analysis (SRC-003 pp.350-351).

SET_VORTICITY_DRAG_BOUNDARIES:
  layout: payload_lines
  phase: analysis
  args:
    - name: num_boundaries
      type: int
    - name: boundary_indices
      type: int_list
      cites: boundaries
      required: false
  manual_ref: "SRC-003 p.350"
  # PFS-2006.01: no boundary on the list, the command never emitted; the
  # solver-setup snapshot reads both fields rather than restating them.
  default: []
  default_ref: "SRC-003 p.202"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.311, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.324, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.323, same grammar as 26.120"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_savedstate2.yaml"}
    "26.100": {status: documented, note: "SRC-741 p.346, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.349, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "SRC-751 p.356, unchanged from SRC-750 p.356"}
    "26.124": {status: verified, report: "reports/compat/CMP-26124_2026-09-14_full-sim.yaml", note: "SRC-752 p.356, the SRC-751 file, carried from 26.123"}
  notes: >
    Boundaries whose induced drag is computed from surface vorticity
    circulation integration; -1 selects all boundaries. Boundaries
    without trailing-edge boundary conditions on this list report zero
    induced drag (SRC-003 p.202);
    bluff bodies belong to surface-pressure integration instead. The
    results layer reports the solver's per-surface and total rows as
    printed, and every group sum the post makes writes NA for a boundary
    on this list whose printed induced drag is exactly zero
    (PFS-2006.03). Boundaries left off the list, including every boundary
    when the command is never emitted, use that surface-pressure
    integration, which the manual also prescribes for all components
    in ground effect (SRC-003 p.202): not emitting this command is a
    valid drag setup, not a missing one.

