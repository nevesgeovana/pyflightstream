# Chapter: Scripting reference, Plots (SRC-003 p.361).
#
# COMPLETE as of 2026-08-08, entered from all four registered editions in
# one pass. Both signatures identical across the four.
#
# The application's plot pane shows one plot at a time. SET_PLOT_TYPE
# chooses which, and SAVE_PLOT_TO_FILE writes whichever is showing, so
# the two are ordered in use even though nothing enforces it: saving
# without selecting writes whatever was last displayed.
#
# Both are phase EXPORT since 2026-09-24, on measured evidence (RPT-067,
# 26.124): the run placed them after every export of a solved steady
# point and before EXPORT_LOG, and the solve and its exports were
# unchanged. The workflows save a steady point's plots in that position.

SET_PLOT_TYPE:
  layout: inline
  phase: export
  args:
    - name: plot_type
      type: enum
      values:
        - CL_AXIS_X
        - CL_AXIS_Y
        - CL_AXIS_Z
        - CDI_AXIS_X
        - CDI_AXIS_Y
        - CDI_AXIS_Z
        - CY_AXIS_X
        - CY_AXIS_Y
        - CY_AXIS_Z
        - FORCE_X_AXIS_X
        - FORCE_X_AXIS_Y
        - FORCE_X_AXIS_Z
        - FORCE_Y_AXIS_X
        - FORCE_Y_AXIS_Y
        - FORCE_Y_AXIS_Z
        - FORCE_Z_AXIS_X
        - FORCE_Z_AXIS_Y
        - FORCE_Z_AXIS_Z
        - RESIDUALS
        - LOADS
        - SECTIONS_CP
        - SECTIONS_MACH
        - UNSTEADY
  manual_ref: "SRC-003 p.361"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.320, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.333, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.332, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.355, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.360, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.364, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.367, unchanged from SRC-750 p.367"}
    "26.124": {status: verified, report: "reports/compat/CMP-26124_2026-09-24_plots.yaml", note: "SRC-752 p.367, the SRC-751 file, carried from 26.123"}
  notes: >
    Selects which plot the pane shows.

    THE MANUAL PRINTS THE VALUES AS PARAMETER ROWS RATHER THAN AS A
    CLOSED SET, one row per token with N/A in the value column, so this
    reads at a glance as a command with 23 parameters. It has one
    argument taking one of 23 tokens, which is what the sample passing a
    single token shows.

    Twenty-three, not twenty-four: RESIDUALS is printed TWICE in the
    list, in the four editions read then. A duplicate in a closed set is dropped
    rather than recorded, there being nothing a second identical token
    could mean.

    The eighteen AXIS tokens pair one of six coefficients with one of
    three axes, which is why CL_AXIS_X and CL_AXIS_Y are two plots of
    one coefficient rather than two coefficients.

    RUN ON 26.124 WITH THREE OF THE 23 (RPT-067, 2026-09-24): RESIDUALS,
    LOADS and SECTIONS_CP, each followed by SAVE_PLOT_TO_FILE after the
    exports of a solved steady point. The other twenty tokens were not
    run on any build.

SAVE_PLOT_TO_FILE:
  layout: inline
  phase: export
  args:
    - name: file
      type: path
      own_line: true
  manual_ref: "SRC-003 p.361"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.320, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.333, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.332, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.355, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.360, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.364, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.367, unchanged from SRC-750 p.367"}
    "26.124": {status: verified, report: "reports/compat/CMP-26124_2026-09-24_plots.yaml", note: "SRC-752 p.367, the SRC-751 file, carried from 26.123"}
  notes: >
    Writes the plot currently shown to a text file, the path on the next
    line. It takes no plot type, so which plot is written depends on the
    last SET_PLOT_TYPE, or on whatever the application was showing if
    the script never set one.

    WHAT THE FILE HOLDS, measured on 26.124 (RPT-067): the plotted SERIES
    as text, not an image. The run header the loads export prints, the
    column names, then one row per point of the plot (for RESIDUALS and
    LOADS, one per solver iteration; for SECTIONS_CP, one x/Cp column
    pair per section), then the units footer. The solver prints nothing
    when it saves. A PLOT IS A DISPLAY OF THE SOLVE AND NEVER A SOURCE OF
    A COEFFICIENT: the last plotted lift equalled the exported CL, the
    plotted induced drag was close to the exported CDi without equalling
    it, and the plotted pitching moment (-0.897) was not the exported CMy
    (-0.0247) at all. The run wrote to an absolute path; a save before a
    solve, and a path whose folder does not exist, were not tried.
