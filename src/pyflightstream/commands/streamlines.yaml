GENERATE_ALL_SURFACE_STREAMLINES:
  layout: bare
  phase: analysis
  args: []
  manual_ref: "SRC-003 p.370"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.336, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.343, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.342, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.365, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.369, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.373, same grammar as 26.120"}
  notes: >
    Generates the on-body streamlines, which are surface friction lines
    rather than paths through the fluid: they follow the direction of
    the wall shear stress and are what a reader looks at to find
    separation lines and attachment lines.

    IT TAKES NOTHING, and that is the whole difference from the off-body
    family. The solver decides the seeding from the geometry, so there
    is nothing to place, size or aim.

DELETE_ALL_SURFACE_STREAMLINES:
  layout: bare
  phase: analysis
  args: []
  manual_ref: "SRC-003 p.370"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.336, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.343, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.342, same grammar as 26.120"}
