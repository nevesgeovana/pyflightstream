# Chapter: Scripting reference, Post Processing, Off-body Streamlines
# (SRC-003 pp.368-369) and On-body Streamlines (p.370).
#
# COMPLETE as of 2026-08-08. The on-body family was deferred to the cases
# that would exercise it; that rule is gone with the v0.5.0 sweep, and
# the four entries that predate it get their two missing edition rows in
# the same pass.
#
# THE TWO FAMILIES ARE NOT PARALLEL AND THE DIFFERENCE IS PHYSICAL. An
# off-body streamline is seeded where the caller puts it, so the chapter
# has commands for placing seeds, sizing them and choosing which way they
# propagate. An on-body streamline is a surface friction line, whose
# seeding the solver decides from the geometry, so its whole family is
# three commands with no arguments between them: generate, delete,
# export.

NEW_OFF_BODY_STREAMLINE:
  layout: keyword_block
  phase: analysis
  args:
    - name: position_x
      type: float
    - name: position_y
      type: float
    - name: position_z
      type: float
    - name: upstream
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.368"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.334, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.341, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.340, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.363, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.367, same grammar as 26.120"}
    "26.120": {status: broken, report: "reports/compat/CMP-26120_2026-08-08_full.yaml", note: "script processing aborted at the command: the log exported before it exists, the one after it never appeared (END sentinel missing)"}
    "26.121": {status: broken, report: "reports/compat/CMP-26121_2026-08-08_full.yaml", note: "script processing aborted at the command: the log exported before it exists, the one after it never appeared (END sentinel missing)"}

