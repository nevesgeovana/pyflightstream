NEW_OFF_BODY_STREAMTUBE:
  layout: inline
  phase: analysis
  args:
    - name: frame_index
      type: int
      cites: frames
    - name: axis
      type: enum
      values: [X, Y, Z]
    - name: x
      type: float
      unit: "simulation length units"
    - name: y
      type: float
      unit: "simulation length units"
    - name: z
      type: float
      unit: "simulation length units"
    - name: radius
      type: float
      unit: "simulation length units"
    - name: radial_streamlines
      type: int
    - name: circular_streamlines
      type: int
  manual_ref: "FSM-26.120 p.368"
  versions:
    "26.000": {status: documented, note: "FSM-26.000 p.340, same grammar as 26.120"}
    "26.100": {status: documented, note: "FSM-26.100 p.363, same grammar as 26.120"}
    "26.101": {status: documented, note: "FSM-26.101 p.367, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "FSM-26.121 p.371, same grammar as 26.120"}
    "26.123": {status: documented, note: "FSM-26.123 p.374, unchanged from FSM-26.122 p.374"}
    "26.124": {status: broken, report: "reports/compat/CMP-26124_2026-10-12_gap-probes.yaml", note: "FSM-26.124 p.374, the FSM-26.123 file, carried from 26.123; probed 2026-10-12 (RPT-166) Probe: script processing aborted at the command: the log exported before it exists, the one after it never appeared (END sentinel missing) [...]"}
    "26.125": {status: broken, report: "reports/compat/CMP-26125_2026-10-12_gap-probes.yaml", note: "FSM-26.125 p.380, unchanged from FSM-26.124 p.374 Probe: script processing aborted at the command: the log exported before it exists, the one after it never appeared (END sentinel missing) [...]"}
  notes: >
    Seeds a cylindrical bundle of off-body streamlines in one call,
    which is how a propeller or rotor slipstream is visualised without
    placing seeds individually. The two counts multiply: the number of
    streamlines created is RADIAL_STREAMLINES times
    CIRCULAR_STREAMLINES, and no edition says so.

    The manual describes the origin as being relative to the specified
    AXIS, which is not a frame; read with the FRAME_INDEX argument
    beside it, the position is in that coordinate system and the axis
    says which way the tube points. Recorded as the reading the two
    arguments together support, since neither alone would place a tube.

    THE TWO 25 EDITIONS WRITE THIS COMMAND AS A KEYWORD BLOCK and carry
    no row here because of it. They print KEY VALUE lines until a
    terminator, where 26.000 onward prints the arguments inline. A
    version row can override the argument grammar and cannot override
    the layout, so a row for those editions would emit the newer shape
    under an older build's citation, which is worse than refusing to
    emit at all. The reading exists and is withheld deliberately; the
    schema gap is PLN-20260810-1200.

SET_OFF_BODY_STREAMLINE_LENGTH:
  layout: keyword_block
  phase: analysis
  args:
    - name: set_length
      type: float
      unit: "simulation length units"
      required: false
    - name: set_unrestricted_length
      type: bool
      required: false
  manual_ref: "FSM-26.120 p.368"
  versions:
    "25.000": {status: documented, note: "FSM-25.000 p.328, same grammar as 26.120"}
    "25.100": {status: documented, note: "FSM-25.100 p.341, same grammar as 26.120"}
    "26.000": {status: documented, note: "FSM-26.000 p.340, same grammar as 26.120"}
    "26.100": {status: documented, note: "FSM-26.100 p.363, same grammar as 26.120"}
    "26.101": {status: documented, note: "FSM-26.101 p.367, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "FSM-26.121 p.371, same grammar as 26.120"}
    "26.123": {status: documented, note: "FSM-26.123 p.374, unchanged from FSM-26.122 p.374"}
    "26.124": {status: removed, report: "reports/compat/CMP-26124_2026-10-12_gap-probes.yaml", note: "FSM-26.124 p.374 documents the command; MEASURED REMOVED 2026-10-12 by the registered probe P3-02 (RPT-166): both documented forms, SET_LENGTH and SET_UNRESTRICTED_LENGTH, were refused as an unrecognised command, so the edition documents a command the build does not carry"}
    "26.125": {status: removed, report: "reports/compat/CMP-26125_2026-10-12_gap-probes.yaml", note: "FSM-26.125 p.380 documents the command; MEASURED REMOVED 2026-10-12 by the registered probe P3-02 (RPT-166): both documented forms were refused as an unrecognised command, which 26.125 prints on its standard output only"}
  notes: >
    How far a newly created off-body streamline is propagated: to a
    stated length, or until it leaves the domain.

    THE TWO KEYWORDS ARE ALTERNATIVES AND THE MANUAL SAYS SO IN ITS
    HEADING, which is why both are optional here rather than one being
    required. SET_UNRESTRICTED_LENGTH is a bare presence keyword taking
    no value, so it is typed bool: passing True writes the keyword line
    and False writes nothing.

    Nothing refuses both at once. The manual states the alternation and
    does not say what the solver does when given both, so a refusal here
    would be this database inventing a rule; the caller passes one.

    THE PAGE'S ONLY SAMPLE LINE IS COMMENTED OUT, printing the keyword
    behind a hash so that the sample as written sets nothing. Recorded
    as the alternation the table states, not as the sample runs.

