EXPORT_ALL_SURFACE_STREAMLINES:
  layout: inline
  phase: analysis
  args:
    - name: file
      type: path
      own_line: true
  manual_ref: "SRC-003 p.370"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.365, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.369, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.373, same grammar as 26.120"}
  notes: >
    Writes every on-body streamline to one file, the path on the next
    line. The off-body counterpart is EXPORT_ALL_OFF_BODY_STREAMLINES,
    and the two write different things: friction lines here, fluid paths
    there.
