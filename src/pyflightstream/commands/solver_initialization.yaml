SOLVER_UNINITIALIZE:
  layout: bare
  phase: init
  args: []
  manual_ref: "FSM-25.000 p.298"
  notes: >
    Discards the solver initialization, returning the model to the state
    before INITIALIZE_SOLVER ran. Printed by the 25.000 edition and by
    no edition after it.

    IT WAS RENAMED RATHER THAN WITHDRAWN, and the reading is a
    measurement rather than an inference from the two names. Across the
    seven editions this command and REMOVE_INITIALIZATION are exactly
    complementary: this one is printed by 25.000 alone, that one by
    every edition from 25.100 on and by no earlier one. They share the
    bare layout, the init phase and the chapter. One capability, two
    spellings, with the changeover at 25.100.

    SOLVER_CLEAR is NOT the successor even though it leaves at the same
    edition, because it clears the SOLUTION rather than the
    initialization, and unlike this command nothing takes its place.
  versions:
    "25.000":
      status: documented
      note: "FSM-25.000 p.298, this edition documents it"
    "25.100":
      status: removed
      successor: REMOVE_INITIALIZATION
      note: >-
        FSM-25.100 pp.271-347, the whole scripting reference of the
        25.100 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.000":
      status: removed
      successor: REMOVE_INITIALIZATION
      note: >-
        FSM-26.000 pp.270-346, the whole scripting reference of the
        26.000 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.100":
      status: removed
      successor: REMOVE_INITIALIZATION
      note: >-
        FSM-26.100 pp.275-369, the whole scripting reference of the
        26.100 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.101":
      status: removed
      successor: REMOVE_INITIALIZATION
      note: >-
        FSM-26.101 pp.280-375, the whole scripting reference of the
        26.101 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.120":
