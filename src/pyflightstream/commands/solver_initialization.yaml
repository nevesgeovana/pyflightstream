      successor: REMOVE_INITIALIZATION
      note: >-
        FSM-26.120 pp.281-376, the whole scripting reference of the
        26.120 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
