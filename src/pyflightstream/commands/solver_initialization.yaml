CLEAR_SOLUTION:
  layout: bare
  phase: exec
  args: []
  manual_ref: "SRC-003 p.338"
  versions:
    "25.100": {status: documented, note: "SRC-748 p.313, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.312, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.337, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.335, same grammar as 26.120"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Clears the existing solution while keeping the initialization;
    used between sweep points when solution reuse is not wanted.
