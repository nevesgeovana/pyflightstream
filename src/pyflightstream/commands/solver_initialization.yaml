# Chapter: Scripting reference, Solver Initialization / Execution
# (SRC-003 pp.337-338).

INITIALIZE_SOLVER:
  layout: keyword_block
  phase: init
  args:
    - name: solver_model
      type: enum
      values: [INCOMPRESSIBLE, SUBSONIC_PRANDTL_GLAUERT,
               TRANSONIC_FIELD_PANEL, TANGENT_CONE, MODIFIED_NEWTONIAN]
    - name: surfaces
      type: int
    - name: surface_toggles
      type: str_list
      separator: newline
      required: false
    - name: wake_termination_x
      type: str
    - name: symmetry
      type: enum
      values: [NONE, MIRROR, PERIODIC]
    - name: symmetry_copies
      type: int
      required: false
      joins_previous: true
    - name: wall_collision_avoidance
      type: enum
      values: [ENABLE, DISABLE]
      required: false
  manual_ref: "SRC-003 p.337"
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.303, this edition's own grammar; see the note below"
      args:
        - name: surfaces
          type: int
        - name: surface_toggles
          type: str_list
          required: false
        - name: wake_termination_x
          type: str
        - name: symmetry_type
          type: enum
          values: ["NONE", "PLANE", "PERIODIC"]
        - name: symmetry_periodicity
          type: int
        - name: load_frame
          type: int
          cites: frames
        - name: proximity_avoidance
          type: enum
          values: ["ENABLE", "DISABLE"]
        - name: stabilization
          type: enum
          values: ["ENABLE", "DISABLE"]
        - name: stabilization_strength
          type: float
        - name: fast_multipole
          type: enum
          values: ["ENABLE", "DISABLE"]
    "25.100":
      status: documented
      note: "SRC-748 p.312, this edition's own grammar; see the note below"
      args:
        - name: solver_model
          type: enum
          values: ["INCOMPRESSIBLE", "SUBSONIC_PRANDTL_GLAUERT", "TRANSONIC_FIELD_PANEL", "SUPERSONIC_LINEAR_DOUBLET", "TANGENT_CONE", "MODIFIED_NEWTONIAN"]
        - name: surfaces
          type: int
        - name: surface_toggles
          type: str_list
          required: false
        - name: wake_termination_x
          type: str
          required: false
        - name: symmetry
          type: enum
          values: ["NONE", "MIRROR", "PERIODIC"]
        - name: symmetry_copies
          type: int
          required: false
        - name: wall_collision_avoidance
          type: enum
          values: ["ENABLE", "DISABLE"]
          required: false
        - name: stabilization
          type: enum
          values: ["ENABLE", "DISABLE"]
          required: false
        - name: stabilization_strength
          type: float
          required: false
    "26.000":
      status: documented
      note: "SRC-747 p.311, this edition's own grammar; see the note below"
      args:
        - name: solver_model
          type: enum
          values: ["INCOMPRESSIBLE", "SUBSONIC_PRANDTL_GLAUERT", "TRANSONIC_FIELD_PANEL", "SUPERSONIC_LINEAR_DOUBLET", "TANGENT_CONE", "MODIFIED_NEWTONIAN"]
        - name: surfaces
          type: int
        - name: surface_toggles
          type: str_list
          required: false
        - name: wake_termination_x
          type: str
          required: false
        - name: symmetry
          type: enum
          values: ["NONE", "MIRROR", "PERIODIC"]
        - name: symmetry_copies
          type: int
          required: false
        - name: wall_collision_avoidance
          type: enum
          values: ["ENABLE", "DISABLE"]
          required: false
        - name: stabilization
          type: enum
          values: ["ENABLE", "DISABLE"]
          required: false
        - name: stabilization_strength
          type: float
          required: false
    "26.100": {status: documented, note: "SRC-741 p.334, same grammar as 26.120"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    SURFACES takes -1 for all boundaries or a count followed by one
    line per surface with the surface index and the quad mesher toggle
    (SURFACE_TOGGLES lines of the form index,ENABLE; the count check
    ties them to SURFACES). WAKE_TERMINATION_X takes an X location in
    the reference frame or DEFAULT for auto-computation. PERIODIC
    symmetry appends the number of copies on the SYMMETRY line
    (SYMMETRY_COPIES). WALL_COLLISION_AVOIDANCE applies to solver
    models 1 to 3. The initialize_solver helper builds both extended
    forms from typed arguments. Initializing MIRROR symmetry with a
    full (non-half) model diverges instantly (SRC-003 p.217); case
    metadata declaring a full model triggers a build-time warning when
    cases/ lands.

SOLVER_PROXIMAL_BOUNDARIES:
  layout: payload_lines
  phase: init
  args:
    - name: count
      type: int
    - name: boundary_indices
      type: int_list
      cites: boundaries
      separator: newline
  manual_ref: "SRC-003 pp.337-338"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.298, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.313, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.312, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.335, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.336, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121":
      status: verified
      report: "reports/compat/CMP-26121_2026-08-08_savedstate2.yaml"
      note: >-
        SRC-740 pp.340-341 documents a SECOND call form no older edition
        prints: a count of -1 selects every boundary and takes no index
        lines at all. So this build's grammar makes the index list
        optional, which the grammar the older editions state does not.
        Not an all_sentinel declaration: that field is read on an index
        argument, and the -1 here is written in the COUNT field. The
        count-and-payload check is what enforces the pairing, refusing
        any count except -1 when the list is omitted.
      args:
        - {name: count, type: int}
        - {name: boundary_indices, type: int_list, cites: boundaries,
           separator: newline, required: false}
  notes: >
    Enables solver proximity checking for the listed boundaries, one
    index per line. Must be called before INITIALIZE_SOLVER
    (SRC-003 p.338).

