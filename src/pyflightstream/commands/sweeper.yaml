# Chapter: Sweeper Toolbox script commands (SRC-003 pp.358-360).
#
# REDRAFTED on 2026-08-06 from the reference pages. The chapter was
# first written from the worked scripting example at SRC-003 p.406,
# which exercises two of the three sweep modes and three of the four
# sweep axes, and every gap below followed from that: UNIFORM was
# missing from all three enumerations, SWEEPER_SET_MACH_SWEEP was
# missing entirely, and the velocity command could take a file where
# the angle commands could take a list, an asymmetry the manual does
# not have. The file's own header predicted the widening; the citation
# range guard in tests/test_command_db.py is what will now say so
# before a reader has to.
#
# The four sweep commands share one parameter table, word for word, in
# every edition that has them. NONE of them exists in 26.100, whose
# Sweeper Toolbox is a single keyword-block EXECUTE_SOLVER_SWEEPER with
# per-axis ENABLE/DISABLE toggles and START/STOP/DELTA triples
# (SRC-741 p.354): a different API rather than a different signature,
# sharing no command name, which is why no 26.100 row appears here.

SWEEPER_SET_AOA_SWEEP:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [UNIFORM, CUSTOM, DISABLE]
    - name: values
      type: float_list
      unit: "deg"
      required: false
      separator: space
    - name: filename
      type: path
      required: false
  manual_ref: "SRC-003 p.358"
  versions:
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Angle of attack axis of the sweeper. Three modes with three
    different tails: UNIFORM takes exactly three numbers, CUSTOM takes
    either the value list inline or the path of a file holding it, and
    DISABLE takes nothing.

    NOTHING ENFORCES THAT PAIRING, and this note said the sweep helper
    did until 2026-08-06, which was false in a place a reader consults.
    Both tails are declared optional because ArgSpec has `required` and
    no conditional, so the emitter accepts UNIFORM with no tail, UNIFORM
    with two numbers of three, DISABLE with a tail, and CUSTOM with both
    tails at once. Every one of those is decidable from the bound mode
    and none of them is decided; they reach the solver
    (PLN-20260806-1100). Stated rather than implied, because the
    equivalent gap on NEW_CCS_WING_CONTROL_SURFACE is written down the
    same way and a claim of enforcement is worse than an admitted gap.

    THE THIRD UNIFORM NUMBER IS AN INCREMENT, not
    a count of points, although the parameter table labels the triple
    START/STOP/STEPS: the sibling Mach command's own sample passes 0.05
    there (SRC-003 p.359), which no count can be, the toolbox narrative
    calls it the increment (SRC-003 p.266), and the 26.100 predecessor
    API named the same field DELTA (SRC-741 p.354). Whether the stop
    value is inclusive is not stated anywhere and is not assumed here.

SWEEPER_SET_BETA_SWEEP:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [UNIFORM, CUSTOM, DISABLE]
    - name: values
      type: float_list
      unit: "deg"
      required: false
      separator: space
    - name: filename
      type: path
      required: false
  manual_ref: "SRC-003 p.358"
  versions:
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Side-slip axis of the sweeper, with the grammar of
    SWEEPER_SET_AOA_SWEEP above and the same reading of its third
    UNIFORM number.

SWEEPER_SET_VELOCITY_SWEEP:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [UNIFORM, CUSTOM, DISABLE]
    - name: values
      type: float_list
      unit: "m/s"
      required: false
      separator: space
    - name: filename
      type: path
      required: false
  manual_ref: "SRC-003 p.358"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.357, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.361, same grammar as 26.120"}
  notes: >
    Free-stream velocity axis of the sweeper. It used to declare the
    file path alone, which made it the one axis that could not take an
    inline list; the manual gives all four axes the same table and the
    same three samples, so the asymmetry came from the worked example
    this chapter was first read from and not from the grammar. The
    unit is this repository's convention rather than a manual
    statement: SRC-003 p.358 names none, and whether the axis follows
    the solver's configured velocity unit is a probe question.

SWEEPER_SET_MACH_SWEEP:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [UNIFORM, CUSTOM, DISABLE]
    - name: values
      type: float_list
      required: false
      separator: space
    - name: filename
      type: path
      required: false
  manual_ref: "SRC-003 p.359"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.358, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.362, same grammar as 26.120"}
  notes: >
    Mach number axis of the sweeper, dimensionless. Absent from this
    database until 2026-08-06 for the same reason the UNIFORM mode was:
    the worked example the chapter was drafted from sweeps angle of
    attack, side-slip and velocity, and never Mach. Its sample is the
    one that settles what the third UNIFORM number means, since 0.05
    cannot be a number of steps. Whether a velocity sweep and a Mach
    sweep can be enabled together, and which wins, is not documented.

