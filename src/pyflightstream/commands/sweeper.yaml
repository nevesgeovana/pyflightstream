SWEEPER_REF_VELOCITY_SAME:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.360"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.359, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: broken, report: "reports/compat/CMP-26121_2026-08-08_full.yaml", note: "script processing aborted at the command: the log exported before it exists, the one after it never appeared (END sentinel missing)"}
    "26.122":
      status: removed
      note: >-
        SRC-750 pp.283-383, the scripting reference of the 26.122
        edition, does not print this command anywhere, AND THAT
        EDITION'S INDEX DISAGREES WITH ITS OWN BODY: The Script
        Index at pp.384-390 of the same document still names it, and
        does not name any replacement. The body is the reading
        recorded here, on the rule that a signature heading is what a
        script is written from and an index entry is a pointer to one;
        an index that lags its own body is a defect of that document
        rather than a second opinion about the solver. The index is incomplete in BOTH
        directions and neither half of it carries much: counted over
        the ten commands this edition is the first to document, five
        are in it and five are not, and it keeps four of the seven
        names this edition stops printing relative to 26.120, plus at
        least one token that is no command at all,
        SOLVER_INITIALIZATION. Read the four with that scope: counted
        without it the kept names are five, DISABLE_ACTUATOR having
        left the body at 26.101 and stayed in the index. So the body wins here on the rule and not on
        any property of this index. A first draft of this note said
        the index was maintained by addition, which was one
        observation generalised and the count refutes it. THIS ROW EXISTS BECAUSE
        INHERITANCE WOULD SAY THE OPPOSITE. 26.122 inherits from the
        base release 26.120, not from the sibling hotfix, so without a
        row here the emitter would resolve 26.120's documented record
        and write a command that the 26.121 row above records as broken,
        its script aborting at that line. That row is about 26.121 and
        this one is not, which is why it carries no report of its own
        and rests on the edition's silence; silence alone is the weakest
        of the three routes to this status, and it is still a better
        answer than the opposite one inheritance would give.
  notes: >
    Keeps the reference velocity equal to the free-stream velocity at
    every sweep point. The 26.121 abort recorded above now has a
    documentary counterpart: SRC-740 documents no such command at all,
    while SRC-725 p.359 and SRC-003 p.360 both do. The probe measured
    the behaviour and the manual explains it, which is a stronger
    record than either alone; the status stays broken because that is
    what was measured, and only a probe promotes it.

