        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.101":
      status: removed
      note: >-
        SRC-725 pp.280-375, the whole scripting reference of the
