# Chapter: Scripting reference, Mesh Unite (SRC-003 p.316).
#
# COMPLETE as of 2026-08-08, entered from all four registered editions in
# one pass. Both signatures identical across the four.
#
# THE ONLY PLACE IN THIS DATABASE WHERE A COMMAND CALLS OUT TO ANOTHER
# VENDOR'S EXECUTABLE. The boolean unite is performed by OpenVSP's
# CompGeom rather than by FlightStream, which is why the chapter needs a
# path command at all, and why its two commands are ORDERED: the path
# must be set before the unite runs. The manual states that ordering in
# the path command's own parameter row.
#
# That also means this chapter can fail for reasons no other chapter can:
# OpenVSP absent, at a different path, or a version whose CompGeom
# behaves differently. Nothing here can check any of that.

BOOLEAN_UNITE_PATH:
  layout: keyword_block
  phase: geometry
  args:
    - name: openvsp_path
      type: path
  manual_ref: "SRC-003 p.316"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.272, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.290, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.289, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.311, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.315, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.319, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.320, unchanged from SRC-750 p.320"}
  notes: >
    Location of the OpenVSP executable used for the unite. The manual
    states it must be called BEFORE BOOLEAN_UNITE_MESH, which is the one
    ordering rule the chapter has and which nothing here enforces: the
    phase system orders commands by phase, and both of these are
    geometry.

    The sample writes a directory rather than an executable, and the
    parameter row calls it a path to the executable. Which of the two
    the solver wants is not settled by the page, so nothing here
    constrains the value beyond it being a path.

BOOLEAN_UNITE_MESH:
  layout: payload_lines
  phase: geometry
  args:
    - name: num_bodies
      type: int
    - name: body_indices
      type: int_list
      separator: space
      required: false
  manual_ref: "SRC-003 p.316"
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.272, this edition's own grammar; see the note below"
      args:
        - name: num_bodies
          type: int
        - name: body_unite_types
          type: str_list
          required: false
    "25.100":
      status: documented
      note: "SRC-748 p.290, this edition's own grammar; see the note below"
      args:
        - name: num_bodies
          type: int
        - name: body_unite_types
          type: str_list
          required: false
    "26.000":
      status: documented
      note: "SRC-747 p.289, this edition's own grammar; see the note below"
      args:
        - name: num_bodies
          type: int
        - name: body_unite_types
          type: str_list
          required: false
    "26.100": {status: documented, note: "SRC-741 p.311, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.315, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.319, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.320, unchanged from SRC-750 p.320"}
  notes: >
    Intersects and unites several mesh bodies into one. The count sits
    on the command line and the indices follow on the next.

    THE INDICES ARE SPACE SEPARATED HERE AND COMMA SEPARATED IN THE MESH
    OPERATIONS CHAPTER. Both samples on this page print spaces, where
    SURFACE_COMBINE and WRAPPER_SET_INPUT print commas for the same kind
    of payload. The separator is emitted literally, so the difference is
    recorded per command rather than harmonised.

    -1 UNITES EVERY BODY and takes no index line, which is why the list
    is optional. The manual states this as a note under the count.

    These are MESH BODY indices, not the mesh boundary indices the rest
    of the database cites, so nothing resolves or range checks them: the
    script builder tracks boundaries and has no inventory of bodies.

BOOLEAN_UNITE_GEOMETRY:
  layout: keyword_block
  phase: geometry
  args:
    - name: bodies
      type: int
    - name: body_unite_types
      type: str_list
      separator: newline
    - name: openvsp_path
      type: path
  manual_ref: "SRC-749 p.272"
  notes: >
    Boolean-unites CAD GEOMETRY bodies, where BOOLEAN_UNITE_MESH unites
    mesh bodies. The two are siblings on the same page of the 25.000
    edition and only the mesh one survives: no edition from 25.100 on
    prints this name.

    The unite is not performed by FlightStream. Both commands call out
    to an external OpenVSP executable for the CompGeom operation, and
    OPENVSP_PATH is where that executable is, which is why a path
    belongs in a geometry command at all. A wrong path is an environment
    failure and not a modelling one.

    BODIES takes a count followed by one line per body pairing the body
    index with POSITIVE or NEGATIVE, the sign being whether that body
    adds volume or subtracts it. A count of -1 means every body with a
    positive volume, which is the additive unite, and then no body lines
    follow.
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.272, this edition documents it"
    "25.100":
      status: removed
      note: >-
        SRC-748 pp.271-347, the whole scripting reference of the
        25.100 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.000":
      status: removed
      note: >-
        SRC-747 pp.270-346, the whole scripting reference of the
        26.000 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.100":
      status: removed
      note: >-
