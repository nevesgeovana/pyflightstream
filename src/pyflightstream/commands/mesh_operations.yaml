# Chapter: Scripting reference, Mesh Operations (SRC-003 pp.309-313).
#
# Everything that moves, copies, cuts, selects or deletes a mesh surface
# after it is imported and before the solver initializes. Phase is
# geometry throughout, for the same reason the CAD chapters are: these
# act on geometry, and the ordering check refuses them after
# INITIALIZE_SOLVER.
#
# TWO THINGS IN THIS CHAPTER ARE NOT UNIFORM AND BOTH BITE.
#
# The all-surfaces sentinel has THREE cases, not two, and the manual
# states each per command while never contrasting them. Measured across
# the four editions: -1 on seven surface indices, ZERO on the two
# translations, and NOTHING AT ALL on six (SURFACE_RENAME,
# SURFACE_MIRROR, SURFACE_DELETE, SURFACE_AUTO_HOLE_FILL and the two
# COPY_PASTE commands), whose pages state only that the first surface is
# index 1. A script reaching for -1 out of habit translates surface -1
# rather than all of them, or asks to rename every surface to one name.
# The third case is the one this header omitted until 2026-08-07, and
# the omission was in the emitter too: absent read as -1 everywhere.
# It is now declared per argument, as all_sentinel, and absent means the
# page states none. See docs/srs/data-model.md.
#
# And the surface index appears under four different argument names
# across the chapter: SURFACE, Index, SURFACE_COUNT and NODE_ID for the
# node commands. The names are the manual's own and are mirrored rather
# than harmonised, for the reason recorded in the CAD Create header: an
# argument list that stops matching the page beside it loses the one
# thing it is for.
#
# MIRRORING THE PAGE IS FREE ONLY BECAUSE `cites:` PAYS FOR IT. The
# emitter resolves a declared label and bounds an index by ARGUMENT
# NAME, and a chapter that mirrors four spellings of one thing defeats
# that: for one day in August 2026 SURFACE_DELETE accepted a declared
# label and SURFACE_INVERT did not, by no rule a caller could see.
#
# THE RULE LIVES IN docs/srs/data-model.md, in the section on what an
# argument declares and when it must. Read it before adding a chapter;
# it covers cites, all_sentinel and fixed_length together. In this
# chapter it is why `frame` declares nothing while `frame1`, `frame2`,
# `coordinate_system`, `index` and `surface_indices` all do.
#
# Forgetting is not silent: tests/test_script.py fails on any index
# argument whose name says it cites something and that resolves to
# nothing.

# --- moving a surface -------------------------------------------------------

SURFACE_ROTATE:
  layout: keyword_block
  phase: geometry
  args:
    - name: frame
      type: int
      cites: frames
    - name: axis
      type: enum
      values: [X, Y, Z, "1", "2", "3"]
    - name: angle
      type: float
      unit: "deg"
    - name: surfaces
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
      separator: comma
      required: false
    - name: split_vertices
      type: enum
      values: [ENABLE, DISABLE]
    - name: adaptive_mesh
      type: enum
      values: [ENABLE, DISABLE]
    - name: detach_normal_to_axis
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.309"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.263, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.283, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.282, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.304, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.308, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.312, same grammar as 26.120"}
  notes: >
    Rotates surfaces about an axis of a coordinate system. AXIS carries
    the dual form, letters or indices, and here the manual states it
    outright rather than leaving it to a sample as CAD_BODY_ROTATE does.

    THE KEYWORD IS SPELLED TWO WAYS ON ONE PAGE, AND THE SAMPLE IS
    RIGHT. The parameter table names the row SURFACE and the sample
    writes SURFACES. A keyword is emitted literally, so unlike an
    enumeration this cannot accept both. The plural was recorded on the
    reasoning that the sample is the only form the vendor has written as
    a runnable line; a 2026-08-08 probe then measured it (RPT-021), the
    solver accepting SURFACES and refusing SURFACE at that line.

    The count keyword is followed by the indices on the next line,
    EXCEPT at -1, which the page states selects every surface for
    rotation and which takes no index line; the list is optional for
    that reason. The
    separator is read from SURFACE_COMBINE, the one command in this
    chapter that states it (comma separated, SRC-003 p.312), because
    this page shows a single index and a one-element list looks the same
    under either rule.

TRANSLATE_SURFACE_IN_FRAME:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
      cites: frames
    - name: x
      type: float
    - name: y
      type: float
    - name: z
      type: float
    - name: units
      type: enum
      values: [INCH, MILLIMETER, OTHER, FEET, MILE, METER, KILOMETER, MILS, MICRON, CENTIMETER, MICROINCH]
    - name: surface
      type: int
      cites: boundaries
      all_sentinel: 0
    - name: split_vertices
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.309"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.263, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.283, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.282, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.304, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.308, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.312, same grammar as 26.120"}
  notes: >
    Translates one surface by a vector in the named frame, with the
    vector's own UNITS argument rather than the simulation length units.

    ZERO SELECTS ALL SURFACES HERE, not -1. This command and
    TRANSLATE_SURFACE_BY_FRAME below are the two in the chapter that use
    zero. Seven other surface indices use -1 and six state no all-form
    at all, and the manual states each per command without ever
    contrasting them. Passing -1 here names surface -1 rather than all
    of them, and the emitter refuses it for that reason.

TRANSLATE_SURFACE_BY_FRAME:
  layout: inline
  phase: geometry
  args:
    - name: frame1
      type: int
      cites: frames
    - name: frame2
      type: int
      cites: frames
    - name: surface
      type: int
      cites: boundaries
      all_sentinel: 0
  manual_ref: "SRC-003 p.309"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.264, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.283, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.282, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.304, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.308, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.312, same grammar as 26.120"}
  notes: >
    Moves a surface by the transform that carries FRAME1 onto FRAME2, so
    the two frames are the instruction and there is no vector. ZERO
    selects all surfaces, as on TRANSLATE_SURFACE_IN_FRAME above, and -1
    is an ordinary out-of-range index here rather than an all-form.

SURFACE_SCALE:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
      cites: frames
    - name: scale_x
      type: float
    - name: scale_y
      type: float
    - name: scale_z
      type: float
    - name: surface
      type: int
      cites: boundaries
      all_sentinel: -1
  manual_ref: "SRC-003 p.310"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.264, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.284, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.283, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.305, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.309, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.313, same grammar as 26.120"}
  notes: >
    PER-AXIS scaling, unlike CAD_CREATE_SCALE_CURVES which takes one
    factor for all three. Each must be greater than zero, which the
    manual states and the database does not enforce, and -1 on SURFACE
    scales every surface.

SURFACE_MIRROR:
  layout: inline
  phase: geometry
  args:
    - name: surface
      type: int
      cites: boundaries
    - name: coordinate_system
      type: int
      cites: frames
    - name: mirror_plane
      type: int
    - name: combine_flag
      type: enum
      values: ["TRUE", "FALSE"]
    - name: delete_source_flag
      type: enum
      values: ["TRUE", "FALSE"]
  manual_ref: "SRC-003 p.311"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.266, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.285, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.284, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.306, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.310, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.314, same grammar as 26.120"}
  notes: >
    MIRROR_PLANE IS AN INDEX AND NOT A PLANE NAME. The manual gives 1
    for YZ, 2 for XZ and 3 for XY (SRC-003 p.311), so this is the one
    plane argument in the database that does not take the two-letter
    token, and passing XZ here is refused while passing 2 means it.
    Recorded because every neighbouring command spells a plane with
    letters.

    COMBINE_FLAG decides whether the mirrored geometry joins the source
    and DELETE_SOURCE_FLAG whether the source survives, so the two
    together choose between four outcomes and neither implies the other.

SURFACE_LINEAR_COPY_PASTE:
  layout: inline
  phase: geometry
  args:
    - name: surface
      type: int
      cites: boundaries
    - name: num_copies
      type: int
    - name: frame
      type: int
      cites: frames
    - name: units
      type: enum
      values: [INCH, MILLIMETER, OTHER, FEET, MILE, METER, KILOMETER, MILS, MICRON, CENTIMETER, MICROINCH]
    - name: x
      type: float
    - name: y
      type: float
    - name: z
      type: float
  manual_ref: "SRC-003 pp.311-312"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.266, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.285, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.284, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.306, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.310, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.314, same grammar as 26.120"}
  notes: >
    Copies a surface along a vector, NUM_COPIES times. The translation
    vector follows UNITS here and precedes it on
    TRANSLATE_SURFACE_IN_FRAME, so the two commands take the same five
    values in a different order.

SURFACE_CIRCULAR_COPY_PASTE:
  layout: inline
  phase: geometry
  args:
    - name: surface
      type: int
      cites: boundaries
    - name: coordinate_system
      type: int
      cites: frames
    - name: axis
      type: str
    - name: num_copies
      type: int
    - name: angle
      type: float
      unit: "deg"
  manual_ref: "SRC-003 p.312"
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.271, this edition's own grammar; see the note below"
      args:
        - name: surface
          type: int
        - name: coordinate_system
          type: int
        - name: axis
          type: str
        - name: num_copies
          type: int
    "25.100": {status: documented, note: "SRC-748 p.286, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.285, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.307, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.311, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.315, same grammar as 26.120"}
  notes: >
    Copies a surface around an axis, and NUM_COPIES INCLUDES THE
    ORIGINAL: the manual's own worked case is a two-blade propeller from
    one blade at a value of 2, so asking for 2 copies gives two blades
    and not three.

    AXIS IS UNTYPED HERE ON PURPOSE. Its parameter table enumerates
    nothing at all, and the only value any edition prints is the index
    1. SURFACE_ROTATE, four entries above in this same chapter,
    documents the dual letter-or-index form outright, so the likely set
    is not a mystery; it is simply not cited for THIS command, and
    writing an enumeration would mean inventing a value set, which this
    database has now done once by accident and refuses to do on purpose.

# --- selecting, cutting and combining ---------------------------------------

SURFACE_SELECT_BY_ID:
  layout: inline
  phase: geometry
  args:
    - name: surface
      type: int
      cites: boundaries
      all_sentinel: -1
  manual_ref: "SRC-003 p.310"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.309, the first edition to carry this name"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.313, same grammar as 26.120"}
  notes: >
    Selects one surface by its 1-based index, or every surface at -1.
    The February 2026 edition calls the same command
    SELECT_GEOMETRY_BY_ID, with the same single argument, the same
    description and the same sample; the two are recorded separately
    with their own version rows, because the manual RENAMES it without
    ever stating a removal and this database records what each edition
    documents.

SELECT_GEOMETRY_BY_ID:
  layout: inline
  phase: geometry
  args:
    - name: surface
      type: int
      cites: boundaries
      all_sentinel: -1
  manual_ref: "SRC-741 p.305"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.265, same grammar as 26.100"}
    "25.100": {status: documented, note: "SRC-748 p.284, same grammar as 26.100"}
    "26.000": {status: documented, note: "SRC-747 p.283, same grammar as 26.100"}
    "26.100": {status: documented}
  notes: >
    The February 2026 spelling of SURFACE_SELECT_BY_ID above, documented
    in that edition alone and in none after it. Recorded rather than
    dropped because 26.100 is a registered build and a script written
    for it needs the name that edition documents.

    Its status is documented and not removed, deliberately: this
    database promotes a command to removed when a manual STATES the
    removal, and no edition states one here. What happened is that the
    name stopped appearing, which is a weaker fact and is recorded as
    the absence of later version rows.

SURFACE_SELECT_BY_THRESHOLD:
  layout: keyword_block
  phase: geometry
  args:
    - name: frame
      type: int
      cites: frames
    - name: threshold
      type: enum
      values: [AREA, QUALITY, X, Y, Z, VELOCITY, VX, VY, VZ, CP, MACH, SOLVER_QUALITY]
    - name: min_value
      type: float
    - name: max_value
      type: float
    - name: range
      type: enum
      values: [ABOVE_MIN, BELOW_MAX, ABOVE_MIN_BELOW_MAX]
    - name: subset
      type: enum
      values: [ALL_FACES, VISIBLE_FACES, SELECTED_FACES]
  manual_ref: "SRC-003 p.310"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.265, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.284, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.283, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.305, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.309, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.313, same grammar as 26.120"}
  notes: >
    Selects mesh FACES, not surfaces, by a scalar threshold. RANGE
    decides which of MIN_VALUE and MAX_VALUE are read, so a range of
    ABOVE_MIN leaves MAX_VALUE unused; both are required here because
    the schema has no conditional, and the unused one is discarded by
    the solver rather than by this package.

    THRESHOLD mixes geometric and SOLVED quantities in one vocabulary:
    AREA and QUALITY are properties of the mesh, and VELOCITY, CP and
    MACH exist only after a solution. Selecting on those before the
    solver has run is not refused here and the manual does not say what
    it does.

    SUBSET narrows what the threshold is applied to, so a selection can
    be refined by running the command twice with SELECTED_FACES.

CREATE_NEW_SURFACE_FROM_SELECTION:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.311"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.265, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.285, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.284, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.306, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.310, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.314, same grammar as 26.120"}
  notes: >
    Promotes the currently selected faces into a surface of their own,
    which is what makes SURFACE_SELECT_BY_THRESHOLD useful as more than
    a highlight. It takes no argument because the selection is the
    state it reads.

SURFACE_CUT_BY_PLANE:
  layout: keyword_block
  phase: geometry
  args:
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: offset
      type: float
    - name: surface
      type: int
      cites: boundaries
      all_sentinel: -1
  manual_ref: "SRC-003 p.311"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.265, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.285, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.284, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.306, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.310, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.314, same grammar as 26.120"}
  notes: >
    Cuts surfaces with a plane of the named frame, offset along the
    plane normal. A value of -1 on SURFACE cuts every surface, which the
    manual's own sample does.

    The parameter table spells the second plane ZX where every other
    plane argument in the manual and in this database spells it XZ, and
    the sample on the same page passes XZ. The XZ spelling is recorded;
    the table's is read as a transposition rather than a third plane,
    since ZX and XZ name the same plane and no command anywhere accepts
    both.

SURFACE_COMBINE:
  layout: payload_lines
  phase: geometry
  args:
    - name: surface_count
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
      separator: comma
  manual_ref: "SRC-003 p.312"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.267, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.286, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.285, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.307, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.311, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.315, same grammar as 26.120"}
  notes: >
    Merges several surfaces into one. The count sits on the command line
    and the indices follow on the next, comma separated, which this page
    states explicitly and which is why it is the reference for the same
    shape inside SURFACE_ROTATE's keyword block.

