SURFACE_RENAME:
  layout: inline
  phase: geometry
  args:
    - name: index
      type: int
      cites: boundaries
    - name: name
      type: str
  manual_ref: "SRC-003 p.310"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.264, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.284, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.283, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.305, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.309, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.313, same grammar as 26.120"}
  notes: >
    Renames a surface, which is worth doing early: the name is what a
    reader of the emitted script sees, and this package's own entity
    labels are a separate mechanism that never reaches the solver.

    The parameter table's description of the index is the one written
    for SURFACE_INVERT and talks about inverting rather than renaming, a
    row carried across between neighbouring commands, as happens on
    CAD_BODY_DELETE. It states no -1 form, and renaming every surface to
    one name would be a strange thing to offer, so none is recorded.

