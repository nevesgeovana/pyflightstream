    "26.101": {status: documented, note: "SRC-725 p.311, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.315, same grammar as 26.120"}
  notes: >
    Deletes the faces currently selected, the destructive counterpart of
    CREATE_NEW_SURFACE_FROM_SELECTION and the other reason the threshold
    selection exists.

DELETE_DEGENERATE_FACES:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.313"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.268, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.287, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.286, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.308, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.312, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.316, same grammar as 26.120"}
  notes: >
    Deletes every degenerate face in the simulation. What counts as
    degenerate is not defined on the page, and this entry does not
    guess; it acts on the whole model rather than on a selection.

SURFACE_DELETE:
  layout: keyword_block
  phase: geometry
  args:
    - name: surface
      type: int
      cites: boundaries
  manual_ref: "SRC-003 p.312"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.267, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.287, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.286, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.308, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.311, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Deletes one surface by index, as a keyword block with a single
    keyword line rather than as an inline argument, which is the manual's
    shape and not a choice made here.

    Documented in three editions and in none after. SRC-740 carries the
    inline DELETE_SURFACES instead, and states no replacement and no
    removal: it simply stops printing this command, which is absence
    rather than a statement, so the status stays documented and no
    26.121 row is written.

    READ WHAT THAT DOES NOT ACHIEVE. 26.121 is a real hotfix of 26.120
    and inherits its records, so the emitter ACCEPTS this command for
    26.121 even with no row of its own. Inheritance is per version and
    cannot be denied per command, so a database that knows the 26.121
    manual dropped this one has no way to say so
    (PLN-20260807-1010). Whether the solver still answers to it on that
    build is a probe question, and until it is asked the emitter is
    permissive here rather than wrong.

SURFACE_CLEARALL:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.313"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.268, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.287, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.286, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.308, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.312, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Deletes every surface in the simulation. Documented in three
    editions and in none after, with DELETE_SURFACES carrying the
    every-surface form in SRC-740. The same two things hold as for
    SURFACE_DELETE above: no edition states a removal, and 26.121
    inherits the 26.120 record, so the emitter accepts this command for
    a build whose manual does not document it
    (PLN-20260807-1010).

# --- mesh nodes ---------------------------------------------------------------

SELECT_MESH_NODE:
  layout: inline
  phase: geometry
  args:
    - name: node_id
      type: int
  manual_ref: "SRC-003 p.313"
  versions:
    "25.100": {status: documented, note: "SRC-748 p.287, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.286, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.308, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.312, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.316, same grammar as 26.120"}
  notes: >
    Selects one mesh vertex by its node id, which is a different index
    space from the surface indices the rest of this chapter uses: the
    manual says node ID and nothing about its base, so this entry says
    nothing either.

TRANSFORM_SELECTED_NODES:
  layout: inline
  phase: geometry
  args:
    - name: coordinate_system
      type: int
      cites: frames
    - name: translation_type
      type: enum
      values: [ABSOLUTE, TRANSLATION]
    - name: x
      type: float
    - name: y
      type: float
    - name: z
      type: float
  manual_ref: "SRC-003 p.313"
  versions:
    "25.100": {status: documented, note: "SRC-748 p.287, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.286, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.308, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.312, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.316, same grammar as 26.120"}
  notes: >
    Moves the selected nodes. TRANSLATION_TYPE decides what X, Y and Z
    MEAN: under ABSOLUTE they are the node's new coordinates and under
    TRANSLATION they are increments added to the current ones. The same
    three numbers therefore place a node somewhere different depending
    on a token two arguments earlier, and the argument names cannot say
    so.

    It carries no unit argument, unlike the surface translations, so the
    values are read in the named coordinate system's own units.
