# Chapter: Scripting reference, Boundary Conditions families used by
# the core steady path: Trailing Edges (SRC-003 pp.319-320), Wake
# Termination Nodes (p.321), Free-Stream Velocity (p.322), Fluid
# Properties (p.328).

AUTO_DETECT_TRAILING_EDGES:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.319"
  versions:
    "26.000": {status: documented, note: "SRC-747 p.292, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.314, same grammar as 26.120"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Finds and marks all trailing edge nodes in the geometry. Trailing
    edge marking controls where the wake is shed, so it must precede
    solver initialization.

SET_TRAILING_EDGE_TYPE:
  layout: inline
  phase: setup
  args:
    - name: te_index
      type: int
    - name: type
      type: enum
      values: [STANDARD, RELAXED, JET_OUTFLOW, VORTEX_SHEDDING]
  manual_ref: "SRC-003 pp.319-320"
  versions:
    "26.000": {status: documented, note: "SRC-747 p.292, same grammar as 26.120"}
    "26.100":
      status: documented
      note: >-
        SRC-741 p.314. THREE types, not four: this edition closes the
        value set at JET_OUTFLOW and does not carry VORTEX_SHEDDING,
        which first appears as a type in the May edition. Checked
        against the wrapped-line failure mode that would fake it, with a
        positive control on 26.101 and a sweep of every page of this
        edition finding the token nowhere.
      args:
        - {name: te_index, type: int}
        - {name: type, type: enum, values: [STANDARD, RELAXED, JET_OUTFLOW]}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_savedstate2.yaml"}
    "26.101": {status: documented, note: "SRC-725 p.318, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
  notes: >
    STANDARD sheds the full net circulation (Kutta factor 1.0);
    RELAXED sheds half, approximating body carryover at non-lifting
    trailing edges such as wing-fuselage junctions (SRC-003 p.164).

DISABLE_WAKE_NODES_ON_TRAILING_EDGE:
  layout: inline
  phase: setup
  args:
    - name: te_index
      type: int
  manual_ref: "SRC-003 p.320"
  versions:
    "25.100": {status: documented, note: "SRC-748 p.294, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.293, same grammar as 26.120"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_savedstate2.yaml"}
    "26.101": {status: documented, note: "SRC-725 p.319, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.315, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}

AUTO_DETECT_WAKE_TERMINATION_NODES:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.321"
  versions:
    "26.000": {status: documented, note: "SRC-747 p.294, same grammar as 26.120"}
    "26.121": {status: documented, note: "SRC-740 p.324, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.316, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.320, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Finds and marks all wake termination nodes in the geometry.

SET_FREESTREAM:
  layout: inline
  phase: setup
  args:
    - name: type
      type: enum
      values: [CONSTANT, CUSTOM, ROTATION]
    - name: filetype
      type: enum
      values: [STRUCTURED, UNSTRUCTURED]
      required: false
    - name: frame
      type: int
      cites: frames
      required: false
    - name: axis
      type: enum
      values: [X, Y, Z]
      required: false
    - name: angular_velocity
      type: float
      unit: "rev/min"
      required: false
    - name: filename
      type: path
      required: false
      own_line: true
  manual_ref: "SRC-003 p.322"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.279, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.296, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.295, same grammar as 26.120"}
    "26.121": {status: documented, note: "SRC-740 p.325, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.317, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.321, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    CONSTANT needs no further input. CUSTOM appends a FILETYPE token
    (STRUCTURED or UNSTRUCTURED) and takes the profile file path on
    the next line. ROTATION appends frame index, axis (X, Y or Z) and
    angular velocity in RPM. Which optional arguments each type takes
    is conditional; the free_stream helper enforces the valid
    combinations (SRC-003 p.322).

