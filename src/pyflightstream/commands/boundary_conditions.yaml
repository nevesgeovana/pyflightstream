      unit: "kg/m^3"
    - name: pressure
      type: float
      unit: "Pa"
    - name: temperature
      type: float
      unit: "K"
    - name: viscosity
      type: float
      unit: "Pa s"
    - name: specific_heat_ratio
      type: float
  manual_ref: "SRC-003 p.328"
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.286, this edition's own grammar; see the note below"
      args:
        - name: density
          type: float
        - name: pressure
          type: float
        - name: sonic_velocity
          type: float
          unit: "m/s"
        - name: temperature
          type: float
        - name: viscosity
          type: float
    "25.100":
      status: documented
      note: "SRC-748 p.302, this edition's own grammar; see the note below"
      args:
        - name: density
          type: float
        - name: pressure
          type: float
        - name: sonic_velocity
          type: float
          unit: "m/s"
        - name: temperature
          type: float
        - name: viscosity
          type: float
    "26.000":
      status: documented
      note: "SRC-747 p.301, this edition's own grammar; see the note below"
      args:
        - name: density
          type: float
        - name: pressure
          type: float
        - name: sonic_velocity
          type: float
          unit: "m/s"
        - name: temperature
          type: float
        - name: viscosity
          type: float
    "26.100": {status: documented, note: "SRC-741 p.324, same grammar as 26.120"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
  notes: >
    Sets the working fluid state as KEY VALUE lines. Sonic velocity is
    derived from temperature and specific heat ratio; it is no longer
