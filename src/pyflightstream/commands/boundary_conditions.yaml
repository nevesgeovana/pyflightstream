MARK_WAKE_TERMINATION_NODES:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.321"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.320, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.324, same grammar as 26.120"}
  notes: >
    Marks the currently SELECTED mesh nodes as wake termination nodes,
    which is the manual route where the two detection commands are the
    automatic ones. It takes nothing, so which nodes are marked comes
    entirely from the selection state left by SELECT_MESH_NODE.

    Absent from the February 2026 edition, so no 26.100 row.

PHYSICS:
  layout: keyword_block
  phase: setup
  args:
    - name: auto_trail_edges
      type: bool
    - name: auto_wake_nodes
      type: bool
  manual_ref: "SRC-748 p.293"
  notes: >
    Opens a block that launches the geometry autodetection tools,
    trailing edges and wake termination nodes, and closes on END. Both
    are presence keywords: writing the keyword runs that tool, omitting
    it runs nothing.

    THE HANDOVER IS EXACT AND IT EXPLAINS A WORKFLOW GAP. This block is
    on 25.000 and 25.100 and on no later edition, while
    AUTO_DETECT_TRAILING_EDGES and AUTO_DETECT_WAKE_TERMINATION_NODES
    are on 26.000 and every edition after it and on neither before. The
    two 25 builds are therefore not missing the capability, which is
    what their empty column looked like before this entry: they spell it
    as one block where the later builds spell it as two commands. A
    single successor is recorded because the field takes one name, and
    the wake-node command is the other half.
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.276, this edition documents it"
    "25.100":
      status: documented
      note: "SRC-748 p.293, this edition documents it"
    "26.000":
      status: removed
      successor: AUTO_DETECT_TRAILING_EDGES
      note: >-
        SRC-747 pp.270-346, the whole scripting reference of the
        26.000 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.100":
      status: removed
      successor: AUTO_DETECT_TRAILING_EDGES
      note: >-
        SRC-741 pp.275-369, the whole scripting reference of the
        26.100 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.101":
      status: removed
      successor: AUTO_DETECT_TRAILING_EDGES
      note: >-
        SRC-725 pp.280-375, the whole scripting reference of the
        26.101 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.120":
      status: removed
      successor: AUTO_DETECT_TRAILING_EDGES
      note: >-
        SRC-003 pp.281-376, the whole scripting reference of the
        26.120 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.
    "26.121":
      status: removed
      successor: AUTO_DETECT_TRAILING_EDGES
      note: >-
        SRC-740 pp.284-379, the whole scripting reference of the
        26.121 edition, does not print this command. That is a
        fact about the document rather than a measurement of the
        solver, which is the weakest of the three ways a removal
        is recorded here; no probe has asked this build whether
        it still answers the name.

DETECT_LEADING_EDGES_WAKES_BY_SURFACE:
  layout: keyword_block
  phase: setup
  args:
    - name: surfaces
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
  manual_ref: "SRC-750 p.323"
  notes: >
    Runs wake detection on the LEADING edges of the listed surfaces,
    which is what a vortex-shedding wake needs and what the
    trailing-edge detection beside it does not do. First documented
    by the 26.122 edition.

    Its page describes the parameter as the count of surfaces
    checked for TRAILING edge detection, word for word the sentence
    on the trailing-edge command above it. Read as a copied sentence
    rather than as a statement about this command, since the
    function name and the section it sits in both say leading edges;
    nothing here rests on that sentence.
  versions:
    "26.122":
      status: documented
      note: "SRC-750 p.323, the first edition to document it"

IMPORT_WAKE_EDGES_FROM_FILE:
  layout: inline
  phase: setup
  args:
    - name: type
      type: enum
      values: [STANDARD, RELAXED, JET_OUTFLOW, VORTEX_SHEDDING]
    - name: tolerance
      type: float
  manual_ref: "SRC-750 p.324"
  notes: >
    Marks wake edges from an imported node list, matching an
    imported coordinate to a mesh edge whose mid-point is within
    TOLERANCE of it. First documented by the 26.122 edition.

    THE ARGUMENT ORDER IS THE SIGNATURE'S AND THE SAMPLE'S, not the
    parameter table's, which lists TOLERANCE first. The signature
    and the printed call agree with each other on type then
    tolerance, and a table row order is not a call order.

    The four types are the same four SET_TRAILING_EDGE_TYPE takes,
    so this sets for a whole imported file what that command sets
    for one edge.
  versions:
    "26.122":
      status: documented
      note: "SRC-750 p.324, the first edition to document it"
