DETECT_LEADING_EDGES_WAKES_BY_SURFACE:
  layout: keyword_block
  phase: setup
  args:
    - name: surfaces
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
  manual_ref: "SRC-750 p.323"
  notes: >
    Runs wake detection on the LEADING edges of the listed surfaces,
    which is what a vortex-shedding wake needs and what the
    trailing-edge detection beside it does not do. First documented
    by the 26.122 edition.

    Its page describes the parameter as the count of surfaces
    checked for TRAILING edge detection, word for word the sentence
    on the trailing-edge command above it. Read as a copied sentence
    rather than as a statement about this command, since the
    function name and the section it sits in both say leading edges;
    nothing here rests on that sentence.
  versions:
    "26.122":
      status: documented
      note: "SRC-750 p.323, the first edition to document it"
    "26.123": {status: documented, note: "SRC-751 p.323, unchanged from SRC-750 p.323"}
    "26.124": {status: documented, note: "SRC-752 p.323, the SRC-751 file, carried from 26.123; not run on 26.124"}

IMPORT_WAKE_EDGES_FROM_FILE:
  layout: inline
  phase: setup
  args:
    - name: type
      type: enum
      values: [STANDARD, RELAXED, JET_OUTFLOW, VORTEX_SHEDDING]
    - name: tolerance
      type: float
      unit: "simulation length units"
  manual_ref: "SRC-750 p.324"
  notes: >
    Marks wake edges from an imported node list, matching an
    imported coordinate to a mesh edge whose mid-point is within
    TOLERANCE of it. First documented by the 26.122 edition.

    THE ARGUMENT ORDER IS THE SIGNATURE'S AND THE SAMPLE'S, not the
    parameter table's, which lists TOLERANCE first. The signature
    and the printed call agree with each other on type then
    tolerance, and a table row order is not a call order.

    The four types are the same four SET_TRAILING_EDGE_TYPE takes,
    so this sets for a whole imported file what that command sets
    for one edge.

    IT TAKES NO PATH, IN EITHER EDITION, AND THAT IS THE PAGE AND NOT
    A HOLE HERE. Both pages that document the command were read for
    this question, SRC-750 p.324 and SRC-751 p.323, and each prints a
    signature with two placeholders and a sample call with two values.
    Neither says where the node list comes from, on its own line, as a
    third argument, or through a prior command. The one command in
    this chapter that does take a path is TRAILING_EDGES_IMPORT, which
    carries it on the line after the command name, and its file format
    block is the one printed here; whether that file is also this
    command's input is exactly what neither edition states. Adding a
    file argument would be this database inventing a grammar, so the
    silence is recorded instead and the acceptance clause that asked
    for the argument goes back to the owning seat.

    THE TOLERANCE UNIT IS DERIVED AND PRINTED NOWHERE. The page
    describes a distance between a mesh edge mid-point and an imported
    node coordinate; both are expressed in the simulation's own length
    unit, so the tolerance can be in no other. Recorded on the
    precedent of SET_VERTEX_MERGE_TOLERANCE, whose unit is stated the
    same way and for the same reason.

    ITS DEFAULT IS THE VENDOR'S OWN NUMBER, 0.0001, which the
    parameter table states and the printed sample passes. It is
    recorded because a default without a stated basis is a number
    somebody later has to reverse engineer, and this one decides
    whether an edge is marked at all: too tight and edges go unmarked,
    too loose and the wrong edge is claimed.

    MEASURED ON 26.124 (RPT-061), where the build answers what the pages
    leave open, and only there. The two-value line the pages print is a
    syntax error that stops the script, the same line with the path
    after it is one too, and a path as the third token is read as the
    line after the command rather than as a file. The build reads the
    node list from the path on the NEXT line, and only when the command
    line carries a third token; the token is required, and METER and
    MILLIMETER marked the same edges, so it is not the unit of the
    coordinates. The file is the count, one coordinate triple the solver
    consumes and does not use, then the edge MID-POINTS in the
    simulation's length unit, with no unit line and no ids; a word on
    any line marks nothing, and so do the end vertices of the edges.
    Given the whole span of a straight wing it marks the edges angle
    detection marks, and a point farther than the tolerance from every
    edge mid-point marks nothing and logs nothing. So the 26.124 row
    states its own grammar, the two values plus the third token and the
    path on its own line, and 26.122 and 26.123 keep the printed line
    and are refused by the marking helper as unmeasured.

    VERIFIED ON 26.124 ONLY. The compat probe of 2026-09-24
    (CMP-26124_2026-09-24_wake-edge-import) imported the sixteen
    trailing-edge mid-points of the qa wing through the 26.124 grammar and
    the solver logged sixteen imported edges; the saved state after it
    carries the sixteen and the state before it none. On 26.122 and 26.123
    it stays documented: the two probe runs that reached those builds
    both NAME it and neither promotes it, each recording it unprobed for
    want of a probe specification, and the marking helper refuses the
    file route there as unmeasured. AUTO_DETECT_TRAILING_EDGES, the angle
    criterion it replaces for a geometry whose edges are not creases,
    carries verified rows on 26.101, 26.120 and 26.121, each with its own
    committed compat report. The reason for the trade is physical: on the
    one build where the route is offered it is now verified, and it is
    written down so a later reader does not take it for verified on the
    builds before.

    WHAT IT LEAVES TO THE INITIALISATION, MEASURED ON 26.124
    (reports/RPT-069_three-routes-to-one-body-and-the-file-routes-root-node_2026-09-24.md, T07). A twisted blade marked by this command, by
    AUTO_DETECT_TRAILING_EDGES and from its saved simulation carried the
    same twelve edges, and only this route solved 1.8 % below the other
    two in induced drag: its saved simulation carried no wake-termination
    node, where the other two carry the blade's root end. A wake-termination
    detection emitted between this command and INITIALIZE_SOLVER marks
    nothing, automatic or by surface; emitted after INITIALIZE_SOLVER it
    marks the node, and the solver uses it once INITIALIZE_SOLVER is
    repeated, which logs that the solution was cleared and the
    initialisation removed and initialises again. The loads then equal the
    other two routes' to the printed digit. The log reports the
    trailing-edge groups only during an initialisation, which is the
    inferred reason. The node file's row order changed nothing.
  versions:
    "26.122":
      status: documented
      note: "SRC-750 p.324, the first edition to document it"
    "26.123": {status: documented, note: "SRC-751 p.323, unchanged from SRC-750 p.324"}
    "26.124":
      status: verified
      report: "reports/compat/CMP-26124_2026-09-24_wake-edge-import.yaml"
      note: >-
        SRC-752 p.323 prints the two-value line of SRC-751; this build
        refuses that line as a syntax error, and reads the node list from
        the path on the next line only when the command line carries a
        third token (RPT-061). After it a wake-termination detection marks
        nothing until the solver has initialised, and a repeated
        INITIALIZE_SOLVER clears the first initialisation and initialises
        again (reports/RPT-069_three-routes-to-one-body-and-the-file-routes-root-node_2026-09-24.md, T07)
      args:
        - name: type
        - name: tolerance
        - name: units
          type: str
        - name: file
          type: path
          own_line: true
