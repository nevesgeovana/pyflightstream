AUTO_DETECT_WAKE_TERMINATION_NODES:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.321"
  versions:
    "26.000": {status: documented, note: "SRC-747 p.294, same grammar as 26.120"}
    "26.121": {status: documented, note: "SRC-740 p.324, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.316, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.320, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.123": {status: documented, note: "SRC-751 p.325, unchanged from SRC-750 p.325"}
    "26.124":
      status: documented
      note: >-
        SRC-752 p.325, the SRC-751 file, carried from 26.123. Ran on 26.124
        (reports/RPT-069_three-routes-to-one-body-and-the-file-routes-root-node_2026-09-24.md, T07): after IMPORT_WAKE_EDGES_FROM_FILE it marks
        nothing until the solver has initialised, and a repeated
        INITIALIZE_SOLVER clears the first initialisation and initialises
        again with the node it marked
  notes: >
    Finds and marks all wake termination nodes in the geometry.

    RAN ON 26.124 (reports/RPT-069_three-routes-to-one-body-and-the-file-routes-root-node_2026-09-24.md, T07), on a twisted blade whose root
    end is its one wake-termination node. Emitted after
    AUTO_DETECT_TRAILING_EDGES, the saved simulation carries that node.
    Emitted right after IMPORT_WAKE_EDGES_FROM_FILE, which marked the same
    twelve edges, it marks nothing and the saved simulation carries no
    node. Emitted after INITIALIZE_SOLVER it marks the node, and the loads
    do not move, since the solver was initialised without it; a second
    INITIALIZE_SOLVER after it logs that the solution was cleared and the
    initialisation removed, initialises again, and the loads then equal
    those of the saved simulation and of the detection route to the
    printed digit. The log reports the trailing-edge groups only during an
    initialisation, which is the inferred reason: the detection finds the
    ends of groups the file route has not created yet. So a workflow
    importing its edges from a file emits it between two initialisations
    with the same settings, and a setup command after INITIALIZE_SOLVER
    passes the phase order only through Script.emit_after_initialization.

SET_FREESTREAM:
  layout: inline
  phase: setup
  args:
    - name: type
      type: enum
      values: [CONSTANT, CUSTOM, ROTATION]
    - name: filetype
      type: enum
      values: [STRUCTURED, UNSTRUCTURED]
      required: false
    - name: frame
      type: int
      cites: frames
      required: false
    - name: axis
      type: enum
      values: [X, Y, Z]
      required: false
    - name: angular_velocity
      type: float
      unit: "rev/min"
      required: false
    - name: filename
      type: path
      required: false
      own_line: true
  manual_ref: "SRC-003 p.322"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.279, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.296, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.295, same grammar as 26.120"}
    "26.121": {status: documented, note: "SRC-740 p.325, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.317, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.321, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.123": {status: documented, note: "SRC-751 p.326, unchanged from SRC-750 p.326"}
    "26.124": {status: documented, note: "SRC-752 p.326, the SRC-751 file, carried from 26.123; the ROTATION form ran on 26.124 in reports/RPT-052_the-sense-of-a-rotating-free-stream_2026-09-15.md (TWO ROTATION points against one CONSTANT baseline, all three CONVERGED), which measured its SENSE and is not an acceptance of the other two forms; the CUSTOM STRUCTURED form ran on 26.124 under the licensed probe T14 (RPT-071): a uniform field of the row's own speed loaded as the CONSTANT free stream at 0 deg, a field sheared in z moved the lift, and SOLVER_SET_AOA did not turn the field at 4 deg; the CUSTOM UNSTRUCTURED form ran on 26.124 under the licensed probe T16 (RPT-077) and read the same rows as the STRUCTURED one, a field did not reach beyond its grid (closest to the free stream there), a field carrying the incidence loaded the body as that incidence with CL and CDi printed in the stated angle's axes, and a saved simulation kept its field until SET_FREESTREAM was given again"}
  notes: >
    CONSTANT needs no further input. CUSTOM appends a FILETYPE token
    (STRUCTURED or UNSTRUCTURED) and takes the profile file path on
    the next line. ROTATION appends frame index, axis (X, Y or Z) and
    angular velocity in RPM. Which optional arguments each type takes
    is conditional; the free_stream helper enforces the valid
    combinations (SRC-003 p.322).

