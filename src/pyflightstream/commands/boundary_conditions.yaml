SET_FREESTREAM:
  layout: inline
  phase: setup
  args:
    - name: type
      type: enum
      values: [CONSTANT, CUSTOM, ROTATION]
    - name: filetype
      type: enum
      values: [STRUCTURED, UNSTRUCTURED]
      required: false
    - name: frame
