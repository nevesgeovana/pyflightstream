TRAILING_EDGES_IMPORT:
  layout: inline
  phase: setup
  args:
    - name: file
      type: path
      own_line: true
  manual_ref: "SRC-003 p.319"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.276, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.293, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.292, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.314, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.318, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.322, same grammar as 26.120"}
    "26.124":
      status: removed
      successor: IMPORT_WAKE_EDGES_FROM_FILE
      probe_ref: "reports/RPT-061_where-the-wake-edge-import-reads-its-nodes_2026-09-23.md"
      note: >-
        Measured 2026-09-23: the 26.124 solver answers the name as an
        unrecognized command, with its file present and with it absent,
        and with end vertices or edge mid-points in the file; its edition
        stops printing the command, as SRC-751 did. Trailing edges are
        marked from a file on this build by IMPORT_WAKE_EDGES_FROM_FILE,
        whose file names edge mid-points rather than vertices (RPT-061)
  notes: >
    Marks trailing edges at vertices listed in a CSV file, the path on
    the next line. This is the exact route rather than the detection
    thresholds: the file names the vertices.

    The manual describes the file format, a vertex count, a unit token
    and then one line per vertex with an id and three coordinates. That
    is the content of a file this package does not write, so it is
    paraphrased here and nothing validates it. The unit line matters:
    the coordinates are read in the unit the file declares, not in the
    simulation's.

    THE NEWEST EDITION CONTRADICTS ITSELF ABOUT THIS COMMAND AND NO ROW
    IS WRITTEN FOR IT. SRC-751 p.323 is where the block used to open and
    the whole block is gone: that page carries the surviving neighbours,
    trailing-edge auto detection, detection by surface, the leading-edge
    wake detection and the wake-edge import, and prints this command
    nowhere. SRC-751 p.390, the Script Index, still lists it under the
    same chapter heading. So the chapter body and the index disagree,
    and this is the first recorded instance of the index OVER-reporting;
    the caution recorded until now ran the other way, that the index
    under-reports, which is why the surface is read from the body. The
    rule does not change and the body is still what is read.

    WHY THE ROW IS ABSENT RATHER THAN REMOVED. `removed` would be the
    nearest of the four statuses and it says more than the evidence
    does: no run has asked this build whether it still answers to the
    name, and an edition dropping a page is a fact about a document. So
    26.123 answers ABSENT, which the committed enumeration
    tests/tier1_offline/goldens/absent_on_26123.txt already records, and the reading
    lives here.

    THAT ENCODING IS NOW DECIDED rather than pending (decision of
    2026-08-19, PFS-2026.04): no version row, plus this note and the
    committed enumeration, and NO fifth member of the status set. A
    fifth member would be more expressive and would touch every consumer
    of the status, the census tables and the derived support levels
    included, for one command; and the state it would name, a page the
    vendor dropped, is a fact about a DOCUMENT rather than about the
    solver, which the four statuses are all about. The absence carries
    that distinction correctly and this paragraph carries the reason.

    26.124 WAS ASKED, AND ITS ROW IS REMOVED (RPT-061). Its edition is
    the SRC-751 file, so the document says what it says for 26.123; the
    run of 2026-09-23 is what differs, and the solver answered the name
    as an unrecognized command with a file present and absent. That is
    a fact about the solver, so the row is removed and cites the run.
    26.123 stays absent, because no run has asked that build.

