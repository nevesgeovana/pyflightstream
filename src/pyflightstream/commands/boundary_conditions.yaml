# Chapter: Scripting reference, Boundary Conditions families used by
# the core steady path: Trailing Edges (SRC-003 pp.319-320), Wake
# Termination Nodes (p.321), Free-Stream Velocity (p.322), Fluid
# Properties (p.328).

AUTO_DETECT_TRAILING_EDGES:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.319"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.314, same grammar as 26.120"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Finds and marks all trailing edge nodes in the geometry. Trailing
    edge marking controls where the wake is shed, so it must precede
    solver initialization.

SET_TRAILING_EDGE_TYPE:
  layout: inline
  phase: setup
  args:
    - name: te_index
      type: int
    - name: type
      type: enum
      values: [STANDARD, RELAXED, JET_OUTFLOW, VORTEX_SHEDDING]
  manual_ref: "SRC-003 pp.319-320"
  versions:
    "26.100":
      status: documented
      note: >-
        SRC-741 p.314. THREE types, not four: this edition closes the
        value set at JET_OUTFLOW and does not carry VORTEX_SHEDDING,
        which first appears as a type in the May edition. Checked
        against the wrapped-line failure mode that would fake it, with a
        positive control on 26.101 and a sweep of every page of this
        edition finding the token nowhere.
      args:
        - {name: te_index, type: int}
        - {name: type, type: enum, values: [STANDARD, RELAXED, JET_OUTFLOW]}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_savedstate2.yaml"}
    "26.101": {status: documented, note: "SRC-725 p.318, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    STANDARD sheds the full net circulation (Kutta factor 1.0);
    RELAXED sheds half, approximating body carryover at non-lifting
    trailing edges such as wing-fuselage junctions (SRC-003 p.164).

DISABLE_WAKE_NODES_ON_TRAILING_EDGE:
  layout: inline
  phase: setup
  args:
    - name: te_index
      type: int
  manual_ref: "SRC-003 p.320"
  versions:
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_savedstate2.yaml"}
    "26.101": {status: documented, note: "SRC-725 p.319, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.315, same grammar as 26.120"}
    "26.120": {status: documented}

AUTO_DETECT_WAKE_TERMINATION_NODES:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.321"
  versions:
    "26.121": {status: documented, note: "SRC-740 p.324, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.316, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.320, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Finds and marks all wake termination nodes in the geometry.

SET_FREESTREAM:
  layout: inline
  phase: setup
  args:
    - name: type
      type: enum
      values: [CONSTANT, CUSTOM, ROTATION]
    - name: filetype
      type: enum
      values: [STRUCTURED, UNSTRUCTURED]
      required: false
    - name: frame
      type: int
      cites: frames
      required: false
    - name: axis
      type: enum
      values: [X, Y, Z]
      required: false
    - name: angular_velocity
      type: float
      unit: "rev/min"
      required: false
    - name: filename
      type: path
      required: false
      own_line: true
  manual_ref: "SRC-003 p.322"
  versions:
    "26.121": {status: documented, note: "SRC-740 p.325, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.317, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.321, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    CONSTANT needs no further input. CUSTOM appends a FILETYPE token
    (STRUCTURED or UNSTRUCTURED) and takes the profile file path on
    the next line. ROTATION appends frame index, axis (X, Y or Z) and
    angular velocity in RPM. Which optional arguments each type takes
    is conditional; the free_stream helper enforces the valid
    combinations (SRC-003 p.322).

FLUID_PROPERTIES:
  layout: keyword_block
  phase: setup
  args:
    - name: density
      type: float
      unit: "kg/m^3"
    - name: pressure
      type: float
      unit: "Pa"
    - name: temperature
      type: float
      unit: "K"
    - name: viscosity
      type: float
      unit: "Pa s"
    - name: specific_heat_ratio
      type: float
  manual_ref: "SRC-003 p.328"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.324, same grammar as 26.120"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Sets the working fluid state as KEY VALUE lines. Sonic velocity is
    derived from temperature and specific heat ratio; it is no longer
    an independent input (SRC-003 p.328).

AIR_ALTITUDE:
  layout: inline
  phase: setup
  args:
    - name: value
      type: float
    - name: units
      type: enum
      values: [FEET, METERS]
  manual_ref: "SRC-003 p.328"
  versions:
    "26.100": {status: broken, report: "reports/compat/CMP-26100_2026-08-08_full.yaml", note: "the command ran (script processing continued past it) but its effect was not observed; expected: the settings dump reports the 5000 m [...]"}
    "26.101": {status: broken, report: "reports/compat/CMP-26101_2026-08-08_full.yaml", note: "the command ran (script processing continued past it) but its effect was not observed; expected: the settings dump reports the 5000 m [...]"}
    "26.120": {status: broken, report: "reports/compat/CMP-26120_2026-08-08_full.yaml", note: "the command ran (script processing continued past it) but its effect was not observed; expected: the settings dump reports the 5000 m [...]"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Sets the air properties from a standard-atmosphere altitude.

SONIC_VELOCITY:
  layout: inline
  phase: setup
  args:
    - name: value
      type: float
      unit: "m/s"
  manual_ref: "SRC-003 p.328"
  versions:
    "26.101": {status: removed, note: "Already deprecated in 26.1: the solver warns and ignores the value (SRC-725 p.327)."}
    "26.120":
      status: removed
      successor: null
      note: >
        No longer supported; the solver throws a deprecation warning
        and ignores the value. Sonic velocity now follows from
        temperature and specific heat ratio (SRC-003 p.328).

DETECT_TRAILING_EDGES_BY_SURFACE:
  layout: keyword_block
  phase: setup
  args:
    - name: surfaces
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
      separator: comma
  manual_ref: "SRC-003 p.319"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.314, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.318, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.322, same grammar as 26.120"}
  notes: >
    Runs trailing-edge detection on a named set of boundaries rather
    than the whole geometry, using the sweep and bluntness thresholds.
    The count sits on the SURFACES keyword line and the indices follow
    comma separated, the same shape as SURFACE_ROTATE.

    The manual gives the payload row no parameter name, describing it in
    prose as the line following SURFACES; the name here is this
    database's.

TRAILING_EDGES_IMPORT:
  layout: inline
  phase: setup
  args:
    - name: file
      type: path
      own_line: true
  manual_ref: "SRC-003 p.319"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.314, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.318, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.322, same grammar as 26.120"}
  notes: >
    Marks trailing edges at vertices listed in a CSV file, the path on
    the next line. This is the exact route rather than the detection
    thresholds: the file names the vertices.

    The manual describes the file format, a vertex count, a unit token
    and then one line per vertex with an id and three coordinates. That
    is the content of a file this package does not write, so it is
    paraphrased here and nothing validates it. The unit line matters:
    the coordinates are read in the unit the file declares, not in the
    simulation's.

DETECT_WAKE_TERMINATION_NODES_BY_SURFACE:
  layout: inline
  phase: setup
  args:
    - name: surface_id
      type: int
      cites: boundaries
  manual_ref: "SRC-003 p.321"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.316, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.320, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.324, same grammar as 26.120"}
  notes: >
    Detects wake termination nodes on one boundary, where
    AUTO_DETECT_WAKE_TERMINATION_NODES does the whole geometry. One
    boundary per call and no all-form is stated.

MARK_WAKE_TERMINATION_NODES:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.321"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.320, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.324, same grammar as 26.120"}
  notes: >
    Marks the currently SELECTED mesh nodes as wake termination nodes,
    which is the manual route where the two detection commands are the
    automatic ones. It takes nothing, so which nodes are marked comes
    entirely from the selection state left by SELECT_MESH_NODE.

    Absent from the February 2026 edition, so no 26.100 row.
