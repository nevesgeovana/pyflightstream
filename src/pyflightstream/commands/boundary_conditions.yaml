# Chapter: Scripting reference, Boundary Conditions families used by
# the core steady path: Trailing Edges (SRC-003 pp.319-320), Wake
# Termination Nodes (p.321), Free-Stream Velocity (p.322), Fluid
# Properties (p.328).

AUTO_DETECT_TRAILING_EDGES:
  layout: bare
  phase: setup
  args: []
  manual_ref: "SRC-003 p.319"
  versions:
    "26.000": {status: documented, note: "SRC-747 p.292, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.314, same grammar as 26.120"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.123": {status: documented, note: "SRC-751 p.323, unchanged from SRC-750 p.323"}
    "26.124": {status: documented, note: "SRC-752 p.323, the SRC-751 file, carried from 26.123; not run on 26.124"}
  notes: >
    Finds and marks all trailing edge nodes in the geometry. Trailing
    edge marking controls where the wake is shed, so it must precede
    solver initialization.

SET_TRAILING_EDGE_TYPE:
  layout: inline
  phase: setup
  args:
    - name: te_index
      type: int
    - name: type
      type: enum
      values: [STANDARD, RELAXED, JET_OUTFLOW, VORTEX_SHEDDING]
  manual_ref: "SRC-003 pp.319-320"
  versions:
    "26.000": {status: documented, note: "SRC-747 p.292, same grammar as 26.120"}
    "26.100":
      status: documented
      note: >-
        SRC-741 p.314. THREE types, not four: this edition closes the
        value set at JET_OUTFLOW and does not carry VORTEX_SHEDDING,
        which first appears as a type in the May edition. Checked
        against the wrapped-line failure mode that would fake it, with a
        positive control on 26.101 and a sweep of every page of this
        edition finding the token nowhere.
      args:
        - {name: te_index, type: int}
        - {name: type, type: enum, values: [STANDARD, RELAXED, JET_OUTFLOW]}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_savedstate2.yaml"}
    "26.101": {status: documented, note: "SRC-725 p.318, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "SRC-751 p.323, unchanged from SRC-750 p.324"}
    "26.124": {status: verified, report: "reports/compat/CMP-26124_2026-09-14_full-sim.yaml", note: "SRC-752 p.323, the SRC-751 file, carried from 26.123"}
  notes: >
    STANDARD sheds the full net circulation (Kutta factor 1.0);
    RELAXED sheds half, approximating body carryover at non-lifting
    trailing edges such as wing-fuselage junctions (SRC-003 p.164).

    THE RELAXED TRAILING EDGE IS ALSO SPECIFIED OUTSIDE THE SCRIPT, AND
    THE NEWEST EDITION ADDS A FIELD THERE. Paraphrasing SRC-751 p.85:
    relaxed-Kutta trailing edges can also be declared as a COMPONENT
    parameter, written where a component is defined rather than in a
    script, taking semicolon-separated fields; that edition gives it a
    fifth field where it had four, an integer direction of the relaxed
    wake shedding parameter line, 0 for the axial direction and the
    default, 1 for the azimuth direction. The first four fields are
    unchanged, a chordwise or radial location and two spanwise or axial
    bounds, so the four-field form stays valid and the change is
    additive. SRC-750 p.85 prints the four-field form, so this is a
    26.123 addition. The azimuth value is new control over the direction
    the relaxed wake sheds, which is what makes it a rotor fact and not
    a compatibility footnote.

    NO SCRIPTING COMMAND ON ANY REGISTERED BUILD TAKES THAT DIRECTION,
    and this paragraph exists so a reader does not go looking for a
    fourth argument here or for a new command elsewhere. This command
    takes two arguments on every build, an edge index and a type;
    IMPORT_WAKE_EDGES_FROM_FILE takes the same type vocabulary for a
    whole imported file; neither carries a direction. The direction is a
    field of the component specification, and this package writes no
    component file, so nothing here emits it. A writer for that
    specification is not implemented (PFS-2026.06).

    THE CITATION SITS IN THESE FREE-TEXT NOTES ON PURPOSE. Page 85 lies
    outside the registered scripting-reference range, which is where an
    evidence citation must point, so a manual_ref or a per-version note
    carrying it would be wrong twice: wrong about where the fact is, and
    wrong about what kind of fact it is. No status, no manual_ref and no
    version row moved for this reading, because nothing in it is a claim
    about the solver.

