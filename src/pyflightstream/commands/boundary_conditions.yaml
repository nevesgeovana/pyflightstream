AIR_ALTITUDE:
  layout: inline
  phase: setup
  args:
    - name: value
      type: float
    - name: units
      type: enum
      values: [FEET, METERS]
  manual_ref: "SRC-003 p.328"
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.286, this edition's own grammar; see the note below"
      args:
        - name: value
          type: float
          unit: "ft"
    "25.100": {status: documented, note: "SRC-748 p.302, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.301, same grammar as 26.120"}
    "26.100": {status: broken, report: "reports/compat/CMP-26100_2026-08-08_full.yaml", note: "the command ran (script processing continued past it) but its effect was not observed; expected: the settings dump reports the 5000 m [...]"}
    "26.101": {status: broken, report: "reports/compat/CMP-26101_2026-08-08_full.yaml", note: "the command ran (script processing continued past it) but its effect was not observed; expected: the settings dump reports the 5000 m [...]"}
    "26.120": {status: broken, report: "reports/compat/CMP-26120_2026-08-08_full.yaml", note: "the command ran (script processing continued past it) but its effect was not observed; expected: the settings dump reports the 5000 m [...]"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
  notes: >
    Sets the air properties from a standard-atmosphere altitude.

    THE 25.000 GRAMMAR TAKES A BARE VALUE AND THAT VALUE IS IN FEET.
    SRC-749 p.286 states it on the parameter row itself, altitude in
    feet units, with no units token to pass; SRC-748 p.302 introduces
    the second argument and the FEET or METERS choice with it. So the
    same call means different things on either side of that boundary,
    by a factor of 3.28, and the number alone cannot say which.

    Read the three broken rows beside that, and read them for what they
    actually record. All three say the same thing: the command ran and
    the expected density was not observed. ONE of them, 26.120, has a
    reading behind it, 1.056 against the 0.736 expected, which is the
    5000 FOOT standard state and was seen twice on build 7012026
    (RPT-014). On 26.100 and 26.101 the probe recorded only that the
    expected value was absent.

    An earlier version of this note said all three recorded 1.056. They
    do all CARRY that sentence, because it is the probe spec's static
    effect_note rather than a per-run reading, and the same sentence
    appears in 26.121's row under outcome verified, which is the proof
    that it is boilerplate. Whether those builds read every altitude in
    feet is a question about three solvers, and it now needs the
    density read back on 26.100 and 26.101 as well as 26.120
    (PLN-20260810-2000).

SONIC_VELOCITY:
  layout: inline
  phase: setup
  args:
    - name: value
      type: float
      unit: "m/s"
  manual_ref: "SRC-003 p.328"
  versions:
    "26.101": {status: removed, note: "Already deprecated in 26.1: the solver warns and ignores the value (SRC-725 p.327)."}
    "26.120":
      status: removed
      successor: null
      note: >
        No longer supported; the solver throws a deprecation warning
        and ignores the value. Sonic velocity now follows from
        temperature and specific heat ratio (SRC-003 p.328).

DETECT_TRAILING_EDGES_BY_SURFACE:
  layout: keyword_block
  phase: setup
  args:
    - name: surfaces
      type: int
    - name: surface_indices
      type: int_list
      cites: boundaries
      separator: comma
  manual_ref: "SRC-003 p.319"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.276, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.293, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.292, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.314, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.318, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.322, same grammar as 26.120"}
  notes: >
    Runs trailing-edge detection on a named set of boundaries rather
    than the whole geometry, using the sweep and bluntness thresholds.
    The count sits on the SURFACES keyword line and the indices follow
    comma separated, the same shape as SURFACE_ROTATE.

    The manual gives the payload row no parameter name, describing it in
    prose as the line following SURFACES; the name here is this
    database's.

TRAILING_EDGES_IMPORT:
  layout: inline
  phase: setup
  args:
    - name: file
      type: path
      own_line: true
  manual_ref: "SRC-003 p.319"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.276, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.293, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.292, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.314, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.318, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.322, same grammar as 26.120"}
  notes: >
    Marks trailing edges at vertices listed in a CSV file, the path on
    the next line. This is the exact route rather than the detection
    thresholds: the file names the vertices.

    The manual describes the file format, a vertex count, a unit token
    and then one line per vertex with an id and three coordinates. That
    is the content of a file this package does not write, so it is
    paraphrased here and nothing validates it. The unit line matters:
    the coordinates are read in the unit the file declares, not in the
    simulation's.

DETECT_WAKE_TERMINATION_NODES_BY_SURFACE:
  layout: inline
  phase: setup
  args:
    - name: surface_id
      type: int
      cites: boundaries
  manual_ref: "SRC-003 p.321"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.278, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.295, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.294, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.316, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.320, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.324, same grammar as 26.120"}
  notes: >
    Detects wake termination nodes on one boundary, where
