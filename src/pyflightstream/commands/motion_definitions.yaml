    enum arguments, the same convention as the per-surface lines of
    INITIALIZE_SOLVER, so the pairing of a name with a toggle is the
    caller's to get right and this database records the shape. The
    LENGTH is refused, because the manual fixes it at six and nothing
    counts the lines, so a short payload would make the solver read the
    next command as data. The CONTENT is not: six lines naming the same
    variable twice, or misspelling one, still emit.

