  notes: >
    A spring attached to the body. ELEVEN arguments, and the manual's
    heading WRAPS with SPRING_RATE alone on the second line, which is
    one of the five wrapped signatures in the scripting reference.

    Three lengths and none of them interchangeable. FREE_LENGTH is where
    the spring stops pushing, beyond which it applies no force at all;
    SOLID_LENGTH is the fully compressed length it cannot pass; and
    INITIAL_LENGTH is where it starts. All three must be greater than
