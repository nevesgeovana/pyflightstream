# Chapter: Scripting reference, Motion Definitions (FSM-26.120 pp.332-336).
#
# Includes rotary motion, the FSI seam (FR-23), 6DOF, custom motion
# tables and the five kinematic commands specific to the February edition.
#
# THREE COORDINATE SYSTEMS APPEAR IN THIS CHAPTER AND NOTHING IN AN
# ARGUMENT NAME SAYS WHICH. SET_MOTION_GRAVITY reads the REFERENCE
# system; the 6DOF initial conditions and the external and spring
# forces read the BODY frame; and the February kinematic family reads
# the MOTION DEFINITION system. A script that sets gravity and an
# initial velocity is writing two vectors into two different frames.

CREATE_NEW_MOTION:
  layout: inline
  phase: setup
  args:
    - name: type
      type: enum
      values: [ROTARY, 6DOF, CUSTOM]
  manual_ref: "FSM-26.120 p.332"
  versions:
    "25.100":
      status: documented
      note: >-
        FSM-25.100 p.306 documents the February form, type EUCLIDEAN, in its
        parameter table and its sample alike.
      args:
        - name: type
          type: enum
          values: [EUCLIDEAN, 6DOF, CUSTOM]
    "26.000":
      status: documented
      note: >-
        FSM-26.000 p.305 documents the February form, type EUCLIDEAN, in its
        parameter table and its sample alike.
      args:
        - name: type
          type: enum
          values: [EUCLIDEAN, 6DOF, CUSTOM]
    "26.121": {status: documented, note: "FSM-26.121 p.335, same grammar as 26.120"}
    "26.100":
      status: documented
      note: >-
        FSM-26.100 p.328 documents the same one-argument signature with a
        different first token: the February 2026 edition calls that
        motion type EUCLIDEAN, and its parameter table and its sample
        agree with each other on it.
      args:
        - name: type
          type: enum
          values: [EUCLIDEAN, 6DOF, CUSTOM]
    "26.101": {status: documented, note: "FSM-26.101 p.331, the first edition naming the type ROTARY"}
    "26.120": {status: documented}
    "26.123": {status: documented, note: "FSM-26.123 p.337, unchanged from FSM-26.122 p.337"}
    "26.124": {status: documented, note: "FSM-26.124 p.337, the FSM-26.123 file, carried from 26.123; not run on 26.124"}
    "26.125": {status: documented, note: "FSM-26.125 p.344, unchanged from FSM-26.124 p.337"}
  notes: >
    Rotary motion is the blade-resolved alternative to the actuator
    disc surrogate (FSM-26.120 p.234); it requires the unsteady solver.

    The February 2026 build, and 25.100 and 26.000 before it, call this
    motion type EUCLIDEAN and every later edition calls it ROTARY, which
    is why those three override the grammar above rather than sharing it. The rename is not a relabel of
    one capability: 26.100's Euclidean motion is a general rigid-body
    kinematic motion set by velocity, angular velocity and their
    accelerations (FSM-26.100 pp.228, 329), and the later Rotary motion is
    rotation alone, set by axis and RPM (FSM-26.101 p.234). Four commands
    that configure the February form
    (SET_MOTION_VELOCITY, SET_MOTION_ACCELERATION,
    SET_MOTION_ANGULAR_VELOCITY, SET_MOTION_ANGULAR_ACCELERATION) exist
    in no later edition, and SET_MOTION_ROTOR_AXIS and
    SET_MOTION_ROTOR_RPM exist in no earlier one. Emitting the later
    vocabulary onto a February script would name a type that build has
    never heard of.

SET_MOTION_BOUNDARIES:
  layout: payload_lines
  phase: setup
  args:
    - name: motion_id
      type: int
      cites: motions
    - name: num_boundaries
      cites: null
      type: int
    - name: boundary_indices
      type: int_list
      cites: boundaries
      required: false
  manual_ref: "FSM-26.120 p.332"
  versions:
    "25.000": {status: documented, note: "FSM-25.000 p.291, same grammar as 26.120"}
    "25.100": {status: documented, note: "FSM-25.100 p.306, same grammar as 26.120"}
    "26.000": {status: documented, note: "FSM-26.000 p.305, same grammar as 26.120"}
    "26.121": {status: documented, note: "FSM-26.121 p.335, same grammar as 26.120"}
    "26.100": {status: documented, note: "FSM-26.100 p.328, same grammar as 26.120"}
    "26.101": {status: documented, note: "FSM-26.101 p.331, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.123": {status: documented, note: "FSM-26.123 p.337, unchanged from FSM-26.122 p.337"}
    "26.124": {status: documented, note: "FSM-26.124 p.337, the FSM-26.123 file, carried from 26.123; not run on 26.124"}
    "26.125": {status: documented, note: "FSM-26.125 p.344, unchanged from FSM-26.124 p.337"}
  notes: >
    Assigns geometry boundaries to the motion; the comma-separated
    index line follows. NUM_BOUNDARIES -1 selects all boundaries and
    takes no index line.

