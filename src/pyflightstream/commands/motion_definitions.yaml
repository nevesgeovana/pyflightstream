    "26.125": {status: verified, report: "reports/compat/CMP-26125_2026-10-12_6dof-after-march.yaml", note: "FSM-26.125 p.347, unchanged from FSM-26.124 p.340"}
  notes: >
    Writes a motion's trajectory tables to a file, the path on the
    following line.

    Its phase is EXPORT: the trajectory exists only once the march has
    run. Exported in the setup phase, before the march, the file holds its
    header and no row on 26.124 and 26.125 (470 bytes after a 20-step
    march); exported after the march it holds the rows (probes P4-04 and
    P4-04m, GEO-106-PYFLIGHTSTREAM-INTERNAL-REPORTS/reports/RPT-166_command-gap-probes-second-round_2026-10-12.md
    section 3 and section 5). The unit of the columns is not settled by the
    probes (RPT-166 P4), and the package does not convert them.

    The fresh after-march verification on both builds is recorded in
    GEO-106-PYFLIGHTSTREAM-INTERNAL-REPORTS/reports/RPT-167_6dof-trajectory-export-after-march_2026-10-12.md;
    each scoped compat report cites its rows and orchestrator verdicts.

