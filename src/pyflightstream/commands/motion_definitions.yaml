SET_MOTION_SLIPSTREAM_WAKE_STABILIZATION:
  layout: inline
  phase: setup
  args:
    - name: motion_id
      type: int
      cites: motions
    - name: wake_stabilization
      type: enum
      values: [ENABLE, DISABLE]
    - name: num_blades
      cites: null
      type: int
  manual_ref: "FSM-26.120 p.333"
  versions:
    "26.100":
      status: documented
      note: >-
        FSM-26.100 pp.329-330 documents a TWO-argument form: the February
        2026 edition has no NUM_BLADES, and the blade count arrives with
        the rotary motion in the May edition.
      args:
        - name: motion_id
          type: int
          cites: motions
        - name: wake_stabilization
          type: enum
          values: [ENABLE, DISABLE]
    "26.101": {status: documented, note: "FSM-26.101 p.332, the first edition with NUM_BLADES"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "FSM-26.121 p.336, same grammar as 26.120"}
    "26.123": {status: documented, note: "FSM-26.123 p.338, unchanged from FSM-26.122 p.338"}
    "26.124":
      status: documented
      note: >-
        FSM-26.124 p.338, the FSM-26.123 file, carried from 26.123. Run on 26.124
        by the licensed probe round 1 (probe W1_wake_stab_disable):
        the arguments 1 DISABLE 1 after 1 ENABLE 1 were accepted and the two saved
        simulations differed; the status stays documented until a dated run
        report promotes it.
    "26.125": {status: verified, report: "reports/compat/CMP-26125_2026-10-05_probe-campaign.yaml", note: "FSM-26.125 p.345, unchanged from FSM-26.124 p.338"}
  notes: >
    Stabilizes the slipstream wake of a rotor motion. NUM_BLADES is per
    PROPELLER rather than a total across the motion, which the manual
    states.

    The February 2026 edition takes two arguments and not three, so
    26.100 overrides the grammar rather than sharing it. Emitting the
    blade count onto a February script would pass an argument that build
    does not read.

