# --- the February 2026 kinematic family -------------------------------------
#
# FSM-26.100 documents a motion whose velocity, acceleration and their
# angular counterparts are SET DIRECTLY, and no later edition carries
# any of the five commands below. That is the same rename recorded on
# CREATE_NEW_MOTION: February's EUCLIDEAN motion is a general rigid-body
# kinematic motion and May's ROTARY is rotation alone, set by axis and
# RPM, so these five have no successor rather than a renamed one.
#
# Their placeholders carry a TYPE as well as a name in that edition,
# written as <FLOAT vx> and <INTEGER motion_ID>. The type is the
# manual's own annotation and not part of the token, so the argument
# names here are the names alone.

SET_MOTION_VELOCITY:
  layout: inline
  phase: setup
  args:
    - name: motion_id
      type: int
      cites: motions
    - name: vx
      type: float
    - name: vy
      type: float
    - name: vz
      type: float
  manual_ref: "FSM-26.100 p.329"
  versions:
    "25.000": {status: documented, note: "FSM-25.000 p.292, same grammar as 26.100"}
    "25.100": {status: documented, note: "FSM-25.100 p.307, same grammar as 26.100"}
    "26.000": {status: documented, note: "FSM-26.000 p.306, same grammar as 26.100"}
    "26.100": {status: documented}
  notes: >
    Velocity vector of a February 2026 Euclidean motion, in the MOTION
    DEFINITION coordinate system. That is a third frame in this chapter:
    SET_MOTION_GRAVITY reads the reference system and the 6DOF initial
    conditions read the body frame, so three neighbouring commands take
    a vector in three different places and none of the argument names
    says which.

SET_MOTION_ACCELERATION:
  layout: inline
  phase: setup
  args:
    - name: motion_id
      type: int
      cites: motions
    - name: ax
      type: float
    - name: ay
      type: float
    - name: az
      type: float
  manual_ref: "FSM-26.100 p.329"
  versions:
    "25.000": {status: documented, note: "FSM-25.000 p.292, same grammar as 26.100"}
    "25.100": {status: documented, note: "FSM-25.100 p.307, same grammar as 26.100"}
    "26.000": {status: documented, note: "FSM-26.000 p.306, same grammar as 26.100"}
    "26.100": {status: documented}
  notes: >
