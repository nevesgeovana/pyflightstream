# Ordered FlightStream version list, the sole ordering authority
# (CONTRIBUTING.md invariant 4). Never drop a registered version; insert
# entries in vendor release order even when an older build is obtained later.
# canonical uses YY.XXX, with the last digit indexing vendor hotfix builds.
# alias is the vendor-facing release name.
# build is the solver's printed build number without '#', admitted only from
# a committed report's solver_identity. It is optional: registration must
# precede the identity run, which refuses unregistered versions.
# prints is the solver's own release name from that identity report, not an
# alias-derived value. Neither alias nor prints necessarily separates builds.
#
# A version row carries no licence. Evidence lookup, promotion and refusal
# use canonical version alone, so a relicensed binary may retain verified
# rows even if its seat refuses a capability.
# pyflightstream.qa.compat.licence_sensitive_candidates derives measured
# rows potentially affected by a licence change, grouped by chapter and
# citing their reports. Documented rows rest on manual pages, which a licence
# does not change. The owning seat decides which candidates to re-measure;
# licence-dependent evidence belongs in the command's notes with its reason.
# Executable hashes identify bytes, not licence capabilities:
# reports/RPT-032_executable-identity-baseline_2026-08-19.md answers only the
# first question. Identical bytes can behave differently under two seats.

versions:
  # Register older builds in release order without dropping entries.
  # 25.000 and 25.100 support reproduction of published work; 26.000 maintains
  # series continuity. RPT-023 measures one-dash -script on all seven tested
  # builds; the two-dash form documented by FSM-26.120 fails on the 25 series.
  # An unrecognised argument can leave a licensed solver waiting without a
  # script; -hidden with redirected streams can produce severe(30) on CONOUT$
  # and a modal dialog. An empty log does not prove solver failure, and licence
  # checkout does not prove the script was reached.
  - canonical: "25.000"
    alias: "25.0"
    # reports/compat/CMP-25000_2026-08-09_identity.yaml
    # The banner identifies release 25.0, build 12162024. FSM-25.000 is the
    # reproducibly paginated conversion of this install's CHM manual; see its
    # manual_editions entry.
    build: "12162024"
    prints: "25.0"
    # The 25 series checks out an EDU licence rather than the full
    # feature set: the banner reports the feature and Altair units
    # checkouts unavailable and the EDU checkout successful. What an EDU
    # seat may refuse is not yet measured, so a validity sweep of this
    # build is not simply the 26.1 sweep pointed elsewhere.
    #
    # NOTHING RESTS ON THAT UNKNOWN TODAY, which is worth stating because
    # the caveat reads heavier than it is: this build carries no measured
    # row at all, so `licence_sensitive_candidates("25.000")` is empty and
    # there is no verified status here for an EDU refusal to falsify. The
    # unknown blocks a sweep from being trusted in advance; it does not
    # sit under evidence already published. See the header note above for
    # the general rule and for which half of it is mechanical.
  - canonical: "25.100"
    alias: "25.1"
    # reports/compat/CMP-25100_2026-08-09_identity.yaml
    build: "5062025"
    prints: "25.1"
  - canonical: "26.000"
    alias: "26.0"
    # reports/compat/CMP-26000_2026-08-09_identity.yaml
    #
    # First build that accepts BOTH spellings of the script argument, so
    # the boundary that RPT-023 measured falls between 25.100 and this
    # entry rather than at a series edge.
    build: "10202025"
    prints: "26.0"
  # 26.100 denotes build 2122026; 26.101 denotes build 5012026. Evidence
  # labelled 26.100 before 2026-08-04 can refer to the latter; read the report's
  # identity rather than inferring it from a filename. Registry build numbers
  # must match committed solver_identity records (test_results), not merely
  # an ad-hoc banner transcription such as RPT-018.
  - canonical: "26.100"
    alias: "26.1"
    # reports/compat/CMP-26100_2026-08-09_identity.yaml
    #
    # The banner names release 26.1 at build 2122026, agreeing with
    # RPT-018 and with the recorded log of the build the AIAA AVIATION 2026
    # paper was written on.
    build: "2122026"
    prints: "26.1"
  - canonical: "26.101"
    alias: "26.1"
    # GEO-106-PYFLIGHTSTREAM-INTERNAL-REPORTS/reports/physics/PHY-26100_2026-07-21_smi01-triage-rerun.yaml, whose
    # fs_version reads 26.101 since the renumbering. The file name keeps
    # its original id because ids are cited elsewhere, so the stem and
    # the version it records deliberately disagree here; the report's own
    # dated banner says so.
    build: "5012026"
    prints: "26.1"
    # NOT a hotfix of 26.100, although it sits at a hotfix index. 26.100
    # is the February 2026 build and this is the May one: two releases
    # the vendor shipped under the one name "26.1", with different
    # manuals (396 pages against 409) describing different command sets.
    # Inheriting 26.100's records made the emitter write the February
    # flow-separation family on a May script, which that solver reports
    # as deprecated and then refuses (RPT-018). The index is an ordering
    # position, not a claim of descent.
    inherits_base: false
  - canonical: "26.120"
    alias: "26.12"
    # reports/compat/CMP-26120_2026-07-21_full.yaml
    build: "7012026"
    prints: "26.1"
  # The vendor ships this hotfix build under the SAME release name as
  # 26.120, so the alias below is deliberately NOT unique. Recording the
  # vendor's own name is the point; the ambiguity is refused at
  # resolution time (versions.resolve), not hidden here.
  - canonical: "26.121"
    alias: "26.12"
    # reports/compat/CMP-26121_2026-08-02_full.yaml
    build: "7262026"
    prints: "26.1"
    # A real hotfix of 26.120: same release, one manual re-issue apart
    # (413 pages against 410, every FSM-26.120 page shifted by +3), so a
    # command 26.120 records and this build does not re-probe is
    # genuinely the same command. The compatibility matrix marks every
    # inherited cell and counts them, so the assumption is visible
    # wherever it is used.
    inherits_base: true

  - canonical: "26.122"
    alias: "26.12"
    # reports/compat/CMP-26122_2026-08-10_identity.yaml
    #
    # The banner names release 26.1 at build 8092026, read from the log
    # of an identity probe on the licensed machine the day after the
    # build was issued.
    build: "8092026"
    prints: "26.1"
    # The second hotfix of the same 26.12 release, and the descent is
    # asserted from evidence rather than from the last digit, which is
    # what the 26.100 and 26.101 pair taught. Four things agree: the
    # vendor sells it as 26.12, the executable it ships is named for
    # 26.12, the solver prints 26.1 exactly as the other two do, and the
    # three build numbers are one release six weeks apart (1 July, 26
    # July, 9 August 2026). 26.101 has none of that: it is an
    # independent May release that took the next free index.
    #
    # Its own edition stops printing seven commands 26.120 prints, and
    # inheritance grants THREE of them, which is the number to read
    # rather than seven: four carry an explicit removed row. Two of the
    # four were re-spelled in this same edition and name their
    # successor; the other two were MEASURED on 26.121, one refused
    # outright and one aborting script processing, and inheritance from
    # the base would have handed this build the opposite answer from the
    # only measurements the 26.12 line has.
    #
    # THAT ASYMMETRY IS NOT SETTLED. The remaining three rest on the
    # same evidence class as the four, an edition going quiet, and are
    # emitted while the four are refused. An edition going quiet is a
    # fact about a document and a hotfix manual is a re-issue, which is
    # the reading that leaves them emittable; a probe on this build is
    # what would replace the reading with a measurement, and none has
    # run. Registered as PLN-20260810-1600 for the owning seat.
    #
    # Inheritance runs from the BASE and not from the sibling, so the
    # six commands 26.121 added over 26.120 do NOT reach here by
    # descent. They carry their own rows below.
    inherits_base: true

  - canonical: "26.123"
    alias: "26.12"
    # reports/compat/CMP-26123_2026-08-17_identity.yaml
    # Third hotfix of 26.12. The report records release 26.1, build 8112026,
    # invoked as FlightStream_26123.exe; its installer name is
    # Flightstream_2612.exe. build and prints require committed identity evidence,
    # so registration precedes the run that supplies them.
    build: "8112026"
    prints: "26.1"
    #
    # INHERITS NOTHING, and this is the first build in the family for
    # which that is written. 26.121 and 26.122 both descend from 26.120,
    # on evidence rather than on the last digit, and the default is
    # right for them. Here the recorded instruction is the opposite and
    # the reason is a number: with descent on, a build issued the day
    # before would answer for every command 26.120 records without one
    # page of its own manual being read or one line being run, and the
    # compatibility matrix would print a full column on the strength of
    # it. Off, every command answers ABSENT until it has a row of its
    # own, so the build claims support for what was measured or read on
    # IT. The cost is stated where a user meets it: a script emitting a
    # command with no 26.123 row is refused rather than emitted, and
    # tests/tier1_offline/goldens/absent_on_26123.txt is the enumeration of what that
    # covers at each commit.
    inherits_base: false
  - canonical: "26.124"
    alias: "26.12"
    # reports/compat/CMP-26124_2026-09-14.yaml
    # Fourth hotfix of 26.12. The identity report records release 26.1, build
    # 8172026, invoked as Flightstream_26124.exe.
    build: "8172026"
    prints: "26.1"
    #
    # ITS DOCUMENTATION IS THE 26.123 DOCUMENTATION, measured rather than
    # assumed: the manual in its package is byte-identical to FSM-26.123 (one
    # sha256, 417 pages, one creation date), and so are the release notes,
    # the EULA, the three libraries and the sample script. Only the
    # executable differs. The digests of every file of both packages are in
    # GEO-106-PYFLIGHTSTREAM-INTERNAL-REPORTS/reports/RPT-050_the-26124-package-against-26123_2026-09-15.md. So its
    # documented rows are carried forward from
    # 26.123 citing FSM-26.124, and nothing is inherited from the 26.120 base:
    # a build is answered for by what was read or run on IT, and what was
    # read for it is 26.123's text.
    inherits_base: false
  - canonical: "26.125"
    alias: "26.12"
    # Fifth hotfix of 26.12 (FR-423). build and prints come from solver footers
    # in GEO-106-PYFLIGHTSTREAM-INTERNAL-REPORTS/reports/probes/RPT-160_2026-10-05_evidence.yaml.
    # That evidence covers six 26.124-campaign points solved on 26.125. Its
    # footer says Simcenter Flightstream, version 2612 and build 10052026; these
    # are formatted at run time rather than literal executable strings. The
    # pyfs-qa probe --identity-only report must agree with these fields.
    build: "10052026"
    prints: "2612"
    #
    # UNLIKE 26.124, ITS MANUAL IS A NEW EDITION (FSM-26.125, 425 pages
    # against 417): the release notes, the EULA, the three libraries and
    # the sample script are byte-identical to the 26.124 package, and the
    # manual and the executable are the two files that differ. Its rows
    # are therefore read from FSM-26.125 itself: carried forward from 26.124
    # where the two editions describe a command identically, read anew
    # where they do not, and absent where FSM-26.125 stops documenting the
    # command (the manual_editions entry below lists those).
    #
    # COMPATIBILITY NOTE, MEASURED (PFS-2131.001, reports/physics/
    # PHY-26125_2026-10-16_build-difference-against-26124.md): for identical
    # inputs, the native CL on this build is 5.1 to 5.3 percent lower than on
    # 26.124 build 8172026 at 0, 4 and 8 degrees of the local wing case, and
    # its total drag 10.8 to 15.0 percent higher. A property of the solver
    # build, not of the package; the package does not compensate for it.
    inherits_base: false

# Each edition states two inclusive ranges: pages carrying scripting
# signature headings, and the contiguous Script Index pages parsed for
# command lines. test_command_db checks that citations lie within the
# registered range. Edition-specific notes qualify comparisons and page
# identity; do not infer identical ranges from a shared vendor release name.
manual_editions:
  "25.000": >
    FSM-25.000: Altair FlightStream User Guide, 25.0 edition, 342 pages,
    scripting reference pp.252-337 with its Script Index at pp.338-341;
    cited in version notes as "FSM-25.000 p.N".

    READ THIS BEFORE CITING A PAGE OF IT, because this edition is the
    one document here that the vendor did not paginate. The 25.000
    install ships its manual only as a compiled HTML help archive, which
    has topics and no pages, so a page citation against it would have
    been a number nobody wrote. The pdf is a CONVERSION, produced by
    scripts/chm_to_pdf.py from the extracted archive, and its page
    numbers are citable only because that script is deterministic: the
    topic order is the archive's own table of contents rather than a
    choice, the geometry is pinned, and the timestamps the renderer
    embeds are stripped, so two runs give byte-identical output. The
    committed pages are md5 4F4130513BB881DF51BEC47C26A4BDE2, 10780659
    bytes, rendered by Chrome 151.0.7922.76. Re-render with a different
    renderer and the page numbers move; the script prints the hash so
    the difference is visible rather than silent.

    The conversion keeps signatures together, places each heading label
    and command on one line, and excludes margin glyphs and generator
    footers from command samples. Those constraints prevent layout text
    from becoming a parsed argument or displacing a citation. All 272
    commands the archive documents are read from the PDF by
    pyflightstream.utils.manual; `pyfs-manual citations` checks the cited pages.
  "25.100": >
    FSM-25.100: Altair FlightStream User Guide, 25.1 edition (local,
    also shipped inside _private/exe/FlightStream_25100/), 361 pages,
    scripting reference pp.271-347 with its Script Index at pp.348-352;
    cited in version notes as "FSM-25.100 p.N".
  "26.000": >
    FSM-26.000: Altair FlightStream User Guide, 26.0 edition (local,
    also shipped inside _private/exe/FlightStream_26000/), 360 pages,
    scripting reference pp.270-346 with its Script Index at pp.347-351;
    cited in version notes as "FSM-26.000 p.N". NOT the same document as
    FSM-26.100 despite both being called a User Guide for a 26 series
    build: that one is 396 pages and belongs to the build that prints
    26.1.
  "26.100": >
    FSM-26.100: Altair FlightStream User Guide, 26.1 February 2026 edition
    (local, _private/exe/FlightStream_26100/), 396 pages, scripting
    reference pp.275-369 with its Script Index at pp.370-376; cited in version
    notes as "FSM-26.100 p.N". NOT interchangeable with FSM-26.101 below: they
    are different editions of the same vendor release name, and no page
    citation carries between them.
  "26.101": >
    FSM-26.101: Altair FlightStream User Manual, 26.1 May 2026 edition
    (local, _private/exe/FlightStream_26101/), 409 pages, scripting
    reference pp.280-375 with its Script Index at pp.376-382; cited in version
    notes as "FSM-26.101 p.N". This is the edition every FSM-26.101 citation
    in this database addresses. Historical evidence naming this installation
    as 26.100 must be resolved by build identity, not by its filename.
  "26.120": >
    FSM-26.120: Altair FlightStream User Manual v2612 (local,
    _private/manual/), 410 pages, scripting reference pp.281-376 with its
    Script Index at pp.377-383; cited in version notes as "FSM-26.120 p.N".
    This is the flagship edition and the one an unqualified page citation
    in this database means.
  "26.121": >
    FSM-26.121: Altair FlightStream User Manual, 26.12 hotfix build 1
    edition (local, _private/exe/FlightStream_26121/), 413 pages against
    410 for FSM-26.120, scripting reference pp.284-379 with its Script Index
    at pp.380-386. Every page
    citation of FSM-26.120 shifts by +3 in this edition, so an FSM-26.120
    page number does NOT address the same page here; that is why the
    two are separate sources rather than one re-issue. The vendor
    release-notes pdf is byte-identical between the two installs and
    documents none of the difference (RPT-014).
  "26.122": >
    FSM-26.122: Altair FlightStream User Guide, 26.12 hotfix build 2
    edition, 417 pages, scripting reference pp.283-383 with its Script
    Index at pp.384-390; cited in version notes as "FSM-26.122 p.N".
    It documents 372 commands against 364 for the edition before it, and
    the growth is not all new capability: two of the ten it gains stand
    where a command it stops printing stood. SURFACE_ROTATE gives way to
    ROTATE_SURFACE and SET_TRAILING_EDGE_BLUNTNESS_ANGLE to
    SET_GEOMETRIC_EDGE_BLUNTNESS_ANGLE. Neither pair is a rename in the
    sense of one entry gaining a name: the rotation command changes
    layout and loses two options in the move, so each is entered
    separately and each says what it stands next to.

    FSM-26.123
    deletes the TRAILING_EDGES_IMPORT block from the chapter body and
    renames SET_OUTFLOW_TRAILING_EDGES to SET_OUTLET_TRAILING_EDGES in
    place, so it documents one command FEWER, not more: 371 against 372,
    counted by this package's own reader over both editions rather than
    by hand.
  "26.123": >
    FSM-26.123: Altair FlightStream User Guide, 26.12 hotfix build 3
    edition, 417 pages, scripting reference pp.283-383 with its Script
    Index at pp.384-390; cited in version notes as "FSM-26.123 p.N".
    Both this edition and FSM-26.122 are 417 pages and
    every page outside seventeen is text-identical, measured by hashing
    the extracted text of all 417 pages of each rather than by sampling,
    so the set of changed pages is complete for extractable text. The
    measurement tool is archived under GEO-106-PYFLIGHTSTREAM-INTERNAL-REPORTS,
    cl-fin-tool-consumers/scripts/measure_edition_page_delta.py.
    That command prints the set, and it prints TWO sets because the
    answer depends on the comparison method. By
    text content, 17 pages differ and the list is exactly the one this
    note rests on. By raw bytes, 18 do: p.236 differs in the position of
    a single blank line, with both pages 3364 characters long and every
    word identical. A claim about what an edition DOCUMENTS counts the
    seventeen. An FSM-26.122 page number therefore addresses the same page
    here, with six exceptions inside three local reflows: pp.167 to 170
    of FSM-26.122 move back one page, p.324 moves back one, and p.190 moves
    forward one. The manifest that command reads is local and never
    committed (invariant 1); the `pyfs-manual sweep --help` epilog prints
    an example row.

    TWO LIMITS OF THAT METHOD travel with every row derived from it.
    Extraction sees TEXT, and both documents are exports carrying
    embedded screenshots, so a change living only inside a screenshot
    with no caption or prose beside it is invisible to it. And a command
    absent from a newer edition has not necessarily stopped working,
    which is RPT-024's caution applying unchanged: nothing in the
    comparison is a probe of the binary.

    The Script Index can over-report as well as omit commands (RPT-024).
    Count the chapter body: this edition deletes the
    TRAILING_EDGES_IMPORT block from the body at p.323 and still lists
    the command in the index at p.390.

    TWO STATEMENTS THE PREVIOUS EDITION MADE ARE WITHDRAWN HERE, and one
    of them is a claim about the solver's physical validity. Recorded
    against the pages they left, because an edition going quiet is a fact
    about a document and this is where this repository records what an
    edition did.

    FSM-26.122 pp.165 and 168 both told the reader that at higher control
    surface deflection angles the gap between split trailing edges opens
    enough that viscous effects can no longer smear the tip vortices
    forming at their ends, and that this is the regime where the solver
    captures those vortices directly. FSM-26.123 prints neither sentence, on
    either page, while keeping every sentence around them: the guidance
    to mark wake termination nodes across the gap survives and the
    statement about where the solver is valid without them does not. The
    two editions were read page against page rather than taken from the
    delta, and p.168 additionally drops the cross-reference to the
    section that describes those nodes.

    FSM-26.122 p.209 ended its description of the wake decay constant with a
    sentence setting it to zero for marine applications. FSM-26.123 carries
    the definition, the characteristic length and the turbulence
    proportionality on the same page and not that sentence. Read the
    subject carefully: it concerns wake decay, not a camber-line constant. p.209
    describes a camber-line representation for lifting surfaces earlier
    on the same page, and the withdrawn sentence sits at the end of the
    wake decay paragraphs and says "this constant", so its subject is the
    WAKE DECAY constant. That relocates where a dependence could live:
    SET_WAKE_DECAY_CONSTANT is the entry paraphrasing this material.

    These withdrawn statements are not current validity claims. The
    SET_WAKE_DECAY_CONSTANT entry paraphrases p.209 without the marine
    recommendation; the script helpers' jet-wake decay distance is a
    different quantity.

    Two consequences worth stating rather than leaving implicit. Neither
    prior page sits inside FSM-26.122's registered scripting reference, so
    neither could be cited from a version note without the citation walk
    reporting it as an offender, which is why this record lives here and
    not on a version row. And a withdrawal is not a measurement: the
    vendor deleting a claim about where the solver is valid says the
    document no longer asserts it, not that the solver changed. Anything
    that wants the claim back needs a probe, not a citation.
  "26.124": >
    FSM-26.124: Altair FlightStream User Guide, 26.12 hotfix build 4
    edition, 417 pages, scripting reference pp.283-383 with its Script
    Index at pp.384-390; cited in version notes as "FSM-26.124 p.N".

    IT IS THE FSM-26.123 FILE (RPT-050 records that the two files are equal). The package's
    manual carries FSM-26.123's sha256, page count and creation date, and the
    text of all 417 pages extracts
    identically, so every FSM-26.123 page number addresses the same page here
    and every statement recorded against FSM-26.123 above holds for this
    edition word for word, the withdrawals included. What 26.124 changes,
    if anything, is in its executable, which is the one file of the
    package whose bytes differ, and only running it can say what that is.

    RPT-061 measures the executable's refusal of TRAILING_EDGES_IMPORT,
    the block FSM-26.123 deletes. On 26.124 the solver answers the name
    as an unrecognized command, so
    its 26.124 row is removed and cites that run. The same run found the
    two-value IMPORT_WAKE_EDGES_FROM_FILE line the edition prints refused
    as a syntax error; the 26.124 row of that command states the grammar
    the build reads.
  "26.125": >
    FSM-26.125: Simcenter Flightstream User Guide, 26.12 hotfix build 5
    edition, 425 pages, scripting reference pp.288-390 with its Script
    Index at pp.391-397; cited in version notes as "FSM-26.125 p.N".
    The document carries the Simcenter Flightstream product name; its creation date is
    2026-09-25.

    IT DOCUMENTS 380 COMMANDS AGAINST 371 FOR FSM-26.124, counted by this
    package's own reader over both editions (`pyfs-manual surface`):
    thirteen gained and four no longer printed. The gained are the three
    ASSIGN_SELECTED_CURVES_TO_CCS_* commands of the CCS chapters, the
    three free-surface commands (CREATE_FREE_SURFACE_TFI_MESH,
    FREE_SURFACE_EXPORT_TYPE, DELETE_FREE_SURFACE), the pair
    ENABLE_SOLVER_TIME_AVERAGING and DISABLE_SOLVER_TIME_AVERAGING, which
    stands where SOLVER_TIME_AVERAGING stood, RESET_SOLVER_SWEEPER,
    SET_AEROELASTIC_CONVERGENCE_THRESHOLD, SET_CCS_TE_BLEND_LENGTH (named
    in the CCS file description of FSM-26.124 at p.85 and given a script
    entry only here), SET_DIRECT_AEROELASTIC_MESH_MORPHING and
    STABILITY_TOOLBOX_ANGLE_INCREMENT. The four it stops printing are
    AUTO_DETECT_BASE_REGIONS, AUTO_DETECT_TRAILING_EDGES,
    AUTO_DETECT_WAKE_TERMINATION_NODES and SOLVER_TIME_AVERAGING; their
    names appear nowhere in its text. SET_DIRECT_AEROELASTIC_MESH_MORPHING
    has evidence under FR-341 and RPT-154. Each of the four answers ABSENT on
    26.125 (no version row), the encoding for a dropped page
    (PFS-2026.04): an edition dropping a page is a fact about
    a document, and only a run of the build can make a row removed.

    The release notes in the package are byte-identical to the 26.124
    package's and document none of the difference, as RPT-014 found for
    26.121.

    OUTSIDE THE SCRIPTING REFERENCE, ONE RENAME REACHES THE OUTPUTS. The
    loads chapter (FSM-26.125 pp.227 and 229, against FSM-26.124 pp.225 and 227)
    renames the two drag columns of the loads spreadsheet: CDi (induced
    drag) becomes CDp (pressure drag) and CDo (skin friction drag) becomes
    CDv (viscous and separation drag), and the paragraph that said the
    induced drag is computed from the surface vorticity or the pressure now
    says it of the pressure drag. The force-plot and stability-coefficient
    commands rename their tokens to match (CDP, CDV), and the 26.125 loads
    exports print the new column names (RPT-160).
