# Ordered FlightStream version list: release order, append only.
# This list is the only ordering authority (CLAUDE.md invariant 4).
# canonical: YY.XXX scheme, last digit indexes vendor hotfix builds.
#   It was written here as 26.XXX while 26 was the only major registered;
#   the 2026-08-09 addition of the 25 series makes the major a variable,
#   which is what the scheme always meant. CLAUDE.md invariant 4 and SRS
#   FR-02a were moved to YY.XXX the same day.
# alias: the vendor-facing release name.
# build: the vendor build number this version's solver prints in its own
#   output footer, without the leading '#'. Recorded only from a
#   committed report's solver_identity, never guessed: it is what lets a
#   run tell WHICH build actually produced its results, since the printed
#   version line does not distinguish them within a release name.
#   Every registered build carries one as of 2026-08-09; the field stays
#   optional because a build is registered before it is ever run.
# prints: the release name the solver STATES ABOUT ITSELF, from the same
#   solver_identity line as the build number. It is NOT the alias and may
#   not be derived from it, which is the whole reason it is a field: the
#   vendor ships 26.120, 26.121 and 26.122 under the name 26.12 and all
#   three binaries print 26.1. No tally is written here: it moved the day
#   the third of those was registered, and the generated build page
#   computes it. A reader holding an install has only what it prints,
#   so anything that asks them to match on a name must offer this one.
versions:
  # ADDED 2026-08-09, on the author's decision, and read the ordering
  # note before reading the position. These THREE (25.000, 25.100 and
  # 26.000) precede every version this repository had registered until
  # now, so they are inserted at the FRONT rather than appended. The append-only rule above is about
  # never DROPPING a version (CLAUDE.md invariant 4), not about the end of the
  # list: the list is ordered by RELEASE order and a build obtained
  # later can belong earlier, which is exactly what happened when the
  # February 2026 build arrived after the May one and took the earlier
  # index.
  #
  # Why they are here at all: two of the three are builds the author's
  # PUBLISHED work was run on. 25.000 and 25.100 carried two AIAA
  # Aviation 2025 papers, so a reader reproducing either needs the
  # identifier to exist and to resolve to a build number they can check
  # against their own install. That is a reproducibility requirement
  # rather than a coverage one, and it is why registering them precedes
  # probing them. 26.000 is here for continuity of the series rather
  # than for a paper.
  # THESE THREE CARRIED NO BUILD NUMBER FOR ONE EVENING, and the reason
  # is worth keeping because two wrong diagnoses were written down
  # before the right one, one of them in this file.
  #
  # The identity probe of 2026-08-09 read the banner of the four 26.1x
  # installs in seconds and got nothing from these. It was first written
  # here that the boundary was release 26.1 and the executor's flags
  # were the suspect, then that the EDU licence seat was. Both were
  # wrong. The executor passed the script argument with two dashes, the
  # spelling SRC-003 documents, and the 25 series does not know it: the
  # 25.0 manual documents the one-dash form. A build given the
  # spelling it does not know starts, checks out its licence, receives
  # no script and waits, which under -hidden with the streams redirected
  # ends in a Fortran runtime error on CONOUT$ and a modal dialog nobody
  # can answer. Clean licence, empty log, and a timeout that says
  # nothing. RPT-023 has the sweep of both spellings over all seven
  # builds; the executor now passes one dash, which every build accepts.
  #
  # Read that as the standing warning it is: on these builds an empty
  # log is not evidence of a solver that failed, and a successful
  # licence checkout is not evidence that the run reached the script.
  - canonical: "25.000"
    alias: "25.0"
    # reports/compat/CMP-25000_2026-08-09_identity.yaml
    #
    # The banner names release 25.0 at build 12162024, agreeing with the
    # author's record of the build two AIAA Aviation 2025 papers were
    # written on. This install ships its manual only as .chm; it was
    # converted to a pdf with a reproducible pagination on 2026-08-10
    # and registered as SRC-749, so this build is read by the same tools
    # as every other (see the manual_editions entry below).
    build: "12162024"
    prints: "25.0"
    # The 25 series checks out an EDU licence rather than the full
    # feature set: the banner reports the feature and Altair units
    # checkouts unavailable and the EDU checkout successful. What an EDU
    # seat may refuse is not yet measured, so a validity sweep of this
    # build is not simply the 26.1 sweep pointed elsewhere.
  - canonical: "25.100"
    alias: "25.1"
    # reports/compat/CMP-25100_2026-08-09_identity.yaml
    build: "5062025"
    prints: "25.1"
  - canonical: "26.000"
    alias: "26.0"
    # reports/compat/CMP-26000_2026-08-09_identity.yaml
    #
    # First build that accepts BOTH spellings of the script argument, so
    # the boundary that RPT-023 measured falls between 25.100 and this
    # entry rather than at a series edge.
    build: "10202025"
    prints: "26.0"
  # RENUMBERED 2026-08-04, and read this before reading any 26.1x
  # evidence dated earlier. Until that date this repository's "26.100"
  # meant vendor build 5012026, a May 2026 install. The author then
  # obtained the FEBRUARY 2026 build, which precedes it, and the
  # ordering rule above (release order, append only) puts the earlier
  # build at the earlier index. So 26.100 now names the February build
  # and the May build was appended as 26.101. Nothing was dropped
  # (invariant 4): the identifier was reassigned and the May build kept
  # every record and every report it had, under its new name.
  #
  # 26.100's build was recorded on 2026-08-09 and the delay is worth one
  # sentence, because it is what the identity probe was built for. The
  # number was known from the day the install arrived, read off the
  # solver's own banner and written into RPT-018, and the registry stayed
  # silent for four days anyway: the rule above admits a build from a
  # report's solver_identity field, an ad-hoc probe report has no such
  # field, and tests/test_results.py checks every registered build
  # against one. Known and cited was not enough; machine-readable was
  # the requirement (PLN-20260805-1520, closed by that run).
  - canonical: "26.100"
    alias: "26.1"
    # reports/compat/CMP-26100_2026-08-09_identity.yaml
    #
    # The banner names release 26.1 at build 2122026, agreeing with
    # RPT-018 and with the author's own record of the build she wrote
    # the AIAA AVIATION 2026 paper on.
    build: "2122026"
    prints: "26.1"
  - canonical: "26.101"
    alias: "26.1"
    # reports/physics/PHY-26100_2026-07-21_smi01-triage-rerun.yaml, whose
    # fs_version reads 26.101 since the renumbering. The file name keeps
    # its original id because ids are cited elsewhere, so the stem and
    # the version it records deliberately disagree here; the report's own
    # dated banner says so.
    build: "5012026"
    prints: "26.1"
    # NOT a hotfix of 26.100, although it sits at a hotfix index. 26.100
    # is the February 2026 build and this is the May one: two releases
    # the vendor shipped under the one name "26.1", with different
    # manuals (396 pages against 409) describing different command sets.
    # Inheriting 26.100's records made the emitter write the February
    # flow-separation family on a May script, which that solver reports
    # as deprecated and then refuses (RPT-018). The index is an ordering
    # position, not a claim of descent.
    inherits_base: false
  - canonical: "26.120"
    alias: "26.12"
    # reports/compat/CMP-26120_2026-07-21_full.yaml
    build: "7012026"
    prints: "26.1"
  # The vendor ships this hotfix build under the SAME release name as
  # 26.120, so the alias below is deliberately NOT unique. Recording the
  # vendor's own name is the point; the ambiguity is refused at
  # resolution time (versions.resolve), not hidden here.
  - canonical: "26.121"
    alias: "26.12"
    # reports/compat/CMP-26121_2026-08-02_full.yaml
    build: "7262026"
    prints: "26.1"
    # A real hotfix of 26.120: same release, one manual re-issue apart
    # (413 pages against 410, every SRC-003 page shifted by +3), so a
    # command 26.120 records and this build does not re-probe is
    # genuinely the same command. The compatibility matrix marks every
    # inherited cell and counts them, so the assumption is visible
    # wherever it is used.
    inherits_base: true

  - canonical: "26.122"
    alias: "26.12"
    # reports/compat/CMP-26122_2026-08-10_identity.yaml
    #
    # The banner names release 26.1 at build 8092026, read from the log
    # of an identity probe on the licensed machine the day after the
    # build was issued.
    build: "8092026"
    prints: "26.1"
    # The second hotfix of the same 26.12 release, and the descent is
    # asserted from evidence rather than from the last digit, which is
    # what the 26.100 and 26.101 pair taught. Four things agree: the
    # vendor sells it as 26.12, the executable it ships is named for
    # 26.12, the solver prints 26.1 exactly as the other two do, and the
    # three build numbers are one release six weeks apart (1 July, 26
    # July, 9 August 2026). 26.101 has none of that: it is an
    # independent May release that took the next free index.
    #
    # Its own edition stops printing seven commands 26.120 prints, and
    # inheritance grants THREE of them, which is the number to read
    # rather than seven: four carry an explicit removed row. Two of the
    # four were re-spelled in this same edition and name their
    # successor; the other two were MEASURED on 26.121, one refused
    # outright and one aborting script processing, and inheritance from
    # the base would have handed this build the opposite answer from the
    # only measurements the 26.12 line has.
    #
    # THAT ASYMMETRY IS NOT SETTLED. The remaining three rest on the
    # same evidence class as the four, an edition going quiet, and are
    # emitted while the four are refused. An edition going quiet is a
    # fact about a document and a hotfix manual is a re-issue, which is
    # the reading that leaves them emittable; a probe on this build is
    # what would replace the reading with a measurement, and none has
    # run. Registered as PLN-20260810-1600 for the author.
    #
    # Inheritance runs from the BASE and not from the sibling, so the
    # six commands 26.121 added over 26.120 do NOT reach here by
    # descent. They carry their own rows below.
    inherits_base: true

# Every range below was MEASURED on 2026-08-06 rather than transcribed:
# the first and last page carrying a signature heading, and the
# contiguous run of pages the Script Index parser reads command lines
# from. Two of the four were wrong before that, both by exactly five
# pages at each end, and the database had been disagreeing with them in
# writing the whole time: 22 of its own SRC-003 citations fell outside
# the range this file declared for SRC-003. tests/test_command_db.py now
# fails on that, so the next drift is caught without reading a pdf.
manual_editions:
  "25.000": >
    SRC-749: Altair FlightStream User Guide, 25.0 edition, 342 pages,
    scripting reference pp.252-337 with its Script Index at pp.338-341;
    cited in version notes as "SRC-749 p.N".

    READ THIS BEFORE CITING A PAGE OF IT, because this edition is the
    one document here that the vendor did not paginate. The 25.000
    install ships its manual only as a compiled HTML help archive, which
    has topics and no pages, so a page citation against it would have
    been a number nobody wrote. The pdf is a CONVERSION, produced by
    scripts/chm_to_pdf.py from the extracted archive, and its page
    numbers are citable only because that script is deterministic: the
    topic order is the archive's own table of contents rather than a
    choice, the geometry is pinned, and the timestamps the renderer
    embeds are stripped, so two runs give byte-identical output. The
    committed pages are md5 4F4130513BB881DF51BEC47C26A4BDE2, 10780659
    bytes, rendered by Chrome 151.0.7922.76. Re-render with a different
    renderer and the page numbers move; the script prints the hash so
    the difference is visible rather than silent.

    They moved once already, and the episode is the argument for
    recording the hash. The generator stamps a footer on every topic,
    and it rendered INSIDE the last command's sample window on 26 pages,
    so the package reader returned it as a continuation line and those
    commands read as taking one argument more than they do. Stripping it
    shortened the document by six pages and moved every citation by five
    or six, since how far a page moved depends on how many stripped
    footers fell before it; an earlier wording here said five for all of
    them, which a six-page shortening cannot produce. The 241 rows
    citing this edition at the time were rewritten against the corrected
    document. TEN MORE WERE WRITTEN AFTER THAT REWRITE AND FROM THE
    EARLIER READING, and were found on 2026-08-10 by the check that now
    exists for it, `pyfs-manual citations`.

    Four things had to be fixed before the conversion was usable, and
    the first three had made a citation point at a page where the
    command could not be found: a signature split across a page break
    (seven commands), a block heading putting the label and the command
    on separate lines, which the reader requires on one (all 272), a
    margin glyph sharing the line (two), and the generator footer
    described above (26). All 272 commands the archive documents are
    read from the pdf by pyflightstream.utils.manual.
  "25.100": >
    SRC-748: Altair FlightStream User Guide, 25.1 edition (local,
    also shipped inside _private/exe/FlightStream_25100/), 361 pages,
    scripting reference pp.271-347 with its Script Index at pp.348-352;
    cited in version notes as "SRC-748 p.N".
  "26.000": >
    SRC-747: Altair FlightStream User Guide, 26.0 edition (local,
    also shipped inside _private/exe/FlightStream_26000/), 360 pages,
    scripting reference pp.270-346 with its Script Index at pp.347-351;
    cited in version notes as "SRC-747 p.N". NOT the same document as
    SRC-741 despite both being called a User Guide for a 26 series
    build: that one is 396 pages and belongs to the build that prints
    26.1.
  "26.100": >
    SRC-741: Altair FlightStream User Guide, 26.1 February 2026 edition
    (local, _private/exe/FlightStream_26100/), 396 pages, scripting
    reference pp.275-369 with its Script Index at pp.370-376; cited in version
    notes as "SRC-741 p.N". NOT interchangeable with SRC-725 below: they
    are different editions of the same vendor release name, and no page
    citation carries between them.
  "26.101": >
    SRC-725: Altair FlightStream User Manual, 26.1 May 2026 edition
    (local, _private/exe/FlightStream_26101/), 409 pages, scripting
    reference pp.280-375 with its Script Index at pp.376-382; cited in version
    notes as "SRC-725 p.N". This is the edition every SRC-725 citation
    in this database was read from; those citations were made while the
    install was named 26.100 and are unchanged, because the document did
    not change, only the version identifier pointing at it.
  "26.120": >
    SRC-003: Altair FlightStream User Manual v2612 (local,
    _private/manual/), 410 pages, scripting reference pp.281-376 with its
    Script Index at pp.377-383; cited in version notes as "SRC-003 p.N".
    This is the flagship edition and the one an unqualified page citation
    in this database means.
  "26.121": >
    SRC-740: Altair FlightStream User Manual, 26.12 hotfix build 1
    edition (local, _private/exe/FlightStream_26121/), 413 pages against
    410 for SRC-003, scripting reference pp.284-379 with its Script Index
    at pp.380-386. Every page
    citation of SRC-003 shifts by +3 in this edition, so an SRC-003
    page number does NOT address the same page here; that is why the
    two are separate sources rather than one re-issue. The vendor
    release-notes pdf is byte-identical between the two installs and
    documents none of the difference (RPT-014).
  "26.122": >
    SRC-750: Altair FlightStream User Guide, 26.12 hotfix build 2
    edition, 417 pages, scripting reference pp.283-383 with its Script
    Index at pp.384-390; cited in version notes as "SRC-750 p.N".
    Registered 2026-08-10, the day after the build was issued.
    It is the LARGEST scripting surface of the eight registered
    editions, 372 commands against 364 for the edition before it, and
    the growth is not all new capability: two of the ten it gains stand
    where a command it stops printing stood. SURFACE_ROTATE gives way to
    ROTATE_SURFACE and SET_TRAILING_EDGE_BLUNTNESS_ANGLE to
    SET_GEOMETRIC_EDGE_BLUNTNESS_ANGLE. Neither pair is a rename in the
    sense of one entry gaining a name: the rotation command changes
    layout and loses two options in the move, so each is entered
    separately and each says what it stands next to.
