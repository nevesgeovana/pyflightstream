    "26.101": {status: documented, note: "SRC-725 p.354, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.358, same grammar as 26.120"}
  notes: >
    Restores the default isometric viewpoint.

SET_SCENE_XY_POSITIVE:
  layout: bare
  phase: control
  args: []
  manual_ref: "SRC-003 p.355"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.351, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.354, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.358, same grammar as 26.120"}
  notes: >
    Views the XY plane from the positive side of the remaining axis.
    The six plane views are named for the plane in view and the sign of
    the direction the camera looks from, so the POSITIVE and NEGATIVE
    pair of one plane are opposite viewpoints of the same plane rather
    than two different planes.

