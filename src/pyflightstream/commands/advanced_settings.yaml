# Chapter: Scripting reference, Advanced Settings (FSM-26.120 pp.344-346).
#
# THIS IS THE CHAPTER WHERE THE EDITIONS DISAGREE ABOUT WHAT EXISTS, so
# unlike every other chapter of the sweep its version rows differ per
# command and none of them is boilerplate. Four commands are absent from
# the February edition, one is absent from the hotfix that FOLLOWS the
# edition documenting it, and one exists in that hotfix alone.
#
# `removed` records three evidence routes and the row says which: an edition states the
# withdrawal, an edition merely stops printing the command, or a run
# measures the solver refusing it. The middle one is the weakest and is
# still a record, so its row says it is silence. A
# row read off an edition's silence never claims anything about the
# solver.
#
# It is also the chapter of solver knobs, so almost everything here is
# phase init. Read that as this database's PLACEMENT of the chapter and
# not as a measurement of the solver: the manual documents these as
# solver settings and states nowhere what happens to one issued after
# initialization. The phase keeps them before execution; workflows place
# them early. PFS-2003.07 measured late-before-start response for
# SOLVER_MINIMUM_CP on 26.124 and 26.125 only. No blanket reading-time
# claim follows for the other settings.

SET_SOLVER_CONVERGENCE_ITERATIONS:
  layout: inline
  phase: init
  args:
    - name: value
      cites: null
      type: int
  manual_ref: "FSM-26.120 p.344"
  versions:
    "25.000": {status: documented, note: "FSM-25.000 p.305, same grammar as 26.120"}
    "25.100": {status: documented, note: "FSM-25.100 p.319, same grammar as 26.120"}
    "26.000": {status: documented, note: "FSM-26.000 p.318, same grammar as 26.120"}
    "26.100": {status: documented, note: "FSM-26.100 p.341, same grammar as 26.120"}
    "26.101": {status: documented, note: "FSM-26.101 p.343, same grammar as 26.120"}
    "26.120": {status: documented, report: "reports/compat/CMP-26120_2026-10-16_rotor-effect-reanalysis.yaml", note: "direct inconclusive evidence; PFS-2138.065 and PFS-2138.069: convergence of row 7001 and its loads export do not isolate this command [...]"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_savedstate2.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "FSM-26.123 p.349, unchanged from FSM-26.122 p.349"}
    "26.124": {status: verified, report: "reports/compat/CMP-26124_2026-09-14_full-sim.yaml", note: "FSM-26.124 p.349, the FSM-26.123 file, carried from 26.123"}
    "26.125": {status: verified, report: "reports/compat/CMP-26125_2026-10-05_probe-campaign.yaml", note: "FSM-26.125 p.356, unchanged from FSM-26.124 p.349"}
  notes: >
    Number of iterations the solver must remain below the convergence
    threshold before convergence is declared.

SOLVER_MINIMUM_CP:
  layout: inline
  phase: init
  args:
    - name: cp
      type: float
  manual_ref: "FSM-26.120 p.345"
  versions:
    "25.000": {status: documented, note: "FSM-25.000 p.301, same grammar as 26.120"}
    "25.100": {status: documented, note: "FSM-25.100 p.315, same grammar as 26.120"}
    "26.000": {status: documented, note: "FSM-26.000 p.314, same grammar as 26.120"}
    "26.100": {status: documented, note: "FSM-26.100 p.342, same grammar as 26.120"}
    "26.101": {status: documented, note: "FSM-26.101 p.344, same grammar as 26.120"}
    "26.120": {status: documented, report: "reports/compat/CMP-26120_2026-10-16_rotor-effect-reanalysis.yaml", note: "direct inconclusive evidence; PFS-2138.065 and PFS-2138.069: convergence of row 7001 and its loads export do not isolate this command [...]"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_savedstate2.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "FSM-26.123 p.350, unchanged from FSM-26.122 p.350"}
    "26.124": {status: verified, report: "reports/compat/CMP-26124_2026-09-14_full-sim.yaml", note: "FSM-26.124 p.350, the FSM-26.123 file, carried from 26.123"}
    "26.125": {status: verified, report: "reports/compat/CMP-26125_2026-10-05_probe-campaign.yaml", note: "FSM-26.125 p.357, unchanged from FSM-26.124 p.350"}
  default: -20
  default_ref: "FSM-26.120 p.221"
  notes: >
    Lower limiter on the pressure coefficient; the solver default is
    -20 (FSM-26.120 p.221).
    On 26.124 build 8172026 and 26.125 build 10052026, setting 0 after
    INITIALIZE_SOLVER and before START_SOLVER produced the same exported
    coefficients as setting 0 early, distinct from the -20 controls.
    SOLVER_MINIMUM_CP IS THEREFORE READ AFTER INITIALIZATION, on those two
    builds and for this command only (PFS-2003.07, session judgement
    2026-10-16). The low and high controls separated CL by 4.18 on 26.124
    and 4.14 on 26.125, many orders of magnitude above any convergence error,
    and the late-high run equals the early-high run to the printed digits.
    The classification is `init`, which is the measured window: the command
    is accepted between INITIALIZE_SOLVER and START_SOLVER with no second
    initialization, and refused after START_SOLVER; a `setup` phase would
    refuse the measured order and `exec` would refuse the early one. The
    emitters keep their early placement, which is correct under both
    answers. The other advanced settings are not generalized from this one.
    RESIDUAL LEVEL: all runs stopped at the 300-iteration limit with
    residuals about 8.2e-7 and 5.3e-7 against the requested 1e-10, so this
    is numerical setting response, not physical validation.
    See reports/PFS-2003.07_late-setting-evidence_2026-10-16.md.

