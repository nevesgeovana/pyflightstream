# Chapter: Scripting reference, Advanced Settings (SRC-003
# pp.344-346). Only the entries needed by the core steady path are
# drafted at M1; the remaining toggles of the chapter await the cases
# that exercise them.

SET_SOLVER_CONVERGENCE_ITERATIONS:
  layout: inline
  phase: init
  args:
    - name: value
      type: int
  manual_ref: "SRC-003 p.344"
  versions:
    "26.120": {status: documented}
  notes: >
    Number of iterations the solver must remain below the convergence
    threshold before convergence is declared.

SOLVER_MINIMUM_CP:
  layout: inline
  phase: init
  args:
    - name: cp
      type: float
  manual_ref: "SRC-003 p.345"
  versions:
    "26.120": {status: documented}
  default: -20
  default_ref: "SRC-003 p.221"
  notes: >
    Lower limiter on the pressure coefficient; the solver default is
    -20 (SRC-003 p.221).

REYNOLDS_AVERAGED_DRAG_FORCES:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.344"
  versions:
    "26.120": {status: documented}
  notes: >
    Toggles the Reynolds-averaged (flat plate) boundary layer
    calculations.

SOLVER_SET_MESH_INDUCED_WAKE_VELOCITY:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.344"
  versions:
    "26.120": {status: documented}

SOLVER_SET_FARFIELD_LAYERS:
  layout: inline
  phase: init
  args:
    - name: layers
      type: int
  manual_ref: "SRC-003 p.344"
  versions:
    "26.120": {status: documented}
  default: 3
  default_ref: "SRC-003 p.344"
  notes: >
    Far-field agglomeration layer count, integer between 1 and 5;
    the solver default is 3.

SOLVER_UNSTEADY_PRESSURE_AND_KUTTA:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.344"
  versions:
    "26.120": {status: documented}
  notes: >
    Toggles the unsteady Bernoulli and Kutta terms of the unsteady
    solver.

SET_WAKE_TERMINATION_TIME_STEPS:
  layout: inline
  phase: init
  args:
    - name: time_steps
      type: int
  manual_ref: "SRC-003 p.344"
  versions:
    "26.120": {status: documented}
  notes: >
    Number of time steps after which a wake vortex filament edge that
    lost all of its strength is removed from the simulation.

SET_WAKE_ON_WAKE_INDUCTION:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 pp.344-345"
  versions:
    "26.120": {status: documented}
  notes: >
    Toggles the wake-on-wake induced velocity computation.

ADDITIONAL_WAKE_RELAXATION_ITERATION:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.345"
  versions:
    "26.120": {status: documented}
  notes: >
    Performs one additional wake relaxation iteration.

AEROELASTIC_RBF_TYPE:
  layout: inline
  phase: init
  args:
    - name: rbf_type
      type: enum
      values: [WENDLAND_C2, GAUSSIAN, THIN_PLATE_SPLINE, MULTI_QUADRATIC, INV_MULTI_QUADRATIC]
  manual_ref: "SRC-003 pp.345-346"
  versions:
    "26.101": {status: documented, note: "SRC-725 pp.344-345, same grammar and same five options as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.379, same grammar; the entry moved out of the Advanced Settings chapter into the Aeroelastic Coupling Toolbox, while that edition's script index still files it under Advanced Settings"}
  notes: >
    RBF mesh morphing algorithm of the aeroelastic coupling. The manual
    gives the options as a NUMBERED list of five and says the input may
    be passed as the label or as the list number, so 1 is WENDLAND_C2,
    2 GAUSSIAN, 3 THIN_PLATE_SPLINE, 4 MULTI_QUADRATIC and
    5 INV_MULTI_QUADRATIC. That mapping is written down because the page
    shows two samples, one labelled as a number and one as a label, and
    they exercise DIFFERENT options: the numeric one passes 3 and the
    label one passes INV_MULTI_QUADRATIC. Reading the adjacent pair as
    one setting spelled two ways gives 3 the wrong meaning. The values
    above are the vocabulary the emitter writes, deliberately the names
    only; whether that narrowing is the right house rule is open, since
    the axis arguments of SET_MOTION_ROTOR_AXIS and
    ROTATE_COORDINATE_SYSTEM take the opposite choice and carry both
    spellings (PLN-20260806-1120). Absent from 26.100, which has no
    aeroelastic scripting family at all.

LAMINAR_SEPARATION:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.345"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.342, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.344, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.348, same grammar as 26.120"}
  notes: >
    Laminar boundary layer separation. This is the one member of the
    flow-separation family that survived the 26.101 redesign unchanged
    and is documented in all four editions; RPT-018 accepted it on
    26.100, 26.101 and 26.121.
