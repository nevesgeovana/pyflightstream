# Chapter: Scripting reference, Advanced Settings (SRC-003 pp.344-346).
#
# COMPLETE as of 2026-08-08. The chapter was drafted at M1 to the entries
# the core steady path needed, and the rest awaited the cases that would
# exercise them; that rule is gone with the v0.5.0 sweep and the eight it
# left behind are entered here.
#
# THIS IS THE CHAPTER WHERE THE EDITIONS DISAGREE ABOUT WHAT EXISTS, so
# unlike every other chapter of the sweep its version rows differ per
# command and none of them is boilerplate. Four commands are absent from
# the February edition, one is absent from the hotfix that FOLLOWS the
# edition documenting it, and one exists in that hotfix alone. Each is
# recorded from the editions that print it and from no others: silence is
# not a statement that a command was removed, so an edition that stops
# printing one gets NO row rather than a removed one, which the schema
# reserves for a manual saying so.
#
# It is also the chapter of solver knobs, so almost everything here is
# phase init: these are read when the solver is initialized, and setting
# one afterwards is a script that runs and changes nothing.

SET_SOLVER_CONVERGENCE_ITERATIONS:
  layout: inline
  phase: init
  args:
    - name: value
      type: int
  manual_ref: "SRC-003 p.344"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.341, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.343, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Number of iterations the solver must remain below the convergence
    threshold before convergence is declared.

SOLVER_MINIMUM_CP:
  layout: inline
  phase: init
  args:
    - name: cp
      type: float
  manual_ref: "SRC-003 p.345"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.342, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.344, same grammar as 26.120"}
    "26.120": {status: documented}
  default: -20
  default_ref: "SRC-003 p.221"
  notes: >
    Lower limiter on the pressure coefficient; the solver default is
    -20 (SRC-003 p.221).

REYNOLDS_AVERAGED_DRAG_FORCES:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.344"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.341, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.343, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Toggles the Reynolds-averaged (flat plate) boundary layer
    calculations.

SOLVER_SET_MESH_INDUCED_WAKE_VELOCITY:
  layout: inline
