    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.348, same grammar as 26.120"}
  notes: >
    Blending factor for wake stabilization, between 0 and 1, default
    0.25 as the manual states. The bound is not enforced.

    ABSENT FROM THE FEBRUARY 2026 EDITION, which is why there is no
    26.100 row: the command is not documented for that build, so the
    emitter refuses it there rather than assuming the older solver
    carries it.

SET_WAKE_NUMERICAL_RELAXATION:
  layout: inline
  phase: init
  args:
    - name: value
      type: float
  manual_ref: "SRC-003 p.346"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.345, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.349, same grammar as 26.120"}
  notes: >
    Relaxation factor applied to the wake between iterations, between 0
