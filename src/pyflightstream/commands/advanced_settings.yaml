SET_JET_WAKE_FILAMENTS_GRID_INDUCTION:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "FSM-26.120 p.346"
  versions:
    "26.101": {status: documented, note: "FSM-26.101 p.345, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121":
      status: removed
      probe_ref: "GEO-106-PYFLIGHTSTREAM-INTERNAL-REPORTS/reports/RPT-021_chapter-questions-measured_2026-08-08.md"
      note: >-
        The cited probe measured the 26.121 solver answering the name with an
        unrecognised-command error. Evidence from the run, not read off
        the hotfix edition's silence.
    "26.122":
      status: removed
      note: >-
        FSM-26.122 pp.283-383, the scripting reference of the 26.122
        edition, does not print this command anywhere, AND THAT
        EDITION'S INDEX DISAGREES WITH ITS OWN BODY: The Script
        Index at pp.384-390 of the same document still names it, and
        does not name any replacement. The body is the reading
        recorded here, on the rule that a signature heading is what a
        script is written from and an index entry is a pointer to one;
        an index that lags its own body is a defect of that document
        rather than a second opinion about the solver. The index is incomplete in BOTH
        directions and neither half of it carries much: counted over
        the ten commands this edition is the first to document, five
        are in it and five are not, and it keeps four of the seven
        names this edition stops printing relative to 26.120, plus at
        least one token that is no command at all,
        SOLVER_INITIALIZATION. Read the four with that scope: counted
        without it the kept names are five, DISABLE_ACTUATOR having
        left the body at 26.101 and stayed in the index. So the body wins here on the rule and not on
        any property of this index. A first draft of this note said
        the index was maintained by addition, which was one
        observation generalised and the count refutes it. THIS ROW EXISTS BECAUSE
        INHERITANCE WOULD SAY THE OPPOSITE. 26.122 inherits from the
        base release 26.120 and not from the sibling hotfix, so without
        a row here the emitter would resolve 26.120's documented record
        and write a command that the 26.121 row above records as removed
        on a run. That row is about 26.121 and this one is not, which is
        why it carries no run of its own and rests on the edition's
        silence; silence alone is the weakest of the three routes to
        this status, and it is still a better answer than the opposite
        one inheritance would give.
  notes: >
    Whether the jet wake filaments induce velocity on the mesh.

    THE ONLY COMMAND IN THIS SWEEP DOCUMENTED BY AN EDITION AND NOT BY
    THE HOTFIX THAT FOLLOWS IT. FSM-26.101 and FSM-26.120 both print it;
    FSM-26.121, which is otherwise FSM-26.120 plus three pages, does not, and
    it is not renamed into anything else on those pages either. The
    February edition does not have it, so its whole documented life is
    two editions.

    THAT SILENCE IS NOT WHY THE 26.121 ROW SAYS REMOVED. An edition
    dropping a page is a fact about a document, and the default this
    registry applies to one is inheritance: 26.121 carries 26.120's
    evidence wherever no row overrides it, so before the probe ran this
    command emitted on 26.121 as an inherited assumption, and the
    emitter would have gone on writing it.

    THE PROBE SETTLED IT THE OTHER WAY (RPT-021). The 26.121 solver does
    not recognise the name, so the row records a measurement and cites
    the run that made it, which is what makes removed sayable here at
    all. Worth keeping in view: the reading and the measurement agreed
    in this one case, and the reading still would not have been evidence
    for it. Two chapter questions the same day went the other way, where
    a page said less than the solver did.

    The practical consequence for a caller is a refusal rather than a
    line: solver_settings(jet_wake_filaments_grid_induction=...) on
    26.121 raises rather than emitting a command the solver would reject
    at run time.

SET_WAKE_DECAY_CONSTANT:
  layout: inline
  phase: init
  args:
    - name: value
      type: float
      unit: "1/m"
  manual_ref: "FSM-26.121 p.346"
  versions:
    "26.121": {status: documented}
    "26.122": {status: documented, note: "FSM-26.122 p.348, same grammar as 26.121"}
    "26.123": {status: documented, note: "FSM-26.123 p.348, unchanged from FSM-26.122 p.348"}
    "26.124": {status: documented, note: "FSM-26.124 p.348, the FSM-26.123 file, carried from 26.123; not run on 26.124"}
    "26.125": {status: documented, note: "FSM-26.125 p.355, unchanged from FSM-26.124 p.348"}
  notes: >
    Rate at which wake vorticity decays with distance.

    NEW IN THE 26.12 HOTFIX AND DOCUMENTED NOWHERE ELSE, so it carries
    one version row and its manual_ref cites FSM-26.121 rather than the
    flagship edition, which is the citation form for a command the
    flagship does not document.

    THE UNIT IS DERIVED AND NOT PRINTED. The manual gives the constant
    as 19.1 divided by a characteristic length L and states that L is
    in metres, so the constant is per metre; no edition writes that
    unit down. It is recorded because a decay constant computed with
    the length scale in the wrong units gives a wake that decays orders
    of magnitude too fast or not at all, and nothing in the number
    itself would reveal which.

    The manual defines L per case type: the semi-span of a wing or the
    largest fin for steady state, the blade radius for a rotor or
    propeller, and the larger of the two where both are present.

    It sits in the Solver Settings chapter of that edition while the
    Script Index files it under Advanced Settings, and it is kept here
    with the rest of the wake knobs.

    WITHDRAWN IN THE NEWEST EDITION: the 26.122 edition ended this page
    with a sentence setting the constant to zero for marine
    applications, and the 26.123 edition carries the definition, the
    characteristic length and the turbulence proportionality on the same
    page and NOT that sentence. This entry never carried the marine
    value and states none, so nothing here changes; the withdrawal is
    recorded because a reader who met the sentence in the older edition
    would otherwise assume the omission here was ours. It is recorded as
    an entry note rather than as a version note because a version note
    would cite a page of the older edition that falls outside the
    registered scripting range and would be reported as an offender.

