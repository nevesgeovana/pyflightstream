SET_JET_WAKE_DECAY_NORMALIZED_LENGTH:
  layout: inline
  phase: init
  args:
    - name: value
      type: float
      unit: "jet wake diameters"
  manual_ref: "SRC-003 p.346"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.345, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.349, same grammar as 26.120"}
  notes: >
    Distance at which a jet wake decays to a tenth of its initial
    strength, measured in multiples of the jet wake diameter rather
    than in length units. Default 100.0 and minimum 1.0 per the manual;
    neither is enforced. Absent from the February edition.

SET_JET_WAKE_FILAMENTS_GRID_INDUCTION:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.346"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.345, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Whether the jet wake filaments induce velocity on the mesh.

    THE ONLY COMMAND IN THIS SWEEP DOCUMENTED BY AN EDITION AND NOT BY
    THE HOTFIX THAT FOLLOWS IT. SRC-725 and SRC-003 both print it;
    SRC-740, which is otherwise SRC-003 plus three pages, does not, and
    it is not renamed into anything else on those pages either. The
    February edition does not have it, so its whole documented life is
    two editions.

    THERE IS NO 26.121 ROW AND THE STATUS IS NOT REMOVED. That status
    means the manual states the command is no longer supported, and no
    edition states anything here: one simply stops printing it. The
    difference matters because removed is a claim about the solver and
    silence is a fact about a document.

    SO THIS COMMAND STILL EMITS ON 26.121, by inheritance from its base
    release, and that is worth stating because the absent row looks like
    a refusal and is not one. The registry has 26.121 inherit 26.120's
    evidence where no row overrides it, which is the honest default when
    nothing is known about the hotfix; an edition dropping a page is not
    a measurement of the solver, so it does not override. Recording
    removed instead would refuse a command that may work perfectly, on
    the strength of a document's silence.

    PLN-20260808-2000 carries the probe that would settle it. Until then
    the position is: documented for two editions, emitted on the third
    as an inherited assumption, and that assumption is visible in the
    compatibility matrix, which marks an inherited cell as such.

SET_WAKE_DECAY_CONSTANT:
  layout: inline
  phase: init
  args:
    - name: value
      type: float
      unit: "1/m"
  manual_ref: "SRC-740 p.346"
  versions:
    "26.121": {status: documented}
  notes: >
    Rate at which wake vorticity decays with distance.

    NEW IN THE 26.12 HOTFIX AND DOCUMENTED NOWHERE ELSE, so it carries
    one version row and its manual_ref cites SRC-740 rather than the
    flagship edition, which is the citation form for a command the
    flagship does not document.

    THE UNIT IS DERIVED AND NOT PRINTED. The manual gives the constant
    as 19.1 divided by a characteristic length L and states that L is
    in metres, so the constant is per metre; no edition writes that
    unit down. It is recorded because a decay constant computed with
    the length scale in the wrong units gives a wake that decays orders
    of magnitude too fast or not at all, and nothing in the number
    itself would reveal which.

    The manual defines L per case type: the semi-span of a wing or the
    largest fin for steady state, the blade radius for a rotor or
    propeller, and the larger of the two where both are present.

    It sits in the Solver Settings chapter of that edition while the
    Script Index files it under Advanced Settings, and it is kept here
    with the rest of the wake knobs.
