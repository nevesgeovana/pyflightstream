# Chapter: Scripting reference, Advanced Settings (SRC-003 pp.344-346).
#
# COMPLETE as of 2026-08-08. The chapter was drafted at M1 to the entries
# the core steady path needed, and the rest awaited the cases that would
# exercise them; that rule is gone with the v0.5.0 sweep and the eight it
# left behind are entered here.
#
# THIS IS THE CHAPTER WHERE THE EDITIONS DISAGREE ABOUT WHAT EXISTS, so
# unlike every other chapter of the sweep its version rows differ per
# command and none of them is boilerplate. Four commands are absent from
# the February edition, one is absent from the hotfix that FOLLOWS the
# edition documenting it, and one exists in that hotfix alone.
#
# THE RULE IN THIS HEADER CHANGED ON 2026-08-09 and the old wording is
# replaced rather than kept, because it described a schema that no
# longer exists. It said an edition that stops printing a command gets
# NO row, since `removed` was reserved for a manual saying so. `removed`
# now admits three routes and the row says which: an edition states the
# withdrawal, an edition merely stops printing the command, or a run
# measures the solver refusing it. The middle one is the weakest and is
# still a record, so silence now gets a row that says it is silence.
# What has not changed is the thing the old wording was protecting: a
# row read off an edition's silence never claims anything about the
# solver.
#
# It is also the chapter of solver knobs, so almost everything here is
# phase init. Read that as this database's PLACEMENT of the chapter and
# not as a measurement of the solver: the manual documents these as
# solver settings and states nowhere what happens to one issued after
# initialization. The phase makes the emitter order them before it,
# which is the conservative choice and costs a caller nothing; whether a
# late call is honoured is untested (PLN-20260808-2400).

