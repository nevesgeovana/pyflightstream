# Chapter: Scripting, Opening, Closing and Saving (SRC-003 p.282) and
# Output Status (p.283).

OPEN:
  layout: param_lines
  phase: geometry
  args:
    - name: filename
      type: path
    - name: load_solver_initialization
      type: enum
      values: [ENABLE, DISABLE]
      required: false
  manual_ref: "SRC-003 p.282"
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.253, this edition's own grammar; see the note below"
      args:
        - name: filename
          type: path
        - name: reset_parallel_cores
          type: enum
          values: ["ENABLE", "DISABLE"]
          required: false
        - name: load_solver_initialization
          type: enum
          values: ["ENABLE", "DISABLE"]
          required: false
    "25.100": {status: documented, note: "SRC-748 p.272, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.271, same grammar as 26.120"}
    "26.100": {status: verified, report: "reports/compat/CMP-26100_2026-08-08_full.yaml"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "SRC-751 p.286, unchanged from SRC-750 p.286"}
  notes: >
    Opens an existing simulation (.fsm) file. The optional
    LOAD_SOLVER_INITIALIZATION ENABLE line loads the solver
    initialization stored in the opened file.

