# Chapter: Scripting reference, Solver Settings (SRC-003 pp.341-343).

SET_SOLVER_STEADY:
  layout: bare
  phase: init
  args: []
  manual_ref: "SRC-003 p.341"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.338, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.340, same grammar as 26.120"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-07-21_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-02_full.yaml"}

SET_SOLVER_UNSTEADY:
  layout: keyword_block
  phase: init
  args:
    - name: time_iterations
      type: int
    - name: delta_time
      type: float
      unit: "s"
  manual_ref: "SRC-003 p.341"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.338, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.340, same grammar as 26.120"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-07-21_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-02_full.yaml"}
  notes: >
    Physical time stepping. For rotary cases the manual recommends 8
    to 12 degrees of blade rotation per time step and at least two
    full rotations (SRC-003 p.210).

SET_BOUNDARY_LAYER_TYPE:
  layout: inline
  phase: init
  args:
    - name: type
      type: enum
      values: [LAMINAR, TRANSITIONAL, TURBULENT]
  manual_ref: "SRC-003 p.341"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.338, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.340, same grammar as 26.120"}
    "26.120": {status: documented}
  default: TRANSITIONAL
  default_ref: "SRC-003 p.203"
  notes: >
    The default transitional-turbulent model is stated valid for chord
    Reynolds numbers between 500000 and 1500000; outside this range
    select LAMINAR or TURBULENT explicitly (SRC-003 p.203).

SET_SOLVER_VISCOUS_COUPLING:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.341"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.338, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.340, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Couples the semi-empirical boundary layer model to the potential
    flow solution. Attached-flow viscosity only; stall capture also
    needs a flow separation model assignment (SRC-003 pp.207-208).

SET_VISCOUS_EXCLUDED_BOUNDARIES:
  layout: payload_lines
  phase: init
  args:
    - name: num_boundaries
      type: int
    - name: boundary_indices
      type: int_list
  manual_ref: "SRC-003 p.341"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.338, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.340, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.344, same grammar as 26.120"}
  notes: >
    Excludes the listed boundaries from viscous coupling; the indices
    follow on the next line as comma-separated values. Documented
    unchanged in all four editions; the three added on 2026-08-05 were
    read from their own pages, not inherited.

DELETE_VISCOUS_EXCLUDED_BOUNDARIES:
  layout: bare
  phase: init
  args: []
  manual_ref: "SRC-003 p.341"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.338"}
    "26.101": {status: documented, note: "SRC-725 p.340"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.344"}
  notes: >
    Clears the viscous-exclusion list, restoring viscous coupling on
    every boundary. The helper spells the clear as an empty
    viscous_excluded selection rather than as its own keyword, so the
    snapshot records one list per flag instead of a list and a
    separate erase.

CREATE_BULK_SEPARATION:
  layout: payload_lines
  phase: init
  args:
    - name: name
      type: str
    - name: separation_type
      type: enum
      values: [CYLINDRICAL, FLAT_PLATE]
    - name: num_boundaries
      type: int
    - name: diameter
      type: float
      unit: "simulation length units"
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-003 p.342"
  versions:
    "26.101":
      status: documented
      note: >-
        SRC-725 p.341 documents a three-argument form without
        SEPARATION_TYPE. The same page's sample blocks spell the
        command CREARE_BULK_SEPARATION while the function header
        spells CREATE_BULK_SEPARATION; a controlled 26.101 run
        (build 5012026, RPT-012) resolved the spelling: the solver
        accepts CREATE_BULK_SEPARATION and rejects CREARE as an
        unrecognized command, so CREARE is a manual typo and the
        header spelling stands. That run was recorded as 26.100 before
        the renumbering of 2026-08-04; the build is what identifies it.
        Status stays documented pending an effect-asserting harness
        probe on 26.101
      args:
        - name: name
          type: str
        - name: num_boundaries
          type: int
        - name: diameter
          type: float
          unit: "simulation length units"
        - name: boundary_indices
          type: int_list
          required: false
    "26.120": {status: documented, note: "Contradicted by evidence and not yet reprobed: on 26.120 (build #7012026) the solver refused all four documented forms, including the three-argument 26.1 form that ran on the May build, then called 26.100 and now 26.101 (reports/RPT-015_bulk-separation-family-acceptance_2026-08-02.md). The status stays documented because a promotion needs a probe report written by pyfs-qa (CLAUDE.md invariant 3) and RPT-015 is an ad-hoc probe that promotes nothing; the harness re-probe is PLN-20260802-2240."}
  notes: >
    Assigns the bulk (bluff-body) flow-separation model to the listed
    boundaries. NUM_BOUNDARIES takes -1 for all mesh boundaries;
    otherwise the comma-separated indices follow on the next line
    (SRC-003 p.342). The signature is version-sensitive: 26.12 inserts
    SEPARATION_TYPE (CYLINDRICAL or FLAT_PLATE, matching the bulk
    model sub-typing documented at SRC-003 p.207) as the second
    argument, which the 26.1 grammar does not have (SRC-725 p.341).

# --- the named separation models of 26.101 and later -----------------------
#
# 26.101 replaced the per-mechanism boundary lists of 26.100 (further
# below) with named separation models created one command at a time.
# The two generations are documented on disjoint builds. RPT-018
# measured part of that: the February commands it ran on 26.101 and
# 26.121 were reported deprecated and refused, and the three commands
# it ran on 26.100 from this family were unrecognized. It did not run
# the two bulk-split commands below on the February build.

CREATE_AIRFOIL_SEPARATION:
  layout: payload_lines
  phase: init
  args:
    - name: name
      type: str
    - name: num_boundaries
      type: int
    - name: valarezo_criterion
      type: enum
      values: [ENABLE, DISABLE]
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-003 p.341"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.340, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.344, same grammar as 26.120"}
  notes: >
    Assigns the airfoil (trailing-edge) separation model to the listed
    boundaries, with the Valarezo maximum-lift criterion enabled or
    disabled per assignment. NUM_BOUNDARIES takes -1 for all mesh
    boundaries, in which case no index line follows; otherwise the
    comma-separated indices are the next line (SRC-003 pp.341-342).

CREATE_AXIAL_VORTEX_SEPARATION:
  layout: payload_lines
  phase: init
  args:
    - name: name
      type: str
    - name: num_boundaries
      type: int
    - name: frame
      type: int
      cites: frames
    - name: body_axis
      type: enum
      values: [X, Y, Z, "1", "2", "3"]
    - name: diameter
      type: float
      unit: "simulation length units"
    - name: sharp_nose_vortices
      type: enum
      values: [ENABLE, DISABLE]
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-003 p.342"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.341, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.345, same grammar as 26.120"}
  notes: >
    Assigns the axial vortex separation model to a slender body. FRAME
    is the 1-based index of the coordinate system acting as the body
    axes, 1 being the reference frame, and BODY_AXIS names the body
    axis within it either as a letter or as its 1-based index
    (SRC-003 p.342). Read the manual's second sample with care: it puts
    -1 in the FRAME position rather than in NUM_BOUNDARIES, which
    contradicts the parameter table on the same page and is not a form
    this database records.

CREATE_CYLINDRICAL_BULK_SEPARATION:
  layout: payload_lines
  phase: init
  args:
    - name: name
      type: str
    - name: num_boundaries
      type: int
    - name: diameter
      type: float
      unit: "simulation length units"
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-740 p.345"
  versions:
    "26.121": {status: documented}
  notes: >
    The cylindrical bulk separation model, split out of the
    SEPARATION_TYPE argument that CREATE_BULK_SEPARATION carried on
    26.120. RPT-015 accepted this command on 26.120 as well, where no
    manual documents it; that is a probe result and not a citation, so
    only the documented version is recorded here.

CREATE_STRATFORD_BULK_SEPARATION:
  layout: payload_lines
  phase: init
  args:
    - name: name
      type: str
    - name: num_boundaries
      type: int
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-740 p.345"
  versions:
    "26.121": {status: documented}
  notes: >
    The Stratford bulk separation model, which takes no diameter. As
    with the cylindrical command above, RPT-015 accepted it on 26.120
    where no manual documents it. The index-line form was run on 26.121
    only; 26.120 saw the -1 form alone.

DELETE_SEPARATION:
  layout: inline
  phase: init
  args:
    - name: index
      type: int
  manual_ref: "SRC-003 p.342"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.341, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.346, same grammar as 26.120"}
  notes: >
    Deletes one separation model by its 1-based index in the order the
    models were created; -1 deletes every one of them (SRC-003 p.342).
    One command covers all separation types, which is the reason the
    26.100 generation needed a DELETE per mechanism and this one does
    not.

# --- the per-mechanism separation lists of 26.100 --------------------------
#
# This generation is documented for the February 2026 build alone.
# RPT-018 probed five of these commands on 26.101 and three on 26.121,
# and the solver recognized each one it was given, reported it
# deprecated and then failed the script; it probed none of them on
# 26.120, and it probed none of the three DELETE commands on any later
# build. Read that as the measurement it is rather than as a statement
# about the family. A caller on 26.101 or later wants the named models
# above.
#
# No version record is written for the later builds: the solver's own
# deprecation notice is not a manual statement, and the removed status
# is promoted from a harness probe rather than from an ad-hoc one
# (PLN-20260805-1530).

SET_AXIAL_SEPARATION_BOUNDARIES:
  layout: payload_lines
  phase: init
  args:
    - name: num_boundaries
      type: int
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-741 p.339"
  versions:
    "26.100": {status: documented}
  notes: >
    Adds boundaries to the axial flow separation list. NUM_BOUNDARIES
    takes -1 for all mesh boundaries, in which case the following line
    is ignored; otherwise the comma-separated indices are the next line
    (SRC-741 p.339).

DELETE_AXIAL_SEPARATION_BOUNDARIES:
  layout: bare
  phase: init
  args: []
  manual_ref: "SRC-741 p.339"
  versions:
    "26.100": {status: documented}
  notes: >
    Clears the axial flow separation list. Spelled as an empty
    axial_separation_boundaries selection by the curated helper.

SET_VALAREZO_SEPARATION_BOUNDARIES:
  layout: payload_lines
  phase: init
  args:
    - name: num_boundaries
      type: int
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-741 p.339"
  versions:
    "26.100": {status: documented}
  notes: >
    Adds boundaries to the Valarezo maximum-lift criterion list, with
    the -1 form of the axial command above. The manual writes this name
    in the function header and a different one, VALAREZO_CRITERION, in
    the sample directly beneath it; RPT-018 probed both and the solver
    accepts this spelling and does not recognize the other.

DELETE_VALAREZO_CRITERION_BOUNDARIES:
  layout: bare
  phase: init
  args: []
  manual_ref: "SRC-741 p.339"
  versions:
    "26.100": {status: documented, note: "Contradicted by evidence and not yet reprobed: RPT-018 found this name unrecognized on 26.100 (build #2122026), the build whose own manual documents it in a function header, while the undocumented DELETE_VALAREZO_SEPARATION_BOUNDARIES was accepted. The status stays documented because a promotion to broken needs a probe report written by pyfs-qa (CLAUDE.md invariant 3) and RPT-018 is an ad-hoc probe that promotes nothing; the harness re-probe is PLN-20260805-1520."}
  notes: >
    The manual's own name for clearing the Valarezo list, which the
    solver does not answer to. The name it answers to is the entry
    directly below, recorded on a probe citation since the author's
    decision of 2026-08-06 (PLN-20260805-1540). Both are kept: this one
    because SRC-741 p.339 documents it and a reader of that page needs
    to find out here that it does not work, and the other because it is
    the one that runs.

DELETE_VALAREZO_SEPARATION_BOUNDARIES:
  layout: bare
  phase: init
  args: []
  # No manual edition documents this name. All four were searched for
  # both spellings (RPT-018 section 3.1), and the report is the evidence
  # that the command exists, which is what probe_ref records. It says
  # nothing about how the command behaves: acceptance is not effect, and
  # the status below stays documented until a harness probe runs
  # (PLN-20260805-1520).
  probe_ref: "reports/RPT-018_separation-family-across-builds_2026-08-05.md"
  versions:
    "26.100": {status: documented}
  notes: >
    The erase of the Valarezo maximum-lift criterion list that the
    February build accepts. Its documented sibling above,
    DELETE_VALAREZO_CRITERION_BOUNDARIES, is the name SRC-741 p.339
    prints in a function header and the solver refuses as unrecognized,
    so the manual names one command and the solver answers to another.
    Recorded here rather than left to Script.raw(), which is the one
    emission path with no validation at all.

SET_CROSSFLOW_SEPARATION_BOUNDARIES:
  layout: payload_lines
  phase: init
  args:
    - name: num_boundaries
      type: int
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-741 p.339"
  versions:
    "26.100": {status: documented}
  notes: >
    Adds boundaries to the cross-flow separation list, with the -1 form
    of the axial command above (SRC-741 pp.339-340).

DELETE_CROSSFLOW_SEPARATION_BOUNDARIES:
  layout: bare
  phase: init
  args: []
  manual_ref: "SRC-741 p.340"
  versions:
    "26.100": {status: documented}
  notes: >
    Clears the cross-flow separation list. Spelled as an empty
    crossflow_separation_boundaries selection by the curated helper.

SET_CROSSFLOW_SEPARATION_DIAMETER:
  layout: inline
  phase: init
  args:
    - name: diameter
      type: float
      unit: "simulation length units"
  manual_ref: "SRC-741 p.339"
  versions:
    "26.100": {status: documented}
  notes: >
    Maximum diameter of the body carrying the cross-flow separation
    model. One diameter applies to the whole list, which is the
    difference from the later named models, where the diameter belongs
    to each assignment.

SET_CROSSFLOW_SEPARATION_AXISYMMETRIC:
  layout: inline
  phase: init
  args:
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-741 p.340"
  versions:
    "26.100": {status: documented}
  notes: >
    Axisymmetric vortex shedding for the cross-flow separation model.

# --- thin boundaries and surface roughness ----------------------------------
#
# The last three of the Solver Settings chapter, entered 2026-08-07. A
# fourth name appears absent and is not: the Script Index of every
# edition spells CREATE_STRATFORD_BULK_SEPARATION as
# CREATE_STARTFORD_BULK_SEPARATION, and the command is recorded above
# under the spelling its chapter body and its sample both use, which
# RPT-015 measured the solver accepting. A coverage sweep driven from
# the index alone will keep reporting that misspelling as a gap.

SET_SURFACE_ROUGHNESS:
  layout: inline
  phase: init
  args:
    - name: roughness_height
      type: float
      unit: "nm"
  manual_ref: "SRC-003 p.341"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.338, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.340, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.344, same grammar as 26.120"}
  notes: >
    Surface roughness height for the boundary layer model, in
    NANOMETRES, which the manual states and which is worth carrying
    because every other length in this database is a metre, a
    coordinate-system unit or an explicit UNITS argument. A height read
    as millimetres instead of nanometres is a roughness a million times
    the one intended.

    Zero means a smooth surface, which the manual states, so the
    argument has no separate toggle and the value carries the choice.

SET_THIN_BOUNDARIES:
  layout: payload_lines
  phase: init
  args:
    - name: num_boundaries
      type: int
    - name: boundary_indices
      type: int_list
      required: false
  manual_ref: "SRC-003 p.343"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.341, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.346, same grammar as 26.120"}
  notes: >
    Marks boundaries as thin, so the solver treats both faces of a
    surface rather than one. The indices follow on the next line,
    comma separated, and -1 marks every mesh boundary and the index line
    is IGNORED rather than absent, which the manual says in those terms;
    the index list is therefore optional here as on its siblings.

    Absent from the February 2026 edition, whose separation family is
    the per-mechanism one recorded above; thin boundaries arrive with
    the redesign in May.

DELETE_THIN_BOUNDARIES:
  layout: bare
  phase: init
  args: []
  manual_ref: "SRC-003 p.343"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.342, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.346, same grammar as 26.120"}
  notes: >
    Clears the thin boundary list entirely. It takes no argument, so
    there is no way to remove one boundary from the list: a script that
    wants a subset clears and re-sets.
