# Chapter: Scripting, Script Controls (SRC-003 p.281).
# Control commands run at any point of a script; the builder exempts
# the control phase from phase ordering.

STOP:
  layout: bare
  phase: control
  args: []
  manual_ref: "SRC-003 p.281"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.252, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.271, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.270, same grammar as 26.120"}
    "26.100": {status: verified, report: "reports/compat/CMP-26100_2026-08-08_full.yaml"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "SRC-751 p.285, same grammar as the 26.122 edition"}
  notes: >
    Halts script processing at this location; the manual suggests it
    for debugging partial scripts (SRC-003 p.280).

PRINT:
  layout: inline
  phase: control
  args:
    - name: message
      type: str
  manual_ref: "SRC-003 p.281"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.252, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.271, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.270, same grammar as 26.120"}
    "26.100": {status: verified, report: "reports/compat/CMP-26100_2026-08-08_full.yaml"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
    "26.122": {status: verified, report: "reports/compat/CMP-26122_2026-08-11_full.yaml"}
    "26.123": {status: verified, report: "reports/compat/CMP-26123_2026-08-17_full-sim.yaml", note: "SRC-751 p.285, same grammar as the 26.122 edition"}
  notes: >
    Writes a user-defined message to the log window; useful as a
    sentinel marker in probe scripts.

RUN_SCRIPT:
  layout: param_lines
  phase: control
  args:
    - name: script_path
      type: path
  manual_ref: "SRC-003 p.281"
  versions:
    "25.100": {status: documented, note: "SRC-748 p.271, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.270, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.280, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.275, same grammar as 26.120"}
