    - name: body_index
      type: int
  manual_ref: "SRC-003 p.292"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.257, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.277, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.276, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.286, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.291, same grammar as 26.120"}
