# Chapter: Scripting reference, CAD Create (SRC-003 pp.289-306).
#
# The pane that builds geometry inside FlightStream: curve construction,
# cross-sections, and the lofted meshes made from them. This file is
# entered family by family; what is here is the initialization, the four
# pane settings, and the basic shapes.
#
# Every command below is documented unchanged in all four registered
# editions, and every entry carries its own page per edition, because no
# page citation carries between them.
#
# Phase is geometry throughout. Note what that costs and why it is
# accepted: FRAME arguments here can only be the reference frame, since
# CREATE_NEW_COORDINATE_SYSTEM is phase setup and cannot precede a
# geometry command. That is this package's ordering rather than a
# measured solver rule, registered as PLN-20260806-0900 with the probe
# that answers it.

CAD_CREATE_INITIALIZE:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.289"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.283, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.288, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.292, same grammar as 26.120"}
  notes: >
    Opens the CAD Create pane. Whether the commands below REQUIRE it
    first is not stated by the manual and is not asserted here; the
    samples show it opening the pane and nothing says the others fail
    without it.

# --- pane settings, all four with a documented default ---------------------

SET_CAD_CREATE_MERGE_TOLERANCE:
  layout: inline
  phase: geometry
  args:
    - name: tolerance
      type: float
      unit: "percent of curve length"
  manual_ref: "SRC-003 p.289"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.283, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.288, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.292, same grammar as 26.120"}
  default: 1.0
  default_ref: "SRC-003 p.289"
  notes: >
    How close two curve ends must be to merge, as a PERCENTAGE of the
    curve length rather than an absolute distance, so the same value
    behaves differently on a long curve and a short one. Greater than
    zero (SRC-003 p.289).

SET_CAD_CREATE_SPLINE_SEGMENTS:
  layout: inline
  phase: geometry
  args:
    - name: num_pts
      type: int
  manual_ref: "SRC-003 p.289"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.283, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.288, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.292, same grammar as 26.120"}
  default: 200
  default_ref: "SRC-003 p.289"
  notes: >
    Spline nodes used to discretize a curve. Integer greater than 10
    (SRC-003 p.289); the lower bound is the manual's own and is not
    enforced here, because the database records grammar and the solver
    owns the range.

SET_CAD_CREATE_SPLINE_LOFT:
  layout: inline
  phase: geometry
  args:
    - name: loft_type
      type: enum
      values: [C2, C0]
  manual_ref: "SRC-003 p.289"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.283, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.288, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.292, same grammar as 26.120"}
  default: C2
  default_ref: "SRC-003 p.289"
  notes: >
    Continuity of the loft through a curve: C2 is curvature continuous
    and C0 is position continuous, so C0 admits a crease where C2
    smooths it. The same two tokens appear per direction on the mesh
    commands built from cross-sections.

SET_CAD_CURVATURE_REFINEMENT:
  layout: inline
  phase: geometry
  args:
    - name: num_pts_per_circle
      type: int
  manual_ref: "SRC-003 p.289"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.283, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.288, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.292, same grammar as 26.120"}
  default: 80
  default_ref: "SRC-003 p.289"
  notes: >
    Subdivisions around a full circle, used as the reference for how
    finely a curved region is refined. It is the same quantity the
    NUM_CURVATURE argument of IMPORT_CAD carries, and the two share the
    documented default of 80.

# --- basic shapes ----------------------------------------------------------
#
# The four take a FRAME and place a primitive in it. None states the
# units of its lengths: they are the units of the coordinate system,
# which the manual leaves to the reader, so no unit field is recorded
# rather than one being invented.
#
# THREE SPELLINGS OF LENGTH across four commands, and they are the
# vendor's: the placeholders are LEN_X on the box, LEN on the cylinder,
# LEN1 and LEN2 on the sheet. A caller writing keyword arguments has to
# look up which one a given command uses, which is a real cost, and the
# alternative cost is worse: renaming them would make the database
# argument list stop matching the manual page a reader has open beside
# it, which is the one thing these names are for. They are mirrored,
# and this comment is the warning.

CAD_CREATE_BOX:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
    - name: x
      type: float
    - name: y
      type: float
    - name: z
      type: float
    - name: len_x
      type: float
    - name: len_y
      type: float
    - name: len_z
      type: float
  manual_ref: "SRC-003 p.290"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.284, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.289, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.293, same grammar as 26.120"}
  notes: >
    X, Y and Z are the FIRST CORNER VERTEX rather than the centre, and
    the three lengths run from that corner along the frame's axes
    (SRC-003 p.290). A box centred on a point is that point minus half
    each length.

CAD_CREATE_SPHERE:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
    - name: x
      type: float
    - name: y
      type: float
    - name: z
      type: float
    - name: radius
      type: float
  manual_ref: "SRC-003 p.290"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.284, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.289, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.293, same grammar as 26.120"}
  notes: >
    X, Y and Z are the CENTRE here, unlike the box above, which takes a
    corner. The two commands sit on one manual page and differ on this
    point, which is worth carrying because the argument names do not
    say so.

CAD_CREATE_CYLINDER:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
    - name: x
      type: float
    - name: y
      type: float
    - name: z
      type: float
    - name: r1
      type: float
    - name: r2
      type: float
    - name: len
      type: float
  manual_ref: "SRC-003 p.290"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.284, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.289, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.293, same grammar as 26.120"}
  notes: >
    R1 and R2 are the radii at the two ends, so a cone is a cylinder
    with unequal radii and there is no separate cone command. The axis
    is not a choice: LEN runs along the X AXIS of the frame
    (SRC-003 p.290), so a cylinder along another direction needs a
    coordinate system oriented for it, which the phase note at the top
    of this file says cannot currently be created before it.

CAD_CREATE_SHEET:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: offset
      type: float
    - name: len1
      type: float
    - name: len2
      type: float
  manual_ref: "SRC-003 p.290"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.284, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.289, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.293, same grammar as 26.120"}
  notes: >
    A flat rectangle in one plane of the frame. OFFSET moves it along
    that plane's normal and MAY BE NEGATIVE, which the manual states
    explicitly; zero puts the sheet exactly in the plane. LEN1 and LEN2
    run along the plane's two directions in the order the plane name
    gives them (SRC-003 p.290).

# --- virtual curves: constructing them -------------------------------------
#
# A "virtual curve" is CAD Create's own object, indexed from 1 in
# creation order, and it is not a mesh boundary: nothing in the
# cross-reference ledger tracks it, so an index here is validated as an
# integer and not against an inventory.
#
# None of the three constructors takes a FRAME, unlike the basic shapes
# above. The manual does not say which coordinate system their vertices
# are in, so this database does not say either.

CAD_CREATE_CURVE_POINT:
  layout: inline
  phase: geometry
  args:
    - name: x
      type: float
    - name: y
      type: float
    - name: z
      type: float
  manual_ref: "SRC-003 p.293"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.287, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.292, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.296, same grammar as 26.120"}
  notes: >
    A curve of one vertex. It is a curve rather than a point in the
    interface's own vocabulary, which is why it is selected, reordered
    and lofted with the others.

CAD_CREATE_CURVE_LINE:
  layout: inline
  phase: geometry
  args:
    - name: x1
      type: float
    - name: y1
      type: float
    - name: z1
      type: float
    - name: x2
      type: float
    - name: y2
      type: float
    - name: z2
      type: float
  manual_ref: "SRC-003 p.293"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.287, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.292, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.296, same grammar as 26.120"}
  notes: >
    A straight curve between two vertices, given in order: the direction
    from the first to the second is the curve's own, which
    CAD_CREATE_CURVE_REVERSE flips and which the loft commands read.

CAD_CREATE_CURVE_ARC:
  layout: inline
  phase: geometry
  args:
    - name: x0
      type: float
    - name: y0
      type: float
    - name: z0
      type: float
    - name: x1
      type: float
    - name: y1
      type: float
    - name: z1
      type: float
    - name: x2
      type: float
    - name: y2
      type: float
    - name: z2
      type: float
  manual_ref: "SRC-003 p.293"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.287, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.292, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.296, same grammar as 26.120"}
  notes: >
    NINE coordinates in three triples, and the FIRST is the arc's
    ORIGIN rather than a vertex on it: origin, then the two vertices the
    arc runs between (SRC-003 p.293). The manual's own sample is a
    quarter circle of radius one about the coordinate origin, from
    (-1, 0, 0) to (0, 1, 0). Reading the first triple as a vertex draws
    a different arc that the solver accepts, so the order is worth
    checking against that sample rather than against the argument
    names, which do not distinguish them.

# --- virtual curves: selecting and deleting them ---------------------------
#
# The three index commands share one convention the argument name does
# not carry: -1 means EVERY existing curve, in creation order. The three
# deletes take no argument and differ only in which set they act on.

CAD_CREATE_CURVE_SELECT:
  layout: inline
  phase: geometry
  args:
    - name: curve_index
      type: int
  manual_ref: "SRC-003 p.294"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.288, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.293, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.297, same grammar as 26.120"}
  notes: >
    Adds one virtual curve to the selection by its 1-based creation
    index; -1 selects every existing curve (SRC-003 p.294). Selection is
    what CAD_CREATE_CURVE_DELETE_SELECTED and the loft commands read, so
    it is state carried between lines rather than an argument.

CAD_CREATE_CURVE_UNSELECT:
  layout: inline
  phase: geometry
  args:
    - name: curve_index
      type: int
  manual_ref: "SRC-003 p.294"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.288, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.293, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.297, same grammar as 26.120"}
  notes: >
    Removes one curve from the selection; -1 removes every one
    (SRC-003 p.294).

CAD_CREATE_CURVE_REVERSE:
  layout: inline
  phase: geometry
  args:
    - name: curve_index
      type: int
  manual_ref: "SRC-003 p.294"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.288, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.293, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.297, same grammar as 26.120"}
  notes: >
    Flips a curve's direction; -1 flips every one (SRC-003 p.294). It
    acts on the curve rather than on the selection, so it takes an index
    where the delete commands below take none.

CAD_CREATE_CURVE_DELETE_ALL:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.296"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.290, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.295, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.299, same grammar as 26.120"}
  notes: >
    Deletes every virtual curve, selected or not.

CAD_CREATE_CURVE_DELETE_SELECTED:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.296"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.291, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.295, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.299, same grammar as 26.120"}
  notes: >
    Deletes the curves currently selected, which is the state
    CAD_CREATE_CURVE_SELECT builds.

CAD_CREATE_CURVE_DELETE_UNSELECTED:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.296"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.291, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.295, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.299, same grammar as 26.120"}
  notes: >
    Deletes everything NOT selected, which is how a script keeps a
    subset: select what it wants, then delete the rest.

# --- virtual curves: transforming them -------------------------------------
#
# The transforms ending in RETAIN_CURVE (rotate, scale, translate and
# the two projections) choose whether the ORIGINAL curves survive the
# operation. The name reads like a boolean and is an enumeration of two
# words, RETAIN or DELETE, and the manual's own samples use DELETE more
# often than not: a transform is usually a replacement rather than a
# copy.
#
# They act on the SELECTION rather than on an index, with the two
# projections as the exception: those name their curves directly and
# ignore what is selected.

CAD_CREATE_ROTATE_CURVES:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
    - name: axis
      type: enum
      values: [X, Y, Z, "1", "2", "3"]
    - name: angle
      type: float
      unit: "deg"
    - name: retain_curve
      type: enum
      values: [RETAIN, DELETE]
  manual_ref: "SRC-003 p.295"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.289, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.294, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.298, same grammar as 26.120"}
  notes: >
    Rotates the selected virtual curves about one axis of the given
    coordinate system. Frame 1 is the reference system, which the
    parameter table states.

    AXIS takes the index as well as the letter, for the reason recorded
    at CAD_BODY_ROTATE: the table names X, Y or Z and the sample beneath
    it passes 2, in all four editions, and two other tables in this
    chapter state the dual form outright. Pass the index as the string
    "2" (PLN-20260806-1130).

CAD_CREATE_TRANSLATE_CURVES:
  layout: inline
  phase: geometry
  args:
    - name: x
      type: float
    - name: y
      type: float
    - name: z
      type: float
    - name: retain_curve
      type: enum
      values: [RETAIN, DELETE]
  manual_ref: "SRC-003 p.295"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.289, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.294, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.298, same grammar as 26.120"}
  notes: >
    Translation vector for the selected virtual curves. It takes NO
    frame argument, unlike the rotation and the mirror, and the manual
    states why in the parameter row rather than in the signature: the
    vector is read in the REFERENCE coordinate system. A script that
    built its curves against a local frame has to convert.

CAD_CREATE_SCALE_CURVES:
  layout: inline
  phase: geometry
  args:
    - name: scale
      type: float
    - name: retain_curve
      type: enum
      values: [RETAIN, DELETE]
  manual_ref: "SRC-003 p.295"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.289, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.294, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.298, same grammar as 26.120"}
  notes: >
    ONE scale value for all three axes: the command has no per-axis
    form, so a non-uniform scaling is not available here. What the
    scaling is about, the origin or the curve's own centroid, is not
    stated in any edition.

CAD_CREATE_PROJECT_CURVE:
  layout: inline
  phase: geometry
  args:
    - name: curve_index
      type: int
    - name: frame
      type: int
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: nx
      type: float
    - name: ny
      type: float
    - name: nz
      type: float
    - name: retain_curve
      type: enum
      values: [RETAIN, DELETE]
  manual_ref: "SRC-003 pp.295-296"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.290, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.294, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.298, same grammar as 26.120"}
  notes: >
    Projects ONE virtual curve, named by index rather than taken from
    the selection, onto a plane of the given coordinate system, along a
    direction the caller supplies.

    TWO FRAMES ARE IN PLAY AND THEY ARE NOT THE SAME ONE. The parameter
    table puts PLANE in the coordinate system FRAME names and NX, NY, NZ
    in the GLOBAL reference system (SRC-003 p.296). Reading the
    direction as being in FRAME projects along the wrong vector whenever
    FRAME is not the reference system, and the solver has no way to
    object: the result is a curve in the right plane and the wrong
    place.

    The -1 convention applies here too, and the manual's own row for it
    says "reverse all existing virtual curves", which is the wording of
    CAD_CREATE_CURVE_REVERSE left behind by an edit. Read as project.

CAD_CREATE_PROJECT_MULTI_CURVE:
  layout: inline
  phase: geometry
  args:
    - name: curve_index_1
      type: int
    - name: curve_index_2
      type: int
    - name: frame
      type: int
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: retain_curve
      type: enum
      values: [RETAIN, DELETE]
  manual_ref: "SRC-003 p.296"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.290, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.295, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.299, same grammar as 26.120"}
  notes: >
    THE TWO INDICES ARE NOT INTERCHANGEABLE. The FIRST curve is the one
    projected; the SECOND is a guide, used to hold the sweep angle along
    both curves, and it is not itself projected (SRC-003 p.296).
    Swapping them projects the wrong curve, which is why the argument
    names carry the order.

    It takes no projection vector, where CAD_CREATE_PROJECT_CURVE above
    does: the guide curve supplies the direction. RETAIN_CURVE governs
    the original, and the manual does not say whether that means the
    first curve or both.

CAD_CREATE_REORDER_CURVES:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
    - name: sorting_direction
      type: enum
      values: ["+X", "+Y", "+Z", "-X", "-Y", "-Z"]
  manual_ref: "SRC-003 p.296"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.290, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.295, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.299, same grammar as 26.120"}
  notes: >
    Sorts the selected curves along an axis, and the token is SIGNED:
    the six values are the three axes each way round, so "-Y" is a
    valid direction and not a negation of anything. This is the one
    axis argument in the family that does NOT accept a bare letter,
    since the sign carries the ordering.

    Order matters downstream rather than here: the loft commands
    consume the curves in sequence, so a loft across curves built in
    the wrong order is what this fixes.

CAD_CREATE_CONNECT_CURVES:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.294"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.288, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.293, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.297, same grammar as 26.120"}
  notes: >
    Joins the selected virtual curves into ONE curve. The manual gives
    it a sample and no parameter table, so what it does with curves that
    do not meet, and which end joins which, is not documented.

CAD_CREATE_SELF_MEDIAN_FROM_CURVES:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.294"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.288, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.293, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.297, same grammar as 26.120"}
  notes: >
    Builds the median curve of each selected virtual curve, which is
    the camber line of a closed airfoil-like curve: the manual's own
    comment calls the result thin. It is the curve-level counterpart of
    collapsing a closed section to a single surface, and the family
    that lofts a mesh from curves is what consumes it.

CAD_CREATE_CURVE_EXPORT_CCS:
  layout: param_lines
  phase: geometry
  args:
    - name: filename
      type: path
  manual_ref: "SRC-003 pp.294-295"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.289, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.293, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.297, same grammar as 26.120"}
  notes: >
    Writes the SELECTED virtual curves to a file, the command name on
    one line and the path on the next. CCS is the vendor's
    cross-sectional geometry format and the manual's own example names
    a .csv, so the extension does not identify the content.

    Its phase is GEOMETRY and not export, although it writes a file,
    which follows EXPORT_SURFACE_MESH rather than the export commands
    it is named like. The phase is not a statement about what a command
    does; it is the position the ordering rule assigns it, and the
    builder refuses anything whose phase precedes the highest reached.
    Filing a curve export under export would let it be emitted once and
    then refuse every remaining CAD Create command, which is the
    opposite of how curves are built: export a set, keep going, export
    another.
