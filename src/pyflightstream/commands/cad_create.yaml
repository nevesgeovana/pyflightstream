# --- lofted meshes from cross-sections -------------------------------------
#
# The end of the CAD Create pipeline: curves become a mesh boundary.
# All three take LOFT_TYPE_U and LOFT_TYPE_V, the same C2 and C0 pair
# SET_CAD_CREATE_SPLINE_LOFT sets as the pane default, per direction.
#
# ALL THREE DOCUMENT CLOSE_ENDS WITH THE OPEN AND CLOSED PAIR AND ALL
# THREE OF THEIR SAMPLES PASS TRUE. Three printed calls against three
# parameter tables, in every edition, which makes this the widest
# instance in the chapter of the table-versus-sample disagreement that
# utils.manual.sample_contradiction exists to catch. Three of the three
# spellings are accepted here (TRUE from the calls, OPEN and CLOSED from
# the tables), because refusing either side would refuse something the
# manual states; only TRUE is evidenced by a printed call, and which the
# solver takes is a probe question.
#
# FALSE IS NOT AMONG THEM, and it was until the review of 2026-08-07.
# No table and no sample carries it for CLOSE_ENDS in any edition: it is
# the value set of MARK_TRAILING_EDGES, the argument two rows above on
# the wing command, pasted across. That is the invented-token mistake
# the CAD_MESH argument in this same file refuses by name, made in the
# same commit that refused it.
#
# The three EXPORT_*_CCS_FILE siblings print a fourth, fifth and sixth
# call passing TRUE against their own OPEN or CLOSED tables. They are
# not in this database, so they are not counted above; they are named
# because they raise the count of the disagreement rather than the count
# of the evidence for these three entries.

CAD_CREATE_WING_MESH_FROM_CCS:
  layout: inline
  phase: geometry
  args:
    - name: name
      type: str
    - name: mark_trailing_edges
      type: enum
      values: ["TRUE", "FALSE"]
    - name: te_geometry
      type: enum
      values: [SHARP, BLUNT, BLEND, OPEN]
    - name: close_ends
      type: enum
      values: ["TRUE", OPEN, CLOSED]
    - name: loft_type_u
      type: enum
      values: [C2, C0]
    - name: loft_type_v
      type: enum
      values: [C2, C0]
  manual_ref: "SRC-003 p.300"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.294, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.299, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.303, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.304, same grammar as the 26.122 edition"}
  notes: >
    Lofts a wing mesh boundary from the CCS wing component, and NAME is
    the boundary name the rest of a script cites it by.

    LOFT_TYPE_U is CHORDWISE and LOFT_TYPE_V is SPANWISE, which the
    manual states and which the argument names do not: U and V alone
    would leave a caller guessing, and the two carry different documented
    defaults in the interface, C2 chordwise and C0 spanwise.

    TE_GEOMETRY's OPEN means the trailing edge itself is left unclosed,
    which is a different question from CLOSE_ENDS, the argument two
    positions later that closes the wing's TIPS. The two are easy to
    read as one setting because both spell a token about closing.

CAD_CREATE_FUSELAGE_MESH_FROM_CCS:
  layout: inline
  phase: geometry
  args:
    - name: name
      type: str
    - name: close_ends
      type: enum
      values: ["TRUE", OPEN, CLOSED]
    - name: loft_type_u
      type: enum
      values: [C2, C0]
    - name: loft_type_v
      type: enum
      values: [C2, C0]
  manual_ref: "SRC-003 p.302"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.297, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.301, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.305, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.306, same grammar as the 26.122 edition"}
  notes: >
    Lofts a fuselage mesh boundary from the CCS fuselage component. Here
    LOFT_TYPE_U is RADIAL and LOFT_TYPE_V is AXIAL, which is NOT what
    the same two argument names mean on the wing command above, where
    they are chordwise and spanwise. The letters index the parametric
    directions of the component, and the component decides what those
    are, so a value carried across from one command to the other means
    something else.

CAD_CREATE_REVOLVE_MESH_FROM_CCS:
  layout: inline
  phase: geometry
  args:
    - name: name
      type: str
    - name: frame
      type: int
      cites: frames
    - name: axis
      type: enum
      values: [X, Y, Z]
    - name: start_angle
      type: float
      unit: "deg"
    - name: end_angle
      type: float
      unit: "deg"
    - name: close_ends
      type: enum
      values: ["TRUE", OPEN, CLOSED]
    - name: loft_type_u
      type: enum
      values: [C2, C0]
    - name: loft_type_v
      type: enum
      values: [C2, C0]
  manual_ref: "SRC-003 p.305"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.300, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.304, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.308, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.309, same grammar as the 26.122 edition"}
  notes: >
    Lofts a body of revolution from the CCS revolve component. EIGHT
    arguments, and the signature parser reports seven for the same
    reason as CAD_CREATE_AUTO_CROSS_SECTIONS: the heading wraps and
    LOFT_TYPE_V sits alone on the second line. The sample passes eight.

    FRAME supplies the ORIGIN of the rotation axis and AXIS the
    direction, so the two together are the axis and neither is it alone.
    The angles are in degrees and run in the rotational direction, so a
    full body is 0 to 360; what a negative or a reversed pair does is
    not stated. LOFT_TYPE_U is RADIAL and LOFT_TYPE_V is AXIAL, as on
    the fuselage command and unlike the wing one.

CAD_CREATE_MIRROR_CURVES:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: retain_curve
      type: enum
      values: [RETAIN, DELETE]
  manual_ref: "SRC-003 p.295"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.289, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.294, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.298, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.299, same grammar as the 26.122 edition"}
  notes: >
    Mirrors the SELECTED virtual curves across a plane. It takes no
    curve index: which curves are mirrored comes from the selection made
    by CAD_CREATE_CURVE_SELECT, so a script that mirrors without
    selecting acts on whatever was selected before.

    THE SAMPLE CALLS THE COMMAND BY A DIFFERENT NAME. Every edition
    prints the heading as CAD_CREATE_MIRROR_CURVES and the sample line
    beneath it as CAD_CREATE_MIRROR_CURVE, without the S. The heading is
    recorded, because the Script Index agrees with it and because a
    command name is the one thing a sample cannot be right about on its
    own; PLN-20260808-2300 carries the probe.

    RETAIN_CURVE decides whether the originals survive, so DELETE makes
    this a move rather than a copy.
