    Joins the selected virtual curves into ONE curve. The manual gives
    it a sample and no parameter table, so what it does with curves that
    do not meet, and which end joins which, is not documented.

CAD_CREATE_SELF_MEDIAN_FROM_CURVES:
  layout: bare
  phase: geometry
  args: []
  manual_ref: "SRC-003 p.294"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.288, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.293, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.297, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.298, same grammar as the 26.122 edition"}
  notes: >
    Builds the median curve of each selected virtual curve, which is
    the camber line of a closed airfoil-like curve: the manual's own
    comment calls the result thin. It is the curve-level counterpart of
    collapsing a closed section to a single surface, and the family
    that lofts a mesh from curves is what consumes it.

CAD_CREATE_CURVE_EXPORT_CCS:
  layout: param_lines
  phase: geometry
  args:
    - name: filename
      type: path
  manual_ref: "SRC-003 pp.294-295"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.260, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.279, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.278, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.289, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.293, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.297, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.298, same grammar as the 26.122 edition"}
  notes: >
    Writes the SELECTED virtual curves to a file, the command name on
    one line and the path on the next. CCS is the vendor's
    cross-sectional geometry format and the manual's own example names
    a .csv, so the extension does not identify the content.

    Its phase is GEOMETRY and not export, although it writes a file,
    which follows EXPORT_SURFACE_MESH rather than the export commands
    it is named like. The phase is not a statement about what a command
    does; it is the position the ordering rule assigns it, and the
    builder refuses anything whose phase precedes the highest reached.
    Filing a curve export under export would let it be emitted once and
    then refuse every remaining CAD Create command, which is the
    opposite of how curves are built: export a set, keep going, export
    another.

# --- virtual curves: importing them ----------------------------------------
#
# Three importers, one per file format, each taking the command's
# arguments inline and the path on the following line. All three carry
# the eleven-token UNITS vocabulary the rest of this database uses, in
# the manual's own order.

CAD_CREATE_IMPORT_CURVE_TXT:
  layout: inline
  phase: geometry
  args:
    - name: units
      type: enum
      values: [INCH, MILLIMETER, OTHER, FEET, MILE, METER, KILOMETER, MILS, MICRON, CENTIMETER, MICROINCH]
    - name: dimensions
      type: enum
      values: [2D, 3D]
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: file
      type: path
      own_line: true
  manual_ref: "SRC-003 p.291"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.256, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.276, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.275, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.285, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.290, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.294, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.295, same grammar as the 26.122 edition"}
  notes: >
    Reads curve points from a text file. DIMENSIONS decides what the two
    arguments after it mean: under 2D the points are two-dimensional and
    are placed on PLANE of the coordinate system FRAME names, and under
    3D they carry their own three coordinates in FRAME and the manual
    says PLANE is IGNORED (SRC-003 p.291).

    Nothing enforces that. PLANE is required here because the schema has
    no conditional, so a 3D import must still pass one and the value is
    discarded by the solver rather than by this package
    (PLN-20260806-1150 covers the family of documented conditionals this
    database cannot express).

    The manual's own sample for this command cites frame 2, and this
    package refuses it unless the script declares that the opened
    project already carries the frame, because
    CREATE_NEW_COORDINATE_SYSTEM is a setup command and cannot precede a
    geometry one. `declare_existing(frames=2)` is the way through, and
    the underlying phase question is PLN-20260806-0900. This is the
    third CAD family to meet it, so it is recorded here rather than only
    in the chapter header.

CAD_CREATE_IMPORT_CURVE_CCS:
  layout: inline
  phase: geometry
  args:
    - name: units
      type: enum
      values: [INCH, MILLIMETER, OTHER, FEET, MILE, METER, KILOMETER, MILS, MICRON, CENTIMETER, MICROINCH]
    - name: frame
      type: int
      cites: frames
    - name: component_index
      type: int
    - name: file
      type: path
      own_line: true
  manual_ref: "SRC-003 p.291"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.285, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.290, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.294, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.295, same grammar as the 26.122 edition"}
  notes: >
    Reads cross-sections from a CCS file, which the manual says may
    carry either the .CCS or the .CSV extension, so the extension does
    not identify the format. COMPONENT_INDEX loads one component by its
    index, and -1 loads every component at once (SRC-003 p.291); this is
    the same -1 convention the curve index commands use, on a different
    kind of index.

    THE THREE PRE-26.100 EDITIONS WRITE THIS COMMAND IN A DIFFERENT
    LAYOUT and carry no row here because of it. They print the command
    name alone on its line with each parameter on a line after it,
    where 26.100 onward prints the arguments inline. A version row can
    override the argument grammar and cannot override the layout, so a
    row for those editions would emit the newer shape under an older
    build's citation, which is worse than refusing to emit at all. The
    reading exists and is withheld deliberately; the schema gap is
    PLN-20260810-1200.

CAD_CREATE_IMPORT_CURVE_P3D:
  layout: inline
  phase: geometry
  args:
    - name: units
      type: enum
      values: [INCH, MILLIMETER, OTHER, FEET, MILE, METER, KILOMETER, MILS, MICRON, CENTIMETER, MICROINCH]
    - name: swap_direction
      type: enum
      values: ["TRUE", "FALSE"]
    - name: frame
      type: int
      cites: frames
    - name: component_index
      type: int
    - name: file
      type: path
      own_line: true
  manual_ref: "SRC-003 pp.291-292"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.285, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.290, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.294, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.295, same grammar as the 26.122 edition"}
  notes: >
    Reads curves from a Plot3D structured grid. SWAP_DIRECTION chooses
    which way the walk over the grid's node data proceeds when building
    curves from it, so it changes the ORDER the curves come out in and
    therefore what a later loft joins to what.

    It is an enumeration of TRUE and FALSE rather than a bool, because a
    bool in this database is the presence keyword of a keyword_block and
    this is an inline token the solver reads as a word.

# --- cross-sections from an existing body ----------------------------------
#
# These three read a MESH BODY and write virtual curves, which is the
# opposite direction from everything above: the curves come out of
# geometry that already exists rather than being drawn.

CAD_CREATE_CROSS_SECTION:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: offset
      type: float
    - name: body_index
      type: int
    - name: quadrant
      type: int
  manual_ref: "SRC-003 pp.292-293"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.257, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.277, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.276, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.286, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.291, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.295, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.296, same grammar as the 26.122 edition"}
  notes: >
    Slices one mesh body with a plane and writes the intersection as a
    virtual curve. OFFSET moves the plane along its own normal, in the
    length units of FRAME, which the command does not state and this
    entry therefore does not either.

    QUADRANT IS 0 OR 1 TO 4, AND 1 TO 4 MEAN DIFFERENT AXES PER PLANE.
    Zero asks for no preferred quadrant. The other four are read from a
    table the manual prints against the chosen PLANE (SRC-003 p.293): on
    YZ they are the positive and negative Y then the positive and
    negative Z; on XZ the positive and negative X then the positive and
    negative Z; on XY the positive and negative X then the positive and
    negative Y. So the same integer selects a different half depending
    on the PLANE argument three positions earlier, which is why it is recorded
    here rather than left to the page.

    It is typed as an integer and not an enumeration of five: the manual
    presents 0 as a distinct instruction rather than as a fifth
    quadrant, and the solver owns the range.

CAD_CREATE_AUTO_CROSS_SECTIONS:
  layout: inline
  phase: geometry
  args:
    - name: frame
      type: int
      cites: frames
    - name: axis
      type: enum
      values: [X, Y, Z]
    - name: sections
      type: int
    - name: body_index
      type: int
    - name: growth_scheme
      type: enum
      values: ["1", "2", "3", "4"]
    - name: growth_rate
      type: float
    - name: symmetry
      type: enum
      values: [XY, XZ, YZ, NONE]
    - name: cad_mesh
      type: str
  manual_ref: "SRC-003 p.292"
  versions:
    "25.000":
      status: documented
      note: "SRC-749 p.257, this edition's own grammar; see the note below"
      args:
        - name: frame
          type: int
        - name: axis
          type: enum
          values: ["X", "Y", "Z"]
        - name: sections
          type: int
        - name: body_index
          type: int
        - name: growth_scheme
          type: enum
          values: ["1", "2", "3", "4"]
        - name: growth_rate
          type: float
        - name: symmetry
          type: enum
          values: ["XY", "XZ", "YZ", "NONE"]
    "25.100": {status: documented, note: "SRC-748 p.276, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.275, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.286, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.291, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.295, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.296, same grammar as the 26.122 edition"}
  notes: >
    Sweeps a body along an axis and writes a series of cross-section
    curves. EIGHT arguments, and the signature parser reports seven: the
    heading WRAPS in every edition and CAD_MESH sits alone on the second
    line. The sample passes eight tokens, which is what settles it.

    GROWTH_SCHEME is a numbered choice of four and the numbers are the
    tokens: 1 uniform, 2 successive, 3 dual-successive, 4
    reverse-successive (SRC-003 p.292). It is spelled as a closed set
    rather than as an integer because an out-of-range scheme would
    silently change the mesh, and it must be passed as a string
    (PLN-20260806-1130). GROWTH_RATE is the rate that scheme uses, and
    1.0 is the uniform spacing the manual names.

    SYMMETRY takes a plane to produce HALF sections, or NONE for full
    ones, so it is not the same vocabulary as the PLANE argument
    elsewhere in this chapter even though three of its four tokens
    match.

    CAD_MESH is typed as free text, deliberately. The manual describes
    it in prose as saying whether BODY_INDEX names a CAD component or a
    mesh boundary, and enumerates nothing; the only spelling any edition
    prints is MESH, in the sample. Writing an enumeration here would
    mean inventing the other token, which is the mistake this chapter
    has already made twice, so the value set is a probe question rather
    than a citation.

CAD_CREATE_AUTO_ANNULAR_CROSS_SECTIONS:
  layout: inline
