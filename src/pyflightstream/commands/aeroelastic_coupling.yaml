# Aeroelastic Coupling Toolbox scripting commands (SRC-003 pp.375-376;
# new in 26.1 per the release notes). This is the command family the
# solver actually implements for FSI coupling: the SET_MOTION_FSI pair
# of the motion chapter (SRC-003 pp.335-336) is rejected as
# unrecognized by build 7012026 (WP1 dry run evidence,
# reports/RPT-005_fsi-dry-run_2026-07-21.md). All eleven commands of
# this family were exercised successfully in that dry run on 26.120;
# formal Tier 2 promotion follows the next validity sweep (PLN-019).
#
# Behavior finding on build 7012026 (WP7 probes,
# reports/RPT-007_soft-pilot-morphing-investigation_2026-07-21.md):
# the coupling loop runs end to end, and FSIDisp.txt is read every
# step, but the mesh morphing is silently NOT applied to boundaries
# attached to a rotary motion definition; a motionless boundary morphs
# correctly with the same command sequence. Two-way rotor FSI is
# therefore blocked in this build (candidate solver defect; the
# documented workflow at SRC-003 p.273 names rotors). A malformed
# FSIDisp.txt crashes the solver (access violation) instead of
# raising an error.
#
# THE 26.123 EDITION DOCUMENTS AN INTERNAL CONVERGENCE CRITERION FOR THIS
# LOOP, AND NAMES NO COMMAND THAT SETS IT (SRC-751 p.277).
#
# What that page adds, in this repository's terms rather than its own:
# the coupling loop has a stopping test of its OWN, separate from the
# solver's flow-field convergence, and the quantity it tests is how far
# the structural nodes moved between one coupling pass and the next,
# reduced to a single root-mean-square figure. The loop ends when that
# figure falls to a threshold the page attributes to the runtime
# settings. Nothing of that kind is described in the 26.122 edition,
# which is what makes it new documentation rather than a rewording.
#
# WHY IT MATTERS HERE RATHER THAN AS TRIVIA: the package drives this loop
# from outside, so a criterion the solver applies internally decides when
# our driver stops receiving iterations, and a user reading a converged
# coupled run needs to know the test is not ours.
#
# THE GAP IS RECORDED AS A GAP because it is the part with consequences:
# the page names the tolerance and not the command, so the script-level
# mapping is UNVERIFIED and no entry is added here for it. The nearest
# candidate is SOLVER_SET_CONVERGENCE, and it is NOT the same thing:
# its own note scopes it to the surface velocity and pressure residual
# (SRC-003 p.200). A search of this edition's scripting reference and
# its Script Index is what would close it, and until one runs, nothing
# in this repository claims a command sets this tolerance.
#
# A SECOND CLAIM IS NAMED HERE AS UNCORROBORATED rather than left in
# correspondence: that the internal loop can drive a modal structural
# representation with no external structural solver. That came from
# delivery correspondence and no edition states it.

EXECUTE_AEROELASTIC_ANALYSIS:
  layout: bare
  phase: exec
  args: []
  manual_ref: "SRC-003 p.375"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.374, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.378, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.382, same grammar as the 26.122 edition"}
  notes: >
    Runs the steady-state aeroelastic analysis. For unsteady coupling
    the manual instructs the regular solver execution with
    SET_AEROELASTIC_COUPLING_IN_UNSTEADY enabled instead (SRC-003
    p.275).

ASSIGN_AEROELASTIC_SURFACES:
  layout: payload_lines
  phase: init
  args:
    - name: num_boundaries
      type: int
    - name: boundary_indices
      type: int_list
      cites: boundaries
      separator: newline
      required: false
  manual_ref: "SRC-003 p.375"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.374, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.378, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.382, same grammar as the 26.122 edition"}
  notes: >
    Mesh boundaries whose deflections the toolbox interpolates; one
    index per line after the count, -1 selects all boundaries with no
    index lines.

ASSIGN_AEROELASTIC_COORDINATE_SYSTEMS:
  layout: payload_lines
  phase: init
  args:
    - name: num_index
      type: int
    - name: frame_indices
      type: int_list
      cites: frames
      separator: newline
      required: false
  manual_ref: "SRC-003 p.375"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.374, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.378, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.382, same grammar as the 26.122 edition"}
  notes: >
    Links user-defined coordinate systems for the aeroelastic
    interpolation, one index per line after the count.

    THE PAGE FORBIDS A VALUE OF 1 AND DOES NOT SAY WHICH VALUE. The
    parameter table has a single row, NUM_INDEX, which is the count; the
    index lines have no row of their own. On that row the manual says
    setting the value to 1, glossed as the reference, throws an error.
    So the sentence sits on the COUNT and its gloss describes an INDEX,
    and the two readings differ: a count of exactly one coordinate
    system refused, or the reference frame refused among the indices.
    The sample settles nothing, passing a count of 3 and the indices 2,
    3 and 4, which satisfies both. The three editions that carry this
    chapter word it identically (SRC-725 p.374, SRC-003 p.375, SRC-740
    p.378); the February 2026 edition has no Aeroelastic Coupling
    Toolbox at all, its scripting reference ending at the Acoustics
    Toolbox (SRC-741 p.369), so no edition disagrees and none settles
    it.

    Nothing is enforced here for that reason. This entry previously
    asserted the index reading as fact, which was an interpretation
    presented as a citation; PLN-20260808-1100 carries the probe.

IMPORT_AEROELASTIC_STRUCTURAL_NODES:
  layout: inline
  phase: init
  args:
    - name: structural_coordinate_system
      type: int
      cites: frames
    - name: delete_existing
      type: enum
      values: [ENABLE, DISABLE]
    - name: nodes_path
      type: path
      own_line: true
  manual_ref: "SRC-003 p.375"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.374, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.378, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.382, same grammar as the 26.122 edition"}
  notes: >
    Imports the structural node list; the file is three comma
    separated columns X,Y,Z per node (SRC-003 p.274), interpreted in
    the given coordinate system. The node order fixes the FSIDisp.txt
    displacement order.

DELETE_AEROELASTIC_STRUCTURAL_NODES:
  layout: bare
  phase: init
  args: []
  manual_ref: "SRC-003 p.375"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.374, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.378, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.382, same grammar as the 26.122 edition"}
  notes: Deletes all imported structural nodes.

SET_AEROELASTIC_WORKING_DIRECTORY:
  layout: inline
  phase: init
  args:
    - name: directory_path
      type: path
      own_line: true
  manual_ref: "SRC-003 p.375"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.374, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.378, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.382, same grammar as the 26.122 edition"}
  notes: >
    Runtime folder of the coupling: FlightStream writes FSIDisp.txt
    and the loads exports there and executes the runtime command
    there (SRC-003 pp.274-275). The dry run confirmed it is the
    working directory of the external executable's process.

SET_AEROELASTIC_POST_PROCESSING_SCRIPT:
  layout: inline
  phase: init
  args:
    - name: script_path
      type: path
      own_line: true
  manual_ref: "SRC-003 p.376"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.375, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.379, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.383, same grammar as the 26.122 edition"}
  notes: >
    FlightStream script executed between FSI iterations, before the
    external executable; the documented mechanism for exporting the
    aerodynamic forces the executable consumes (SRC-003 p.275), for
    example the surface section loads export.

SET_AEROELASTIC_STRUCTURAL_EXECUTION_COMMAND:
  layout: inline
  phase: init
  args:
    - name: command
      type: str
      own_line: true
  manual_ref: "SRC-003 p.376"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.375, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.379, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.383, same grammar as the 26.122 edition"}
  notes: >
    Full command executed per coupling iteration in the working
    directory. The dry run observed a bare invocation: no arguments
    are appended by the solver.

SET_AEROELASTIC_ITERATIONS:
  layout: inline
  phase: init
  args:
    - name: num_iterations
      type: int
  manual_ref: "SRC-003 p.376"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.375, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.379, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.383, same grammar as the 26.122 edition"}
  notes: >
    Two-way coupling iterations: the total count in steady mode, the
    count per time step in unsteady mode (SRC-003 p.275).

SET_AEROELASTIC_COUPLING_IN_UNSTEADY:
  layout: inline
  phase: init
  args:
    - name: state
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-003 p.376"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.375, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.379, same grammar as 26.120"}
    "26.123": {status: documented, note: "SRC-751 p.383, same grammar as the 26.122 edition"}
  notes: >
    Toggles the FSI execution inside the unsteady solver; with ENABLE
    the coupling runs on the regular solver start.
