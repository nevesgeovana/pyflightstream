# Chapter: Scripting reference, Solver Contours (SRC-003 pp.349-350).
#
# COMPLETE as of 2026-08-08, entered from all four registered editions in
# one pass. The one command of the chapter, with the same 33 values in
# all four.

SET_SCENE_CONTOUR:
  layout: inline
  phase: analysis
  args:
    - name: variable
      type: enum
      values:
        - none
        - x
        - y
        - z
        - face_area
        - face_quality
        - pressure_coefficient_freestream
        - pressure_coefficient_reference
        - static_pressure_ratio
        - mach_number
        - velocity_x
        - velocity_y
        - velocity_z
        - velocity_magnitude
        - onset_velocity_x
        - onset_velocity_y
        - onset_velocity_z
        - onset_velocity_magnitude
        - solver_partition
        - skin_friction_coefficient
        - attachment_lines
        - displacement_thickness
        - momentum_thickness
        - shape_factor
        - streamline_length
        - transition
        - transpiration_velocity
        - separation
        - doublet_strength
        - source_strength
        - stabilization
        - proximity
  manual_ref: "SRC-003 pp.349-350"
  versions:
    "26.000": {status: documented, note: "SRC-747 p.322, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 pp.345-346, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 pp.348-349, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 pp.352-353, same grammar as 26.120"}
  notes: >
    Selects the scalar field drawn on the surfaces of the solver scene.

    THE VALUES ARE LOWERCASE AND THAT IS NOT A TRANSCRIPTION CHOICE.
    Every other closed set in this database is uppercase, because that
    is how the manual prints them; this page prints these 33 in lower
    case, and they are recorded as printed.

    What a caller writes does not matter and what the SCRIPT carries
    does: enum matching is case-insensitive across this whole database
    and normalises to the declared member, so MACH_NUMBER and
    mach_number both emit mach_number. Whether the solver itself cares
    about the case is untested; recording the page's own spelling is
    what makes the question moot for anyone using this emitter.

    THE PAGE HAS NO RUNNABLE SAMPLE. Its sample line prints the
    placeholder rather than a value, so unlike most of this manual there
    is no example call to compare the table against. The 33 tokens are
    the table's alone.

    `none` is one of them, and it is the way to clear the contour rather
    than a way of saying nothing: there is no separate clear command.

    Several tokens name boundary-layer fields, which exist only once a
    viscous solution has been computed. Nothing here can check that, so
    selecting one before the run is a scene showing an empty field
    rather than an error.

    THE TWO 25 EDITIONS WRITE THIS COMMAND AS A KEYWORD BLOCK and carry
    no row here because of it. They print KEY VALUE lines until a
    terminator, where 26.000 onward prints the arguments inline. A
    version row can override the argument grammar and cannot override
    the layout, so a row for those editions would emit the newer shape
    under an older build's citation, which is worse than refusing to
    emit at all. The reading exists and is withheld deliberately; the
    schema gap is PLN-20260810-1200.
