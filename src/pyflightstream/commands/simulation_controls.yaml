# Chapter: Scripting, Simulation Controls (SRC-003 p.284).

SET_SIMULATION_LENGTH_UNITS:
  layout: inline
  phase: setup
  args:
    - name: units
      type: enum
      values: [INCH, MILLIMETER, OTHER, FEET, MILE, METER, KILOMETER,
               MILS, MICRON, CENTIMETER, MICROINCH]
  manual_ref: "SRC-003 p.284"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.254, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.274, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.273, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.278, same grammar as 26.120"}
    "26.101": {status: verified, report: "reports/compat/CMP-26101_2026-08-08_full.yaml"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Selects the simulation length scale unit; geometry dimensions and
    length-typed command arguments are interpreted in this unit.

SET_SIGNIFICANT_DIGITS:
  layout: inline
  phase: setup
  args:
    - name: digits
      type: int
  manual_ref: "SRC-003 p.284"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.254, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.274, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.273, same grammar as 26.120"}
    "26.121": {status: documented, note: "SRC-740 p.287, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.283, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.278, same grammar as 26.120"}
    "26.120": {status: documented}
  notes: >
    Output precision, integer between 1 and 8; applies to the values
    the solver writes into its exports.

SET_TRAILING_EDGE_SWEEP_ANGLE:
  layout: inline
  phase: setup
  args:
    - name: angle
      type: float
      unit: "deg"
  manual_ref: "SRC-003 p.284"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.254, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.274, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.273, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.278, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.283, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.287, same grammar as 26.120"}
  notes: >
    Threshold used by trailing-edge detection: how far an edge may sweep
    away from the reference direction and still be detected. The manual
    bounds it between 0 and 90 degrees; the bound is not enforced, which
    is this database's standing treatment of the manual's stated bounds.

    It configures AUTO_DETECT_TRAILING_EDGES and
    DETECT_TRAILING_EDGES_BY_SURFACE, so it has no effect unless one of
    them runs afterwards.

SET_TRAILING_EDGE_BLUNTNESS_ANGLE:
  layout: inline
  phase: setup
  args:
    - name: angle
      type: float
      unit: "deg"
  manual_ref: "SRC-003 p.284"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.255, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.274, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.273, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.278, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.283, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.287, same grammar as 26.120"}
    "26.122":
      status: removed
      successor: SET_GEOMETRIC_EDGE_BLUNTNESS_ANGLE
      note: >-
        SRC-750 pp.283-383, the scripting reference of the 26.122
        edition, does not print this command anywhere, AND THAT
        EDITION'S INDEX DISAGREES WITH ITS OWN BODY: while its Script Index at
        pp.384-390 still names it and does not name
        SET_GEOMETRIC_EDGE_BLUNTNESS_ANGLE. The body is the reading recorded, on
        the rule that a script is written from a signature heading and
        an index entry only points at one, so an index lagging its own
        body is a defect of that document rather than a second opinion
        about the solver. The index is incomplete in BOTH
        directions and neither half of it carries much: counted over
        the ten commands this edition is the first to document, five
        are in it and five are not, and it keeps four names the body
        dropped plus one, SOLVER_INITIALIZATION, that is not a
        command at all. So the body wins here on the rule and not on
        any property of this index. A first draft of this note said
        the index was maintained by addition, which was one
        observation generalised and the count refutes it. The
        same edition is the first to print
        SET_GEOMETRIC_EDGE_BLUNTNESS_ANGLE, which takes one
        angle in degrees in the same place on the same page.
        Recorded as removed rather than left to inheritance for
        the reason given on SURFACE_ROTATE. The successor names
        a GEOMETRIC edge where this names a trailing edge, which
        is the wider thing, and no edition says whether the
        criterion moved with the name. No probe has asked the
        26.122 solver whether it still answers this name.
  notes: >
    The other trailing-edge detection threshold: how blunt an edge may
    be and still count as a trailing edge.

    ITS RANGE DOES NOT START AT ZERO. The manual bounds it between 45
    and 179 degrees, where the sweep angle above starts at 0, so the two
    thresholds on the same page are not interchangeable and a value
    valid for one may be outside the other's range. Neither bound is
    enforced.

SET_VERTEX_MERGE_TOLERANCE:
  layout: inline
  phase: setup
  args:
    - name: tolerance
      type: float
      unit: "simulation length units"
  manual_ref: "SRC-003 p.284"
  versions:
    "25.000": {status: documented, note: "SRC-749 p.254, same grammar as 26.120"}
    "25.100": {status: documented, note: "SRC-748 p.274, same grammar as 26.120"}
    "26.000": {status: documented, note: "SRC-747 p.273, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.278, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.283, same grammar as 26.120"}
    "26.120": {status: documented}
    "26.121": {status: documented, note: "SRC-740 p.287, same grammar as 26.120"}
  notes: >
    Distance below which two mesh vertices are treated as one, which is
    what closes the gaps of an imported surface. The manual states only
    that the value is not negative.

    IT IS A LENGTH AND THE SIMULATION LENGTH UNIT DECIDES WHAT IT MEANS.
    The manual's sample passes 1E-5, which is a reasonable tolerance in
    metres and a very large one in microns, so the same number does
    different things under SET_SIMULATION_LENGTH_UNITS. No edition
    mentions the interaction.

SET_GEOMETRIC_EDGE_BLUNTNESS_ANGLE:
  layout: inline
  phase: setup
  args:
    - name: angle
      type: float
      unit: "deg"
  manual_ref: "SRC-750 p.288"
  notes: >
    Angle above which a geometric edge counts as blunt, from 45 to
    179 degrees. First documented by the 26.122 edition, which is
    also the first to stop printing
    SET_TRAILING_EDGE_BLUNTNESS_ANGLE.

    The two take one angle in degrees and stand in the same place on
    the page, so this one is where a script porting forward moves.
    The name change is not cosmetic: the older one names the
    trailing edge and this one names a geometric edge, which is the
    wider thing, and no edition states whether the criterion changed
    with the name. The manual's stated range is not enforced here,
    because the database records grammar and the solver owns the
    range.
  versions:
    "26.122":
      status: documented
      note: "SRC-750 p.288, the first edition to document it"
