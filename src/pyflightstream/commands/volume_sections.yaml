  layout: inline
  phase: analysis
  args:
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: offset
      type: float
    - name: ipts
      type: int
    - name: jpts
      type: int
    - name: r1
      type: float
    - name: r2
      type: float
    - name: prisms_type
      type: enum
      values: [NONE, PRISMS]
    - name: thickness
      type: float
    - name: layers
      type: int
    - name: growth_rate
      type: float
  manual_ref: "SRC-003 p.366"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.365, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.360, same grammar as 26.120"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Annular flow-field section with IPTS radial and JPTS azimuth
    segments between the inner and outer radii; the natural plane for
    slipstream surveys behind an actuator disc.

VOLUME_SECTION_BOUNDARY_LAYER:
  layout: inline
  phase: analysis
  args:
    - name: index
      type: int
    - name: mode
      type: enum
      values: [ENABLE, DISABLE]
  manual_ref: "SRC-725 p.365"
  versions:
    "26.100": {status: documented, note: "SRC-741 p.360, same grammar as 26.120"}
    "26.101": {status: documented}
    "26.120":
      status: removed
      note: >-
        absent from the 26.12 manual: the Volume Sections family
        (SRC-003 pp.366-367) no longer lists the command and the
        Script Index does not carry it; no replacement documented
  notes: >
    Toggles boundary-layer induction on one volume section (index
    greater than 0). Documented in 26.1 only (SRC-725 p.365); the
    command disappeared from the manual at 26.12 with no successor in
    the Volume Sections family.

UPDATE_ALL_VOLUME_SECTIONS:
  layout: bare
  phase: analysis
  args: []
  manual_ref: "SRC-003 p.366"
  versions:
    "26.121": {status: documented, note: "SRC-740 p.369, same grammar as 26.120"}
    "26.101": {status: documented, note: "SRC-725 p.366, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.361, same grammar as 26.120"}
    "26.120": {status: documented}

EXPORT_VOLUME_SECTION_VTK:
  layout: inline
  phase: export
  args:
    - name: index
      type: int
    - name: filename
      type: path
      own_line: true
  manual_ref: "SRC-003 pp.366-367"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.366, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.361, same grammar as 26.120"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    The file path follows on the line after the section index.

