# Chapter: Scripting reference, Post Processing, Volume Sections
# (SRC-003 pp.366-367). Volume sections are the flow-field planes the
# flux integration work extracts.

CREATE_NEW_RECTANGLE_VOLUME_SECTION:
  layout: inline
  phase: analysis
  args:
    - name: frame
      type: int
      cites: frames
    - name: plane
      type: enum
      values: [XY, XZ, YZ]
    - name: offset
      type: float
    - name: refinement_layers
      type: int
    - name: x1
      type: float
    - name: y1
      type: float
    - name: x2
      type: float
    - name: y2
      type: float
    - name: prisms_type
      type: enum
      values: [NONE, PRISMS, PRISMS_ONLY]
    - name: thickness
      type: float
    - name: layers
      type: int
    - name: growth_rate
      type: float
  manual_ref: "SRC-003 p.366"
  versions:
    "26.101": {status: documented, note: "SRC-725 p.365, same grammar as 26.120"}
    "26.100": {status: documented, note: "SRC-741 p.360, same grammar as 26.120"}
    "26.120": {status: verified, report: "reports/compat/CMP-26120_2026-08-08_full.yaml"}
    "26.121": {status: verified, report: "reports/compat/CMP-26121_2026-08-08_full.yaml"}
  notes: >
    Rectangular flow-field section between two diagonal corners, with
    optional near-wall prism cell layers.

