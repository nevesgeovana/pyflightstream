# Config for the kit's check_shipped_surface.py (vendored at 0.2.18, PFS-12).
#
# THE RULE AND ITS TOKENS LIVE IN THE KIT BODY, deliberately: a token spelled
# here would ship inside the sdist and make this file the one file able to
# defeat the rule, which is what an earlier implementation of this class did.
# What lives here is only what genuinely differs between repositories.
#
# The exemptions below are files whose identifier is AUTHORSHIP: naming the
# author is what they are for. They match this repository's own long-standing
# division, which is that the author's name in a citation, a licence or a
# changelog is the point, and the same name inside `src/` ships in the wheel
# and is not (the tier-1 guard in tests/test_house_style.py scopes its refusal
# to `src/` for exactly that reason, after BRF-049).

exempt-path: LICENSE
exempt-path: CITATION.cff
exempt-path: README.md
exempt-path: CHANGELOG.md
exempt-path: CONTRIBUTING.md
exempt-path: CLAUDE.md
exempt-path: pyproject.toml

# The user guide's own author line: a LaTeX \author macro and the comment
# above it. That is the byline of a document, the same category as
# CITATION.cff, and not the leak of a machine's owner.
#
# The macro's argument is NOT quoted here, and the first draft of this comment
# did quote it. The checker refused this very file for it, which is the rule
# working exactly as its own docstring says: a token spelled in the config
# would ship inside the sdist and make the config the one file able to defeat
# the rule. Describe the finding, never reproduce it.
exempt-path: guide/pyflightstream_user_guide.tex

# ACCOUNT NAMES USED AS ADDRESSES, which is a third category and is why these
# two are listed apart with their own reason.
#
# `.github/workflows/release.yml` names the account in the trusted-publisher
# description because PyPI MATCHES on it: owner, repository, workflow file and
# environment together are the publisher identity, and a comment that omitted
# the owner would document a configuration nobody could reproduce.
#
# `properdocs.yml` carries `site_url` and `repo_url`. Those are addresses on
# github.io and github.com, and an account name is what an address on those
# hosts is made of. There is no spelling of them that omits it.
#
# RESIDUAL, and it applies to every `exempt-path` line in this file rather
# than only to these two: the checker exempts by PATH, so a genuine identifier
# added to an exempted file later is not caught by this rule. The one TREE
# exemption below (`docs/`) is wider still and is the only one, deliberately.
# Every exempted file here is small and read at every release, which is the
# whole of the mitigation.
exempt-path: .github/workflows/release.yml
exempt-path: properdocs.yml

# The decision record. The SRS, the architecture pages and the guides all name
# who decided what, and a requirement whose owner is anonymous is not a
# requirement.
exempt-tree: docs/

# COMMITTED EVIDENCE, and this exemption is different in kind from the ones
# above, so it is not folded in with them. THREE files under reports/ carry the
# author's given name, named one per line rather than exempted as a tree. They
# are committed probe reports, and the decision of record (HND-050, reaffirmed
# at HND-051) is that they must NOT be edited: rewriting a report after the
# fact is a report-immutability violation worse than the finding it clears. So
# each is a statement that THIS FILE is out of the rule's reach by decision,
# not that the tree is clean.
#
# `exempt-tree: reports/` was the first draft and was NARROWED on 2026-08-12
# after a V and V pass measured what it actually covered: 118 files, every
# report written after tonight, and the family-name and institution tokens
# which occur there not at all. The decision of record is about three existing
# immutable files; the tree form quietly extended it to a directory that grows
# at every probe session, and the identifier enters a report through an
# authored `reason:` string, which is the same field that had to be rewritten
# once already under BRF-049. Report number 119 is now inside the rule again.
exempt-path: reports/RPT-004_probe-roundtrip-order_2026-07-21.md
exempt-path: reports/physics/PHY-26120_2026-07-21_phy06-polar-banded.yaml
exempt-path: reports/physics/PHY-26120_2026-07-23_reseed-cp100-2026-07-23.yaml

# NO FLOORS ARE DECLARED, and that is a limitation rather than a setting.
#
# The floors name files the scan MUST have read, so that a boundary reporting a
# clean artifact cannot mean it opened almost nothing. They are used only by
# the ARTIFACT boundary, over a built wheel and sdist, and this repository does
# not run that boundary yet: PFS-12 wired the TREE boundary alone, because
# wiring a scan of built artifacts needs a build in the loop and that was not a
# night job. Adding `--dist` later means adding a wheel-floor and an
# sdist-floor here in the same change, and the checker will refuse the artifact
# boundary without them.
