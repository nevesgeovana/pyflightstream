# r005: the reference block of the qa wing cases, PHY-01, PHY-02 and PHY-06.
# The planform of r001 (chord 1 m, span 8 m, area 8 m^2) with the MOMENT
# POINT AT THE ORIGIN, the leading edge of the root section, which is where
# the hand-built qa scripts leave it: they emit no moment point, and the
# solver's default is the global origin. r001 moves it to the quarter chord,
# which is right for the tour and wrong for a reference whose pitching-moment
# slope was recorded about the origin (measured 2026-09-08: -0.011 per rad
# about the quarter chord against a reference of -1.215 about the origin,
# which is CL_alpha times a quarter chord).
area_m2 = 8.0      # SREF, m^2: chord x span
chord_m = 1.0      # CREF, m
span_m = 8.0       # BREF, m
rotor_diameter_m = 3.6576   # as r001, so the unsteady wing row's clock resolves


# THE STUDY'S OWN WORDS (FR-59). `airframe` and `blades` were SELECTOR words
# until 0.15.0: the package decided what was a blade from a pattern over the
# family name, so a mesh whose blades are spelled another way got an airframe
# with blades in it and nothing said so. A study that names its surfaces
# cannot be guessed wrong. A member the opened mesh does not carry is left
# out, which is what lets one table serve every geometry this reference is
# cited against.
[aliases]
airframe = ["Wing", "MainWing", "Body", "Base"]
blades = ["Blade1", "Blade2"]

[moment_point]
x_m = 0.0
y_m = 0.0
z_m = 0.0

[rotor]
radius_m = 1.8288
n_blades = 2
pitch_deg = 0.0
toe_deg = 0.0

[rotor.position]
x_m = -3.0
y_m = 0.0
z_m = 0.0
