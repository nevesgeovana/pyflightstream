# Reference of the synthetic rotor: one blade of pyflightstream.qa.geometry
# .BladeSpec, tip radius 1.8288 m, meshed alone; the row's SYMMETRY PERIODIC
# supplies the wheel. The same numbers the PHY-05 physics case runs against,
# so the reference bands under qa/references keep their meaning.
area_m2 = 10.0     # SREF, m^2, PHY-05's reference area
chord_m = 2.0      # CREF, m, PHY-05's reference length
span_m = 3.6576    # BREF, m: the rotor diameter
rotor_diameter_m = 3.6576   # D = 2 x 1.8288 m


# THE STUDY'S OWN WORDS (FR-59). `airframe` and `blades` were SELECTOR words
# until 0.15.0: the package decided what was a blade from a pattern over the
# family name, so a mesh whose blades are spelled another way got an airframe
# with blades in it and nothing said so. A study that names its surfaces
# cannot be guessed wrong. A member the opened mesh does not carry is left
# out, which is what lets one table serve every geometry this reference is
# cited against.
[aliases]
airframe = ["Wing", "MainWing", "Body", "Base"]
blades = ["Blade1", "Blade2"]

[moment_point]
x_m = 0.0
y_m = 0.0
z_m = 0.0

[rotor]
radius_m = 1.8288
n_blades = 1       # one blade meshed; PERIODIC in the row supplies the others
pitch_deg = 0.0
toe_deg = 0.0

[rotor.position]
x_m = 0.0
y_m = 0.0
z_m = 0.0

# ONE BLOCK PER ROTOR, and the block's NAME is an alias over everything that
# rotor owns (FR-60). After this a row names the rotor and states nothing
# else about it. The mesh carries one blade and the row's SYMMETRY PERIODIC
# supplies the wheel, so families_blades lists the one family that is there.
[ROTOR]
kind = "rotor"
x_m = 0.0
y_m = 0.0
z_m = 0.0
axis = "X"
rpm_sign = 1
diameter_m = 3.6576   # D = 2 x 1.8288 m, the tip radius the blade was lofted to
families_general = []
families_blades = ["Blade1"]
blade1 = { azimuth_deg = 0.0, zero = "Y" }
