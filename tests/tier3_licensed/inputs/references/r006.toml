# THE TWIN CONFIGURATION IN THE 0.15.0 VOCABULARY, beside r004 which states
# the same aircraft in the vocabulary of 0.14.0. Both are kept on purpose:
# r004 is what an existing workspace looks like, and this is what it becomes,
# so a reader can diff the two files rather than read a description of the
# difference.
#
# It opens 41_TWIN.fsm, a SYNTHETIC geometry generated by
# tests.tier3_licensed.recipes from public shape laws, whose provenance file
# beside it records the generator and the specification. Nothing of the
# author's went into it, which is why this workspace can be committed.
#
# The mesh carries four boundaries and no more: Body, Base, Blade1, Blade2.
# Every family named below is one of them, because a family the opened mesh
# does not carry is left out and a reference that names imaginary parts
# teaches a reader nothing.

area_m2 = 10.507   # SREF, m^2: pi x 1.8288^2, one rotor disk
chord_m = 4.0      # CREF, m: the body length
span_m = 3.6576    # BREF, m: the rotor diameter

[moment_point]
x_m = 2.0
y_m = 0.0
z_m = 0.0

# THE STUDY'S OWN WORDS. An alias is a name this study gives to a set of
# boundaries, and it is read wherever a boundary is cited: a MOVING_BC_ALIAS,
# a ROTATE record, a BASE_REGIONS cell, a [groups] member and a `families`
# entry of the post-processing artifact. A member may be another alias and
# the reader follows it to the end; a member the opened mesh does not carry
# is left out, which is what lets this one file serve the twin mesh and an
# isolated rotor.
[aliases]
airframe = ["Body", "Base"]
# A GROUP OF ROTORS is written as a list of ROTOR NAMES, not of families.
# An entry citing it reaches every rotor in it.
rotors = ["PORT", "STARBOARD"]

# A CUSTOM COORDINATE SYSTEM, declared here since 0.15.0 because a frame is
# geometric data and belongs beside the lengths and the rotors. A row's
# ROTATE axis token and a post-processing entry's frame key resolve against
# these by name; the package's own names stay reserved.
[[frames]]
name = "NACELLE"
origin = [4.5, 0.0, 0.0]

# ONE BLOCK PER ROTOR, and the block's NAME is an alias over everything that
# rotor owns. After this a row names the rotor and states nothing else about
# it: the hub, the axis, the sign, the blade families and the diameter are
# all here, once.
#
# THE TWO DIAMETERS DIFFER DELIBERATELY. One advance ratio written once in a
# row's FLIGHT_CONDITION resolves against each rotor's OWN diameter, so
# unlike rotors turn at unlike speeds from one number. Equal diameters would
# demonstrate nothing.
[PORT]
kind = "rotor"
x_m = 4.5
y_m = 0.9144
z_m = 0.0
axis = "X"
rpm_sign = 1
diameter_m = 3.6576
families_general = []
families_blades = ["Blade1"]
# WHERE BLADE 1 IS, not which family it is: the azimuth its span sits
# at and the axis that angle is measured from. The families are the
# list above; this locates the first of them so a per-blade frame can
# be placed.
blade1 = { azimuth_deg = 0.0, zero = "Y" }

[STARBOARD]
kind = "rotor"
x_m = 4.5
y_m = -0.9144
z_m = 0.0
axis = "X"
rpm_sign = -1        # counter-rotating, which is what the sign is for
diameter_m = 1.8288  # half the port diameter, so one ratio gives two speeds
families_general = []
families_blades = ["Blade2"]
blade1 = { azimuth_deg = 0.0, zero = "Y" }
