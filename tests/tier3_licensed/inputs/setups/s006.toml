# s006: the qa physics preset of PHY-05, the rigid unsteady periodic
# propeller. Every key is a line pyflightstream.qa.physics.build_phy05_script
# emits and nothing else is stated; the row's ADVANCE_RATIO, DELTA_THETA and
# REVOLUTIONS supply the rotor speed and the clock the script computes.
# Stabilization is absent because the qa script emits none (the first version
# of this preset enabled it, and the row's thrust came out 11 percent low
# beside the wake termination below, 2026-09-08).
significant_digits = 7
induced_wake_velocity = true               # SOLVER_SET_MESH_INDUCED_WAKE_VELOCITY ENABLE
farfield_layers = 5
wake_termination_steps = -36               # SET_WAKE_TERMINATION_TIME_STEPS -36, one revolution back
set_solver_model = "SUBSONIC_PRANDTL_GLAUERT"
proximity_avoidance = "DISABLE"
NITER = 500
convergence = 1e-5
max_parallel_threads = 8
boundary_layer_type = "TURBULENT"
viscous_coupling = false
convergence_iterations = 20
solver_minimum_cp = -100
additional_wake_relaxation_iteration = "DISABLE"
reynolds_averaged_drag_forces = "DISABLE"
wake_on_wake_induction = "ENABLE"
unsteady_pressure_kutta = "DISABLE"
symmetry_loads = false                     # SET_ANALYSIS_SYMMETRY_LOADS DISABLE

[flight_condition]
MUPas = 1.789e-5                           # PHY05_FLUID
ASMPS = 340.29
TK = 288.15
PPA = 101325
