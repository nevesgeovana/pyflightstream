# s006: s002 with a CUSTOM FLAG declared (FR-74). It is a preset of its own
# rather than an addition to s002 because a LEGACY row of the tour cites
# s002, and a LEGACY row is built by its own recipe, which reads no flags
# table: the declaration would reach no script while the record claimed it.
#
# The vocabulary matrix's row 8006 is what uses it.
boundary_layer_type = "TURBULENT"
viscous_coupling = false
convergence = 1e-5
max_parallel_threads = 8
NITER = 300
set_solver_model = "SUBSONIC_PRANDTL_GLAUERT"
proximity_avoidance = "DISABLE"
stabilization = "ENABLE"
stabilization_strength = 1.0
symmetry_loads = false
induced_wake_velocity = true
farfield_layers = 3
significant_digits = 7
convergence_iterations = 10
solver_minimum_cp = -100
unsteady_pressure_kutta = "DISABLE"
additional_wake_relaxation_iteration = "DISABLE"
reynolds_averaged_drag_forces = "DISABLE"
wake_on_wake_induction = "ENABLE"
# No induced-drag selection: this preset serves the wing and the rotor rows alike,
# and a family list a geometry lacks is refused as an empty selection. s003 states one.

# A CUSTOM FLAG (FR-74): the preset names a FlightStream command and the word
# a row writes for it, and the ROW states the value. That is the difference
# from a [[raw]] entry, which fixes the whole line here so every row citing
# this preset emits the same one: a flag lets one preset serve a SWEEP over
# the value. The line passes the same emit check every curated emission
# passes, so a wrong command or a wrong type is refused at plan time.
[[flags]]
name = "base_bending"
command = "SET_BASE_REGION_BENDING_ANGLE"

[flight_condition]
MUPas = 1.789e-5
ASMPS = 340.29
TK = 288.15
PPA = 101325
