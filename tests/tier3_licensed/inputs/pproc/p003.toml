# p003: p001 without the BLADE_AXIS entries, for a row stating more than one
# rotor. A multi-rotor row creates no blade-axis frame (PFS-2029.11.03), so a
# pproc citing one is refused at plan time naming the frames the run creates;
# this artifact keeps the groups, the wing section, the MRP and per-rotor plots
# and the probes, and drops the two blade-axis entries.
[groups]
"1" = ["Wing", "Body", "Base", "Blade1", "Blade2"]
"2" = ["Wing"]
"3" = ["Body", "Base"]
"4" = ["Blade1", "Blade2"]
"5" = ["Base"]

[exports]

[sections]
count = 20
plot_direction = 1
include_symmetry = false

[[sections.distributions]]
families = ["Wing"]
frame = "MRP"
planes = ["XZ"]

[plots]
parameters = ["CL", "CDI", "CDO", "CD", "FX", "FY", "FZ", "MX", "MY", "MZ"]

[[plots.groups]]
name = "MRP_TOTAL"
frame = "MRP"
families = "all"

[[plots.groups]]
name = "MRP_AIRFRAME"
frame = "MRP"
families = "airframe"

[[plots.groups]]
name = "MRP_{family}"
frame = "MRP"
families = "each"

[[plots.groups]]
name = "ROTOR_{family}"
frame = "SMRP"
families = "all"

[[plots.groups]]
name = "PROP_{family}"
frame = "LOCAL_AXIS"
families = "blades"

[probes]
frame = "PUSHER_SMRP"
parameters = ["MACH", "VELOCITY", "VX", "VY", "VZ", "STATIC_PRESSURE_RATIO"]
points = 15
scale = "rotor_radius"

[[probes.lines]]
start = [-1.0, -1.2, 0.0]
end = [-1.0, 1.2, 0.0]

[[probes.lines]]
start = [0.5, -1.2, 0.0]
end = [0.5, 1.2, 0.0]
