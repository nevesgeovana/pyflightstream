# p001: the full post-processing set, groups, sections, plots and probes,
# written once and filtered by the builders to the families each geometry
# carries: a family the opened file does not have is left out, an entry
# resolving to no family is skipped, and BLADE_AXIS entries need a rotor.
[groups]
# The group tables the products are written per, one table per entry; the
# families are the synthetic geometries' boundary names.
"1" = ["Wing", "Body", "Base", "Blade1", "Blade2"]
"2" = ["Wing"]
"3" = ["Body", "Base"]
"4" = ["Blade1", "Blade2"]
"5" = ["Base"]

[exports]
# All eight export kinds are written unless one is set to false here.

[sections]
count = 20
plot_direction = 1
include_symmetry = false

[[sections.distributions]]
families = ["Wing"]
frame = "MRP"
planes = ["XZ"]
# Along the span in the MRP frame, root to tip of the wing this row runs.
extent_m = [0.0, -10.0]

[[sections.distributions]]
families = "blades"
frame = "LOCAL_AXIS"
planes = ["XY"]
# Along the blade in its own axes, root to tip.
extent_m = [0.0, 1.8288]

[plots]
# One force plot per group and parameter, named {parameter}_{group}; the
# four coefficients in COEFFICIENTS and the six loads in NEWTONS.
parameters = ["CL", "CDI", "CDO", "CD", "FX", "FY", "FZ", "MX", "MY", "MZ"]

[[plots.groups]]
name = "MRP_TOTAL"
frame = "MRP"
families = "all"

[[plots.groups]]
name = "MRP_AIRFRAME"
frame = "MRP"
families = "airframe"

[[plots.groups]]
name = "MRP_{family}"
frame = "MRP"
families = "each"

[[plots.groups]]
name = "ROTOR_{family}"
frame = "SMRP"
families = "all"

[[plots.groups]]
name = "PROP_{family}"
frame = "LOCAL_AXIS"
families = "blades"

[[plots.groups]]
name = "LOCAL_{family}"
frame = "LOCAL_AXIS"
families = "blades"

[probes]
# Three lines across the rotor disk, in rotor radii of the reference,
# 15 vertices each.
frame = "ROTOR_SMRP"
parameters = ["MACH", "VELOCITY", "VX", "VY", "VZ", "STATIC_PRESSURE_RATIO"]
points = 15
scale = "rotor_radius"

[[probes.lines]]
start = [-1.0, -1.2, 0.0]
end = [-1.0, 1.2, 0.0]

[[probes.lines]]
start = [0.5, -1.2, 0.0]
end = [0.5, 1.2, 0.0]

[[probes.lines]]
start = [1.0, 0.0, -1.2]
end = [1.0, 0.0, 1.2]
